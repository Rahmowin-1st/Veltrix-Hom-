name: Veltrix Hom V20 Android

on:
  workflow_dispatch:
  push:
    branches:
      - agent/v20-final-android-build
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: veltrix-v20-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_GOOGLE_WEB_CLIENT_ID: ${{ secrets.VITE_GOOGLE_WEB_CLIENT_ID }}

    steps:
      - name: Checkout V20
        uses: actions/checkout@v4

      - name: Reconstruct V20 source
        shell: bash
        run: |
          mkdir -p build-source
          cat .v20-parts/part-* > "$RUNNER_TEMP/veltrix-hom-v20-final.zip"
          echo "bf3a32f52849be873c68d5e7214f0f80ebdd0928eee6ecad5bb06bce285fae72  $RUNNER_TEMP/veltrix-hom-v20-final.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/veltrix-hom-v20-final.zip" -d build-source
          test -f build-source/veltrix-hom-v20-final/package-lock.json

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: build-source/veltrix-hom-v20-final/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        working-directory: build-source/veltrix-hom-v20-final
        run: npm ci

      - name: Use safe CI placeholders when public runtime config is absent
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL=https://ci-placeholder.supabase.co" >> "$GITHUB_ENV"
            echo "::warning::VITE_SUPABASE_URL is not configured; APK is build-validation only."
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "VITE_SUPABASE_ANON_KEY=ci-public-placeholder" >> "$GITHUB_ENV"
            echo "::warning::VITE_SUPABASE_ANON_KEY is not configured; APK is build-validation only."
          fi
          if [ -z "$VITE_API_URL" ]; then
            echo "VITE_API_URL=https://veltrix-hom-server.onrender.com" >> "$GITHUB_ENV"
          fi
          if [ -z "$VITE_GOOGLE_WEB_CLIENT_ID" ]; then
            echo "VITE_GOOGLE_WEB_CLIENT_ID=ci-placeholder.apps.googleusercontent.com" >> "$GITHUB_ENV"
            echo "::warning::VITE_GOOGLE_WEB_CLIENT_ID is not configured; native Google sign-in will not work in this artifact."
          fi

      - name: Typecheck
        working-directory: build-source/veltrix-hom-v20-final
        run: npm run typecheck

      - name: Unit tests
        working-directory: build-source/veltrix-hom-v20-final
        run: npm test

      - name: Build web assets and sync Capacitor
        working-directory: build-source/veltrix-hom-v20-final
        run: npm run cap:sync

      - name: Build Android debug APK and release AAB
        working-directory: build-source/veltrix-hom-v20-final/android
        run: ./gradlew assembleDebug bundleRelease --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Veltrix-Hom-V20-debug-APK
          path: build-source/veltrix-hom-v20-final/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Veltrix-Hom-V20-release-AAB-unsigned
          path: build-source/veltrix-hom-v20-final/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
