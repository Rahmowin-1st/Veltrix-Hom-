name: Veltrix V4 Minimal Runner Proof

on:
  push:
    branches:
      - veltrix-calculator-backend-v4-reset
    paths:
      - '.github/workflows/v4-runner-proof.yml'

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Persist runner proof
        run: |
          set -euxo pipefail
          BR="evidence/v4-runner-${GITHUB_SHA}"
          mkdir -p .ci/v4-runner-probes
          printf 'source_sha=%s\nrun_id=%s\njob=%s\nrunner_name=%s\nrunner_os=%s\nstatus=EXECUTED\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB" "$RUNNER_NAME" "$RUNNER_OS" \
            > ".ci/v4-runner-probes/${GITHUB_SHA}.txt"
          git config user.name veltrix-backend-bot
          git config user.email veltrix-backend-bot@users.noreply.github.com
          git add ".ci/v4-runner-probes/${GITHUB_SHA}.txt"
          git commit -m "evidence(v4): hosted runner proof ${GITHUB_SHA}"
          git push origin "HEAD:refs/heads/$BR"
