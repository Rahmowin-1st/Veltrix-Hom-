name: Veltrix V4 Final Run Discovery

on:
  push:
    branches:
      - veltrix-calculator-backend-v4-reset
    paths:
      - 'calculator-v4/docs/V4_FINAL_GATE_READY'

permissions:
  contents: write
  actions: write

jobs:
  repair-and-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-calculator-backend-v4-reset
          fetch-depth: 0
      - name: Repair fail-closed pid probe and dispatch exact final clean
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          BR=veltrix-calculator-backend-v4-reset
          WF=.github/workflows/veltrix-v4-final-clean.yml
          git config user.name veltrix-backend-bot
          git config user.email veltrix-backend-bot@users.noreply.github.com
          git fetch origin "$BR"
          git checkout -B "$BR" "origin/$BR"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/veltrix-v4-final-clean.yml')
          s = p.read_text()
          old = 'CURRENT="$(adb shell pidof com.veltrix.calculator 2>/dev/null | tr -d \'\\r\')"'
          new = 'CURRENT="$(adb shell pidof com.veltrix.calculator 2>/dev/null | tr -d \'\\r\' || true)"'
          count = s.count(old)
          if count != 2:
              raise SystemExit(f'expected exactly 2 vulnerable CURRENT probes, found {count}')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
          git add "$WF"
          git commit -m "ci(v4): make empty pid probe non-fatal in process-death proof"
          git push origin "HEAD:$BR"
          SOURCE_SHA="$(git rev-parse HEAD)"
          gh workflow run veltrix-v4-final-clean.yml --ref "$BR"
          printf 'dispatched_source_sha=%s\ncontroller_run_id=%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID"
