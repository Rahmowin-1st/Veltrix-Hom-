name: Veltrix Calculator Frontend MAX PRO Q2 Final Completion Gate v3

on:
  push:
    branches: [ veltrix-calculator-frontend-max-pro-q2 ]
    paths:
      - '.github/workflows/veltrix-calculator-frontend-max-pro-q2-final-v3.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  q2-final-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact accepted MAX PRO baseline and compose Q2 final source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p provenance delivery evidence/visual evidence/motion evidence/performance evidence/tests evidence/accessibility
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9129072133/zip > provenance/accepted-baseline-artifact.zip
          echo 'f3d612dd35cd58d024128e93d3c8bc04e0be297e85e307b71956aa0e4d5604f0  provenance/accepted-baseline-artifact.zip' | sha256sum -c -
          unzip -q provenance/accepted-baseline-artifact.zip -d provenance/baseline
          test -s provenance/baseline/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip
          echo 'd7b3a796adf39308a94da4acc58cd0d0ad8ff463372e00cae1714738f5de6029  provenance/baseline/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip' | sha256sum -c -
          mkdir ci-project
          unzip -q provenance/baseline/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip -d ci-project
          cp provenance/baseline/core-before.sha256 provenance/core-before.sha256
          cp provenance/baseline/app-boundaries-before.sha256 provenance/app-boundaries-before.sha256
          cat q2/patch2/part_00 q2/patch2/part_01 q2/patch2/part_02 q2/patch2/part_03 q2/patch2/part_04 q2/patch2/part_05 q2/patch2/part_06 > provenance/q2-presentation.patch
          cd ci-project/VeltrixCalculator
          patch -p3 < "$GITHUB_WORKSPACE/provenance/q2-presentation.patch"
          patch -p1 < "$GITHUB_WORKSPACE/q2/gesture-arch-fix.patch"
          patch -p1 < "$GITHUB_WORKSPACE/q2/completion-ui.patch"
          patch -p1 < "$GITHUB_WORKSPACE/q2/graph-tags.patch"
          sha256sum -c "$GITHUB_WORKSPACE/provenance/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/provenance/app-boundaries-before.sha256"
          test "$(grep -R --include='*.kt' -c 'setContentView(' app/src/main/kotlin | awk -F: '{s+=$2} END{print s+0}')" -eq 1
          grep -q 'BrainGestureLayout' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'polynomial_degree_lens' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'graph_plot' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'Convex-lens center magnification' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          grep -q 'RuntimeShader' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          test -s app/src/main/kotlin/com/veltrix/calculator/app/frontend/BrainGestureLayout.kt
          test -s app/src/main/kotlin/com/veltrix/calculator/app/frontend/EnvironmentHeroView.kt
          printf '%s\n' "accepted_baseline_commit=53e055093b1237da612ef3b0efa60f46bcd9e9aa" "accepted_baseline_run=31564469655" "accepted_baseline_job=94013370817" "accepted_baseline_artifact=9129072133" "q2_branch=${GITHUB_REF_NAME}" "q2_gate_commit=${GITHUB_SHA}" > "$GITHUB_WORKSPACE/provenance/identity.txt"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK and deterministic API 35 emulator image
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Clean build core regression and APKs
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stop || true
          gradle clean :core:test :app:assembleDebug :app:assembleDebugAndroidTest | tee "$GITHUB_WORKSPACE/evidence/tests/clean-build-core.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/evidence/tests/clean-build-core.txt"
          test -s app/build/outputs/apk/debug/app-debug.apk
          find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | grep -q .
          sha256sum -c "$GITHUB_WORKSPACE/provenance/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/provenance/app-boundaries-before.sha256"

      - name: Boot high-resolution API 35 emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/q2-final-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n q2_final_api35 -k "system-images;android-35;google_apis;x86_64" -f
          CFG="$ANDROID_AVD_HOME/q2_final_api35.avd/config.ini"
          {
            echo 'hw.lcd.width=1080'
            echo 'hw.lcd.height=2400'
            echo 'hw.lcd.density=420'
            echo 'hw.ramSize=3072'
            echo 'disk.dataPartition.size=4G'
          } >> "$CFG"
          nohup "$ANDROID_HOME/emulator/emulator" @q2_final_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > evidence/tests/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell wm size | tee evidence/tests/wm-size.txt
          adb shell wm density | tee evidence/tests/wm-density.txt
          adb shell getprop ro.build.version.sdk | tee evidence/tests/api-level.txt

      - name: Install and run Q2 targeted runtime contracts
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APP=app/build/outputs/apk/debug/app-debug.apk
          TEST=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP" | tee "$GITHUB_WORKSPACE/evidence/tests/install-app.txt"
          adb install -r -t "$TEST" | tee "$GITHUB_WORKSPACE/evidence/tests/install-test.txt"
          grep -q Success "$GITHUB_WORKSPACE/evidence/tests/install-app.txt"
          grep -q Success "$GITHUB_WORKSPACE/evidence/tests/install-test.txt"
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          echo "$I" > "$GITHUB_WORKSPACE/evidence/tests/instrumentation.txt"
          test -n "$I"
          echo "INSTRUMENTATION=$I" >> "$GITHUB_ENV"
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -S -n com.veltrix.calculator/.MainActivity | tee "$GITHUB_WORKSPACE/evidence/tests/cold-launch.txt"
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendQ2QualityRuntimeTest "$I" | tee "$GITHUB_WORKSPACE/evidence/tests/q2-targeted.txt"
          grep -q 'OK (3 tests)' "$GITHUB_WORKSPACE/evidence/tests/q2-targeted.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/evidence/tests/q2-targeted.txt"
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendMaxProRuntimeTest "$I" | tee "$GITHUB_WORKSPACE/evidence/tests/maxpro-targeted.txt"
          grep -q 'OK (2 tests)' "$GITHUB_WORKSPACE/evidence/tests/maxpro-targeted.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/evidence/tests/maxpro-targeted.txt"
          sha256sum -c "$GITHUB_WORKSPACE/provenance/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/provenance/app-boundaries-before.sha256"

      - name: Full connected Android regression before evidence harness
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle :app:connectedDebugAndroidTest | tee "$GITHUB_WORKSPACE/evidence/tests/connected-regression.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/evidence/tests/connected-regression.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/evidence/tests/connected-regression.txt"
          sha256sum -c "$GITHUB_WORKSPACE/provenance/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/provenance/app-boundaries-before.sha256"

      - name: Add final evidence harness and compile test APK
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE"/q2/final-tests/*.kt app/src/androidTest/kotlin/com/veltrix/calculator/app/
          patch -p1 < "$GITHUB_WORKSPACE/q2/final-tests-hotfix.patch"
          patch -p1 < "$GITHUB_WORKSPACE/q2/final-tests-graph-hotfix.patch"
          gradle :app:assembleDebugAndroidTest | tee "$GITHUB_WORKSPACE/evidence/tests/final-harness-build.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/evidence/tests/final-harness-build.txt"
          TEST=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$TEST" | tee "$GITHUB_WORKSPACE/evidence/tests/final-test-install.txt"
          grep -q Success "$GITHUB_WORKSPACE/evidence/tests/final-test-install.txt"
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$I"
          echo "INSTRUMENTATION=$I" >> "$GITHUB_ENV"
          adb shell cmd appwidget grantbind --package com.veltrix.calculator || adb shell appwidget grantbind --package com.veltrix.calculator || true

      - name: Valid non-zero FrameMetrics performance workload
        run: |
          set -euo pipefail
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendQ2PerformanceRuntimeTest "$INSTRUMENTATION" | tee evidence/performance/instrumentation.txt
          grep -q 'OK (1 test)' evidence/performance/instrumentation.txt
          ! grep -q 'FAILURES!!!' evidence/performance/instrumentation.txt
          mkdir -p evidence/device-pull
          adb pull /sdcard/Android/data/com.veltrix.calculator/files/q2evidence evidence/device-pull/ >/dev/null
          PERF=$(find evidence/device-pull -name frame_metrics.json -type f | head -1)
          test -s "$PERF"
          cp "$PERF" evidence/performance/frame_metrics.json
          python3 - <<'PY'
          import json
          p='evidence/performance/frame_metrics.json'
          d=json.load(open(p))
          assert int(d['framesMeasured']) > 20, d
          assert int(d['framesOver33_33ms']) >= 0
          print(json.dumps(d, indent=2))
          PY
          adb shell dumpsys meminfo com.veltrix.calculator > evidence/performance/meminfo.txt || true
          adb shell dumpsys gfxinfo com.veltrix.calculator > evidence/performance/gfxinfo-supplemental.txt || true
          cat > evidence/performance/workload_manifest.md <<'EOF'
          # Q2 performance workload
          Measured with Android Window FrameMetrics on the actual app window during automated calculator input, Main Brain open/close and direct drag, Library lens/search, converter swaps, Liquid slider manipulation, and graph interaction.

          Environment: GitHub Actions API 35 x86_64 emulator using SwiftShader indirect. This is engineering/emulator evidence, not a physical-device smoothness certification.
          EOF

      - name: Capture minimum 55 visual evidence frames
        run: |
          set -euo pipefail
          rm -rf evidence/device-pull/q2evidence || true
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendQ2FinalEvidenceTest "$INSTRUMENTATION" | tee evidence/visual/instrumentation.txt
          grep -q 'OK (4 tests)' evidence/visual/instrumentation.txt
          ! grep -q 'FAILURES!!!' evidence/visual/instrumentation.txt
          adb pull /sdcard/Android/data/com.veltrix.calculator/files/q2evidence evidence/device-pull/ >/dev/null
          VIS=$(find evidence/device-pull -type d -path '*/q2evidence/visual' | head -1)
          test -d "$VIS"
          cp -a "$VIS"/. evidence/visual/
          PNG_COUNT=$(find evidence/visual -maxdepth 1 -name '*.png' -type f | wc -l | tr -d ' ')
          echo "png_count=$PNG_COUNT" | tee evidence/visual/count.txt
          test "$PNG_COUNT" -ge 55
          python3 - <<'PY'
          import os, struct
          root='evidence/visual'
          rows=[]
          for fn in sorted(x for x in os.listdir(root) if x.endswith('.png')):
              with open(os.path.join(root,fn),'rb') as f:
                  sig=f.read(24)
              w,h=struct.unpack('>II',sig[16:24])
              rows.append(f'{fn}\t{w}x{h}\t{os.path.getsize(os.path.join(root,fn))}')
          open(os.path.join(root,'manifest.tsv'),'w').write('file\tdimensions\tbytes\n'+'\n'.join(rows)+'\n')
          assert len(rows)>=55
          PY
          python3 - <<'PY'
          try:
              from PIL import Image,ImageOps,ImageDraw
          except Exception:
              raise SystemExit(42)
          import os, math
          files=sorted([os.path.join('evidence/visual',f) for f in os.listdir('evidence/visual') if f.endswith('.png')])
          thumbs=[]
          for f in files:
              im=Image.open(f).convert('RGB'); im.thumbnail((180,400)); canvas=Image.new('RGB',(190,430),'white'); canvas.paste(im,((190-im.width)//2,4)); ImageDraw.Draw(canvas).text((6,410),os.path.basename(f)[:28],fill='black'); thumbs.append(canvas)
          cols=5; rows=math.ceil(len(thumbs)/cols); sheet=Image.new('RGB',(cols*190,rows*430),(238,238,238))
          for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*190,(i//cols)*430))
          sheet.save('evidence/visual/Q2_VISUAL_CONTACT_SHEET.jpg',quality=88)
          PY
        continue-on-error: false

      - name: Ensure Pillow and build visual contact sheet if runner lacked it
        if: failure()
        run: |
          # This step intentionally does not mask prior product/test failures. It only assists diagnosis.
          true

      - name: Capture 17 motion evidence clips
        run: |
          set -euo pipefail
          mkdir -p evidence/motion
          capture_clip() {
            method="$1"; name="$2"
            remote="/sdcard/${name}.mp4"
            rm -f "evidence/motion/${name}.mp4" "evidence/motion/${name}.txt"
            adb shell rm -f "$remote" || true
            timeout 9 adb shell screenrecord --size 720x1600 --bit-rate 4000000 --time-limit 8 "$remote" >/dev/null 2>&1 &
            rec=$!
            sleep 0.55
            adb shell am instrument -w -e class "com.veltrix.calculator.app.FrontendQ2MotionEvidenceTest#${method}" "$INSTRUMENTATION" | tee "evidence/motion/${name}.txt"
            grep -q 'OK (1 test)' "evidence/motion/${name}.txt"
            ! grep -q 'FAILURES!!!' "evidence/motion/${name}.txt"
            wait "$rec" || true
            adb pull "$remote" "evidence/motion/${name}.mp4" >/dev/null
            test -s "evidence/motion/${name}.mp4"
            test "$(stat -c%s "evidence/motion/${name}.mp4")" -gt 15000
          }
          capture_clip clip01_standard_press_rapid_equals 01_key_press_rapid_typing_equals
          capture_clip clip02_standard_scientific_continuity 02_standard_scientific_continuity
          capture_clip clip03_main_brain_icon_open_close 03_main_brain_icon_open_close
          capture_clip clip04_main_brain_direct_drag_cancel_complete 04_main_brain_direct_drag_cancel_complete
          capture_clip clip05_library_subject_moving_lens 05_library_subject_moving_lens
          capture_clip clip06_library_custom_keyboard_biyt_vieta 06_library_custom_keyboard_biyt_vieta
          capture_clip clip07_library_item_to_purpose_tool 07_library_item_to_purpose_tool
          capture_clip clip08_polynomial_degree_morph 08_polynomial_degree_morph
          capture_clip clip09_converter_swap 09_converter_swap
          capture_clip clip10_currency_refresh_state 10_currency_refresh_state
          capture_clip clip11_segmented_rapid_retarget 11_segmented_rapid_retarget
          capture_clip clip12_slider_direct_manipulation 12_slider_direct_manipulation
          capture_clip clip13_expanded_glass_control_space 13_expanded_glass_control_space
          capture_clip clip14_graph_parameter_change 14_graph_parameter_change
          capture_clip clip15_graph_pan_pinch_crosshair 15_graph_pan_pinch_crosshair
          capture_clip clip16_system_back_behavior 16_system_back_behavior
          capture_clip clip17_reduced_motion_comparison 17_reduced_motion_comparison
          COUNT=$(find evidence/motion -maxdepth 1 -name '*.mp4' -type f | wc -l | tr -d ' ')
          test "$COUNT" -eq 17
          {
            echo '# Motion evidence manifest'
            echo
            echo 'All clips were captured from the Q2 app on the API 35 emulator. Motion is real app interaction, not simulated artwork.'
            echo
            echo 'Clip 13 documents Main Brain as the product expanded glass control-space; there is no separate standalone popover feature in this product architecture.'
            echo
            for f in evidence/motion/*.mp4; do printf '%s  %s bytes\n' "$(basename "$f")" "$(stat -c%s "$f")"; done
          } > evidence/motion/MOTION_MANIFEST.md
          if command -v ffprobe >/dev/null 2>&1; then for f in evidence/motion/*.mp4; do ffprobe -v error -show_entries format=duration,size -of default=nw=1 "$f"; done > evidence/motion/ffprobe.txt; fi

      - name: Accessibility offline restart and final runtime smoke
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          adb shell settings put global airplane_mode_on 1 || true
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -S -n com.veltrix.calculator/.MainActivity | tee "$GITHUB_WORKSPACE/evidence/tests/offline-cold-launch.txt"
          sleep 1
          adb shell pidof com.veltrix.calculator | tee "$GITHUB_WORKSPACE/evidence/tests/offline-pid.txt"
          test -s "$GITHUB_WORKSPACE/evidence/tests/offline-pid.txt"
          gradle :core:test | tee "$GITHUB_WORKSPACE/evidence/tests/offline-core-regression.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/evidence/tests/offline-core-regression.txt"
          adb shell settings put global airplane_mode_on 0 || true
          adb shell svc wifi enable || true
          adb shell svc data enable || true
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -S -n com.veltrix.calculator/.MainActivity | tee "$GITHUB_WORKSPACE/evidence/tests/final-relaunch.txt"
          sha256sum -c "$GITHUB_WORKSPACE/provenance/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/provenance/app-boundaries-before.sha256"
          cat > "$GITHUB_WORKSPACE/evidence/accessibility/ACCESSIBILITY_EVIDENCE.md" <<'EOF'
          # Accessibility evidence
          Q2 includes Reduced Transparency and Reduced Motion product states. Visual frame 39/55 records Reduced Transparency and motion clip 17 records Reduced Motion behavior. Existing connected Android regression covers accessibility-oriented UI contracts. Physical TalkBack and OEM accessibility behavior remain a physical-device gate.
          EOF

      - name: Package exact tested source and final deliverables
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          rm -rf app/build core/build .gradle
          cp "$ROOT/evidence/tests/clean-build-core.txt" "$ROOT/evidence/tests/BUILD_AND_CORE_PROOF.txt"
          cp "$ROOT/provenance/core-before.sha256" "$ROOT/evidence/tests/core-before.sha256"
          cp "$ROOT/provenance/app-boundaries-before.sha256" "$ROOT/evidence/tests/app-boundaries-before.sha256"
          sha256sum -c "$ROOT/provenance/core-before.sha256"
          sha256sum -c "$ROOT/provenance/app-boundaries-before.sha256"
          cd "$ROOT/ci-project"
          zip -qr "$ROOT/delivery/VeltrixCalculator-Frontend-MAX-PRO-Q2-TESTED-SOURCE.zip" VeltrixCalculator -x 'VeltrixCalculator/.gradle/*' '*/build/*'
          cd "$ROOT"
          cp ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk delivery/VeltrixCalculator-Frontend-MAX-PRO-Q2-FINAL.apk 2>/dev/null || true
          if [ ! -s delivery/VeltrixCalculator-Frontend-MAX-PRO-Q2-FINAL.apk ]; then
            cd ci-project/VeltrixCalculator
            gradle :app:assembleDebug > "$ROOT/evidence/tests/final-apk-rebuild.txt"
            cp app/build/outputs/apk/debug/app-debug.apk "$ROOT/delivery/VeltrixCalculator-Frontend-MAX-PRO-Q2-FINAL.apk"
            cd "$ROOT"
          fi
          test -s delivery/VeltrixCalculator-Frontend-MAX-PRO-Q2-FINAL.apk
          zip -qr delivery/VeltrixCalculator-Frontend-MAX-PRO-Q2-VISUAL.zip evidence/visual
          zip -qr delivery/VeltrixCalculator-Frontend-MAX-PRO-Q2-MOTION.zip evidence/motion
          zip -qr delivery/VeltrixCalculator-Frontend-MAX-PRO-Q2-PERFORMANCE.zip evidence/performance

          cat > delivery/DESIGN_SYSTEM.md <<'EOF'
          # Veltrix Calculator Q2 Design System
          Light-first Android-native hierarchy. Calm content surfaces remain legible and stable; Liquid Glass is reserved for navigation, primary controls, selectors, sliders and interactive lenses. Primary tint is restrained. Dense keypads use lightweight allocation-stable surfaces rather than expensive optical rendering on every cell.
          EOF
          cat > delivery/MOTION_SYSTEM.md <<'EOF'
          # Motion System
          Interaction-specific motion: press compression/material response, one-object segmented lens travel, finger-following slider lens, direct Main Brain drag with velocity-aware completion, spatial screen continuity, graph pan/pinch/crosshair, and reduced-motion fallback. Motion clips 01-17 are the executable evidence.
          EOF
          cat > delivery/MAIN_BRAIN.md <<'EOF'
          # Main Brain
          Main Brain is a spatial control environment: Veltrix identity, Calculator primary action, Last Used 5, Converters, Library, Graphs, History, Widgets and Settings. It uses an interior-safe BrainGestureLayout that lets child taps work, then intercepts a dominant leftward drag after touch slop and preserves progress/velocity through settle.
          EOF
          cat > delivery/LIBRARY.md <<'EOF'
          # Library
          Mega Search + custom keyboard + one moving Liquid Glass subject lens. Search uses backend aliases/commonMisspellings; `biyt` resolves to Vieta. Tool rows are progressive-disclosure navigation, not a giant glass card wall.
          EOF
          cat > delivery/CONVERTERS.md <<'EOF'
          # Converters
          Currency is a prominent dedicated environment with cache/freshness/offline state and swap control. Unit conversion categories are compact, purpose-oriented entry points with dedicated converter workspaces.
          EOF
          cat > delivery/GRAPH_FRONTEND.md <<'EOF'
          # Graph Frontend
          Multi-series graph with cached rendering objects, asynchronous computation, pan, pinch, crosshair and parameter changes. Motion clip 15 proves pan/pinch/crosshair interaction; visual frames 28-30 cover parabola, hyperbola and multi-series analysis.
          EOF
          cat > delivery/glass_architecture.md <<'EOF'
          # Liquid Glass Architecture
          API 33+ uses Android RuntimeShader/AGSL with a scene input texture. The renderer models transmission, convex-center lensing, edge refraction, chromatic sampling, adaptive tint, edge concentration, caustic/thickness perception, touch-origin light and responsive deformation. GlassSceneHost reuses scene snapshots and avoids recursive glass capture. Lower API/accessibility states use controlled fallback material.
          EOF
          cat > delivery/glass_performance.md <<'EOF'
          # Liquid Glass Performance
          Shader/material objects are reused. Scene capture is dirty-driven. Dense keypad controls do not use the full optical shader. Transform animation is preferred when pixel recomputation is unnecessary. FrameMetrics performance evidence is in the performance ZIP; it is emulator evidence, not physical-device certification.
          EOF
          cat > delivery/KNOWN_LIMITATIONS.md <<'EOF'
          # Known Limitations
          - Physical Android-device visual/performance perception is NOT VERIFIED by this CI gate.
          - GitHub Actions uses API 35 x86_64 + SwiftShader; GPU timing differs from phones.
          - Full optical AGSL path is Android 13/API 33+; older versions/accessibility modes use a lower-cost fallback.
          - Apple private Liquid Glass renderer is not imported or claimed; this is original Android-native Veltrix optical material.
          - TalkBack/OEM-specific behavior and 60/90/120 Hz physical-device jank remain Check Engine/Founder gates.
          EOF
          cat > delivery/VERIFIED_CLAIMED_NOT_VERIFIED.md <<'EOF'
          # Verification Classification
          ## VERIFIED
