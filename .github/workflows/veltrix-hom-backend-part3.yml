name: Veltrix Hom Backend Part 3

on:
  push:
    branches:
      - veltrix-hom-backend-part3-conversations-fastask-tools
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-hom-backend-part3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veltrix_ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: server
    env:
      GEMINI_API_KEY: ci-placeholder-not-a-secret
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-secret
      APP_HMAC_SECRET: ci-only-placeholder-secret-0123456789abcdef0123456789abcdef
      APP_ENV: test
      GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: veltrix_ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Verify accepted Part 2 ancestry
        run: |
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor 8553ea370dc9a4813ae4e3bbcf9b241ebd435f80 "$GITHUB_SHA"
          echo "PART3_ACCEPTED_PART2_ANCESTOR=PASS sha=8553ea370dc9a4813ae4e3bbcf9b241ebd435f80"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Production dependency security audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --audit-level=high 2>&1 | tee audit.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce production high-severity audit
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
      - name: Accepted Part 2 real PostgreSQL race/bootstrap regression
        id: p2_races
        shell: bash
        run: |
          set +e
          bash scripts/part2-race-evidence.sh 2>&1 | tee part2-race.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce accepted Part 2 race/bootstrap regression
        if: steps.p2_races.outputs.exit_code != '0'
        run: exit 1
      - name: Apply Part 3 migrations
        id: p3_migrations
        shell: bash
        run: |
          set +e
          {
            for migration in \
              src/db/migration-115-vh-part3-conversations.sql \
              src/db/migration-116-vh-part3-conversation-hardening.sql \
              src/db/migration-117-vh-part3-streaming-state.sql \
              src/db/migration-118-vh-part3-interactions.sql; do
              echo "APPLY_MIGRATION=$(basename "$migration")"
              psql -X -v ON_ERROR_STOP=1 -f "$migration"
            done
            echo "PART3_MIGRATIONS=PASS through=118"
          } 2>&1 | tee part3-migrations.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce Part 3 migrations
        if: steps.p3_migrations.outputs.exit_code != '0'
        run: exit 1
      - name: Accepted Part 2 PostgreSQL acceptance regression
        id: p2_acceptance
        shell: bash
        run: |
          set +e
          bash scripts/part2-acceptance-evidence.sh 2>&1 | tee part2-acceptance.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce accepted Part 2 acceptance regression
        if: steps.p2_acceptance.outputs.exit_code != '0'
        run: exit 1
      - name: Accepted Part 2 canonical source matrix regression
        id: p2_source_matrix
        shell: bash
        run: |
          set +e
          bash scripts/part2-source-matrix-evidence.sh 2>&1 | tee part2-source-matrix.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce accepted Part 2 source matrix regression
        if: steps.p2_source_matrix.outputs.exit_code != '0'
        run: exit 1
      - name: Part 3 real PostgreSQL Conversation core evidence
        id: p3_core
        shell: bash
        run: |
          set +e
          bash scripts/part3-core-evidence.sh 2>&1 | tee part3-core.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce Part 3 core evidence
        if: steps.p3_core.outputs.exit_code != '0'
        run: exit 1
      - name: Part 3 real PostgreSQL typed-stream evidence
        id: p3_stream
        shell: bash
        run: |
          set +e
          bash scripts/part3-stream-evidence.sh 2>&1 | tee part3-stream.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce Part 3 typed-stream evidence
        if: steps.p3_stream.outputs.exit_code != '0'
        run: exit 1
      - name: Part 3 real PostgreSQL inline interaction evidence
        id: p3_interactions
        shell: bash
        run: |
          set +e
          bash scripts/part3-interactions-evidence.sh 2>&1 | tee part3-interactions.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce Part 3 inline interaction evidence
        if: steps.p3_interactions.outputs.exit_code != '0'
        run: exit 1
      - name: Relevant accepted performance regression
        id: performance
        shell: bash
        run: |
          set +e
          bash scripts/part2-performance-evidence.sh 2>&1 | tee part2-performance.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce performance regression
        if: steps.performance.outputs.exit_code != '0'
        run: exit 1
      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce typecheck
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
      - name: Part 3 typed-stream unit contracts
        id: p3_stream_tests
        shell: bash
        run: |
          set +e
          npx vitest run src/v1/part3Streaming.test.ts --reporter=verbose 2>&1 | tee part3-stream-test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce Part 3 typed-stream unit contracts
        if: steps.p3_stream_tests.outputs.exit_code != '0'
        run: exit 1
      - name: Part 3 typed block registry contracts
        id: p3_blocks
        shell: bash
        run: |
          set +e
          npx vitest run src/v1/part3Blocks.test.ts --reporter=verbose 2>&1 | tee part3-blocks-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            echo "PART3_BLOCK_REGISTRY=PASS version=1 writing=pass code=pass function=pass map=pass template=pass unknown_inert=pass" | tee -a part3-blocks-test.log
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce Part 3 typed block registry contracts
        if: steps.p3_blocks.outputs.exit_code != '0'
        run: exit 1
      - name: Part 3 Stage 50 interaction unit contracts
        id: p3_interaction_tests
        shell: bash
        run: |
          set +e
          npx vitest run src/v1/part3Interactions.test.ts --reporter=verbose 2>&1 | tee part3-interactions-test.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            echo "PART3_INTERACTION_CONTRACTS=PASS interactive_test=pass client_cannot_score=pass proposal_confirm=pass global_persistence_deferred=pass" | tee -a part3-interactions-test.log
          fi
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce Part 3 Stage 50 interaction unit contracts
        if: steps.p3_interaction_tests.outputs.exit_code != '0'
        run: exit 1
      - name: Unit and regression tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test -- --reporter=verbose 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce tests
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
      - name: Build
        id: build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Enforce build
        if: steps.build.outputs.exit_code != '0'
        run: exit 1
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-part3-diagnostics-${{ github.sha }}
          path: |
            server/audit.log
            server/part2-race.log
            server/project-race-a.log
            server/project-race-b.log
            server/quota-race-a.log
            server/quota-race-b.log
            server/part3-migrations.log
            server/part2-acceptance.log
            server/part2-source-matrix.log
            server/part3-core.log
            server/part3-stream.log
            server/part3-stream-race-a.log
            server/part3-stream-race-b.log
            server/part3-interactions.log
            server/part2-performance.log
            server/typecheck.log
            server/part3-stream-test.log
            server/part3-blocks-test.log
            server/part3-interactions-test.log
            server/test.log
            server/build.log
          if-no-files-found: warn
          retention-days: 7
      - name: Package exact tested source and evidence manifest
        if: success()
        shell: bash
        run: |
          SOURCE_NAME="part3-source-${GITHUB_SHA}.zip"
          SOURCE_ZIP="$GITHUB_WORKSPACE/server/$SOURCE_NAME"
          git -C "$GITHUB_WORKSPACE" archive --format=zip --output="$SOURCE_ZIP" "$GITHUB_SHA" server .github/workflows/veltrix-hom-backend-part3.yml
          printf 'repo=Rahmowin-1st/Veltrix-Hom-\nbranch=veltrix-hom-backend-part3-conversations-fastask-tools\nsha=%s\naccepted_part2=8553ea370dc9a4813ae4e3bbcf9b241ebd435f80\naccepted_part1=72e34dc1d2e23131bd8e505f7ed53ede15ab464c\nfreeze_sha256=65ae6a2bd6a5387c2ce7bf36a51c55c840af661e2733cd975d5dcbd04453e798\nnode=%s\nnpm=%s\nworkflow_run=%s\n' "$GITHUB_SHA" "$(node --version)" "$(npm --version)" "$GITHUB_RUN_ID" > PART3_CI_EVIDENCE.txt
          sha256sum PART3_ARCHITECTURE.md \
            src/db/migration-115-vh-part3-conversations.sql \
            src/db/migration-116-vh-part3-conversation-hardening.sql \
            src/db/migration-117-vh-part3-streaming-state.sql \
            src/db/migration-118-vh-part3-interactions.sql \
            scripts/part3-core-evidence.sh scripts/part3-stream-evidence.sh scripts/part3-interactions-evidence.sh \
            src/v1/part3Streaming.ts src/v1/part3Streaming.test.ts src/v1/part3Conversation.ts src/v1/router.ts \
            src/v1/part3Blocks.ts src/v1/part3Blocks.test.ts src/v1/part3Interactions.ts src/v1/part3Interactions.test.ts \
            part3-migrations.log part3-core.log part3-stream.log part3-interactions.log \
            part3-stream-test.log part3-blocks-test.log part3-interactions-test.log \
            part2-race.log part2-acceptance.log part2-source-matrix.log part2-performance.log \
            audit.log typecheck.log test.log build.log "$SOURCE_NAME" >> PART3_CI_EVIDENCE.txt
          printf '\n--- Part 3 migrations ---\n' >> PART3_CI_EVIDENCE.txt
          cat part3-migrations.log >> PART3_CI_EVIDENCE.txt
          printf '\n--- Part 3 core PostgreSQL evidence ---\n' >> PART3_CI_EVIDENCE.txt
          cat part3-core.log >> PART3_CI_EVIDENCE.txt
          printf '\n--- Part 3 typed streaming PostgreSQL evidence ---\n' >> PART3_CI_EVIDENCE.txt
          cat part3-stream.log >> PART3_CI_EVIDENCE.txt
          printf '\n--- Part 3 Stage 50 PostgreSQL interaction evidence ---\n' >> PART3_CI_EVIDENCE.txt
          cat part3-interactions.log >> PART3_CI_EVIDENCE.txt
          printf '\n--- Part 3 typed streaming unit contracts ---\n' >> PART3_CI_EVIDENCE.txt
          cat part3-stream-test.log >> PART3_CI_EVIDENCE.txt
          printf '\n--- Part 3 typed block registry contracts ---\n' >> PART3_CI_EVIDENCE.txt
          cat part3-blocks-test.log >> PART3_CI_EVIDENCE.txt
          printf '\n--- Part 3 Stage 50 interaction unit contracts ---\n' >> PART3_CI_EVIDENCE.txt
          cat part3-interactions-test.log >> PART3_CI_EVIDENCE.txt
          printf '\n--- accepted Part 2 race regression ---\n' >> PART3_CI_EVIDENCE.txt
          cat part2-race.log >> PART3_CI_EVIDENCE.txt
          printf '\n--- accepted Part 2 acceptance regression ---\n' >> PART3_CI_EVIDENCE.txt
          tail -n 80 part2-acceptance.log >> PART3_CI_EVIDENCE.txt
          printf '\n--- accepted Part 2 source matrix regression ---\n' >> PART3_CI_EVIDENCE.txt
          tail -n 40 part2-source-matrix.log >> PART3_CI_EVIDENCE.txt
          printf '\n--- performance regression ---\n' >> PART3_CI_EVIDENCE.txt
          tail -n 50 part2-performance.log >> PART3_CI_EVIDENCE.txt
          printf '\n--- test summary ---\n' >> PART3_CI_EVIDENCE.txt
          grep -E 'Test Files|Tests ' test.log >> PART3_CI_EVIDENCE.txt || true
      - name: Upload Part 3 evidence artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-part3-evidence-${{ github.sha }}
          path: |
            server/PART3_CI_EVIDENCE.txt
            server/PART3_ARCHITECTURE.md
            server/audit.log
            server/part2-race.log
            server/part2-acceptance.log
            server/part2-source-matrix.log
            server/part2-performance.log
            server/part3-migrations.log
            server/part3-core.log
            server/part3-stream.log
            server/part3-stream-race-a.log
            server/part3-stream-race-b.log
            server/part3-interactions.log
            server/part3-stream-test.log
            server/part3-blocks-test.log
            server/part3-interactions-test.log
            server/typecheck.log
            server/test.log
            server/build.log
            server/src/db/migration-115-vh-part3-conversations.sql
            server/src/db/migration-116-vh-part3-conversation-hardening.sql
            server/src/db/migration-117-vh-part3-streaming-state.sql
            server/src/db/migration-118-vh-part3-interactions.sql
            server/scripts/part3-core-evidence.sh
            server/scripts/part3-stream-evidence.sh
            server/scripts/part3-interactions-evidence.sh
            server/src/v1/part3Streaming.ts
            server/src/v1/part3Streaming.test.ts
            server/src/v1/part3Blocks.ts
            server/src/v1/part3Blocks.test.ts
            server/src/v1/part3Conversation.ts
            server/src/v1/part3Interactions.ts
            server/src/v1/part3Interactions.test.ts
            server/part3-source-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30
