name: Veltrix Q2 Final Gate Kickoff

on:
  push:
    branches: [ veltrix-calculator-frontend-max-pro-q2 ]
    paths:
      - '.github/workflows/veltrix-q2-final-kickoff.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exactly one Q2 v5 final gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run veltrix-calculator-frontend-max-pro-q2-final-v5.yml --ref veltrix-calculator-frontend-max-pro-q2
