name: Veltrix Q2 Final Gate Kickoff

on:
  push:
    branches: [ veltrix-calculator-frontend-max-pro-q2 ]
    paths:
      - '.github/workflows/veltrix-q2-final-kickoff.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prepare-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-calculator-frontend-max-pro-q2
          fetch-depth: 0

      - name: Compose latest gesture ownership fix into applied Q2 patch stack
        shell: bash
        run: |
          set -euo pipefail
          FILE=q2/completion-ui.patch
          if ! grep -q 'Keep ordinary expression/result taps working' "$FILE"; then
            printf '\n' >> "$FILE"
            cat q2/gesture-root-fix.patch >> "$FILE"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- "$FILE"; then
            git add "$FILE"
            git commit -m 'Apply latest Main Brain root gesture ownership fix in final patch stack'
            git push origin HEAD:veltrix-calculator-frontend-max-pro-q2
          fi

      - name: Dispatch final Q2 gate v4 at latest branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run veltrix-calculator-frontend-max-pro-q2-final-v4.yml --ref veltrix-calculator-frontend-max-pro-q2
