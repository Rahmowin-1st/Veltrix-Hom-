name: Veltrix Q2 Final Gate Kickoff

# Gate rerun after repairing final evidence hotfix patch syntax.
on:
  push:
    branches: [ veltrix-calculator-frontend-max-pro-q2 ]
    paths:
      - '.github/workflows/veltrix-q2-final-kickoff.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prepare-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-calculator-frontend-max-pro-q2
          fetch-depth: 0

      - name: Keep proven BrainGestureLayout architecture and compatibility tag fix
        shell: bash
        run: |
          set -euo pipefail
          FILE=q2/completion-ui.patch
          python3 - <<'PY'
          from pathlib import Path
          p = Path('q2/completion-ui.patch')
          s = p.read_text()
          marker = '\n--- a/app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt\n+++ b/app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt\n@@ -209,'
          i = s.find(marker)
          if i >= 0:
              s = s[:i].rstrip() + '\n'
              p.write_text(s)
          if '"=" -> "_"' not in p.read_text():
              raise SystemExit('legacy equals compatibility tag fix missing')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- "$FILE"; then
            git add "$FILE"
            git commit -m 'Keep Q2 gesture architecture and restore legacy equals tag compatibility'
            git push origin HEAD:veltrix-calculator-frontend-max-pro-q2
          fi

      - name: Dispatch final Q2 gate v4 at latest branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run veltrix-calculator-frontend-max-pro-q2-final-v4.yml --ref veltrix-calculator-frontend-max-pro-q2
