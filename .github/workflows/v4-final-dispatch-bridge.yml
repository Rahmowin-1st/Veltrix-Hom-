name: V4 Final Dispatch Bridge

on:
  push:
    branches:
      - ci/v4-final-dispatch-68f3e63
    paths:
      - '.github/workflows/v4-final-dispatch-bridge.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch-final-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Final Clean V3 against canonical branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/veltrix-v4-final-clean-v3.yml/dispatches" \
            -d '{"ref":"veltrix-calculator-backend-v4-reset"}'
          echo 'Final Clean V3 dispatch accepted.'
