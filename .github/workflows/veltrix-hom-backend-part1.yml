name: Veltrix Hom Backend Part 1

on:
  push:
    branches:
      - veltrix-hom-backend-part1-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-hom-backend-part1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    env:
      GEMINI_API_KEY: ci-placeholder-not-a-secret
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-secret
      APP_HMAC_SECRET: ci-only-placeholder-secret-0123456789abcdef0123456789abcdef
      APP_ENV: test
      GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload typecheck diagnostics
        if: steps.typecheck.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics-${{ github.run_id }}
          path: server/typecheck.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce typecheck
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
      - name: Unit and regression tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test -- --reporter=verbose 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload test diagnostics
        if: steps.tests.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics-${{ github.run_id }}
          path: server/test.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce tests
        if: steps.tests.outputs.exit_code != '0'
        run: exit 1
      - name: Build
        run: npm run build
      - name: Package exact tested source and evidence manifest
        shell: bash
        run: |
          SOURCE_NAME="part1-source-${GITHUB_SHA}.zip"
          SOURCE_ZIP="$GITHUB_WORKSPACE/server/$SOURCE_NAME"
          git -C "$GITHUB_WORKSPACE" archive --format=zip --output="$SOURCE_ZIP" "$GITHUB_SHA" server .github/workflows/veltrix-hom-backend-part1.yml
          printf 'repo=Rahmowin-1st/Veltrix-Hom-\nbranch=veltrix-hom-backend-part1-foundation\nsha=%s\nnode=%s\nnpm=%s\nworkflow_run=%s\n' "$GITHUB_SHA" "$(node --version)" "$(npm --version)" "$GITHUB_RUN_ID" > PART1_CI_EVIDENCE.txt
          sha256sum src/db/migration-100-vh-part1-foundation.sql src/db/migration-101-vh-part1-hardening.sql src/db/migration-102-vh-part1-service-only.sql src/db/migration-103-vh-part1-index-hardening.sql >> PART1_CI_EVIDENCE.txt
          sha256sum VELTRIX_HOM_BACKEND_PART1_MANAGER_HANDOFF_2026-08-25.md package-lock.json "$SOURCE_NAME" >> PART1_CI_EVIDENCE.txt
          printf '\n--- test summary tail ---\n' >> PART1_CI_EVIDENCE.txt
          tail -n 30 test.log >> PART1_CI_EVIDENCE.txt
      - name: Upload Part 1 evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-part1-evidence-${{ github.sha }}
          path: |
            server/PART1_CI_EVIDENCE.txt
            server/typecheck.log
            server/test.log
            server/dist
            server/PART1_ARCHITECTURE.md
            server/VELTRIX_HOM_BACKEND_PART1_MANAGER_HANDOFF_2026-08-25.md
            server/src/db/migration-100-vh-part1-foundation.sql
            server/src/db/migration-101-vh-part1-hardening.sql
            server/src/db/migration-102-vh-part1-service-only.sql
            server/src/db/migration-103-vh-part1-index-hardening.sql
            server/part1-source-${{ github.sha }}.zip
          if-no-files-found: error
          retention-days: 30
