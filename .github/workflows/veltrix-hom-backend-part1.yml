name: Veltrix Hom Backend Part 1

on:
  push:
    branches:
      - veltrix-hom-backend-part1-foundation
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veltrix-hom-backend-part1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    env:
      GEMINI_API_KEY: ci-placeholder-not-a-secret
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-secret
      APP_HMAC_SECRET: ci-only-placeholder-secret-0123456789abcdef0123456789abcdef
      APP_ENV: test
      GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          npm run typecheck 2>&1 | tee typecheck.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload typecheck diagnostics
        if: steps.typecheck.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics-${{ github.run_id }}
          path: server/typecheck.log
          if-no-files-found: error
          retention-days: 7
      - name: Enforce typecheck
        if: steps.typecheck.outputs.exit_code != '0'
        run: exit 1
      - name: Unit and regression tests
        run: npm test -- --reporter=verbose
      - name: Build
        run: npm run build
