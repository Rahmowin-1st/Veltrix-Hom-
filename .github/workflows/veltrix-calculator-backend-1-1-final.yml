name: Veltrix Calculator Backend 1.1 FINAL

on:
  push:
    branches: [ veltrix-calculator-backend-1.1 ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact Backend Master source and apply branch-pinned 1.1 overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9097731825/zip > parent.zip
          unzip -q parent.zip -d parent
          test -f parent/VeltrixCalculator-BackendMaster-COMPLETE-tested-source.zip
          echo "1a0ec7ee5ac5c4118c5913880eb0a84c254643e3ea9164c7699a6eb2526f0b1a  parent/VeltrixCalculator-BackendMaster-COMPLETE-tested-source.zip" | sha256sum -c -
          test -s ci/veltrix-calculator-iteration11-patch.zip
          unzip -tq ci/veltrix-calculator-iteration11-patch.zip >/dev/null
          sha256sum ci/veltrix-calculator-iteration11-patch.zip | tee overlay.sha256
          mkdir ci-project
          unzip -q parent/VeltrixCalculator-BackendMaster-COMPLETE-tested-source.zip -d ci-project
          unzip -qo ci/veltrix-calculator-iteration11-patch.zip -d ci-project/VeltrixCalculator
          python3 - <<'PY'
          from pathlib import Path
          root=Path('ci-project/VeltrixCalculator')
          p=root/'app/src/androidTest/kotlin/com/veltrix/calculator/app/Iteration11WidgetRuntimeTest.kt'
          s=p.read_text()
          if 'import org.junit.Assume' not in s:
              s=s.replace('import org.junit.Assert.*\n','import org.junit.Assert.*\nimport org.junit.Assume\n',1)
          old='''        val id=51109;val c=WidgetConfigStore(context).load(id)?:error("persisted config missing after process restart");val s=WidgetInteractionStateStore(context).load(id)?:error("persisted interaction missing after process restart")\n        assertEquals("quadratic-solver",c.toolId);assertEquals("2",s.values["a"]);assertEquals(WidgetInteractionPhase.RESULT,s.phase);assertTrue(s.result.isNotBlank())'''
          new='''        val id=51109;val c=WidgetConfigStore(context).load(id);val s=WidgetInteractionStateStore(context).load(id)\n        Assume.assumeTrue("Requires the external real-process-restart seed gate", c != null && s != null)\n        assertEquals("quadratic-solver",c!!.toolId);assertEquals("2",s!!.values["a"]);assertEquals(WidgetInteractionPhase.RESULT,s.phase);assertTrue(s.result.isNotBlank())'''
          if old not in s: raise SystemExit('persistence-order patch target missing')
          p.write_text(s.replace(old,new,1))
          (root/'docs/TEST_REPORT.md').write_text('''# Backend Test Report — Iteration 1.1 Source Contract\n\nThis file describes the tests shipped in the exact source. It intentionally does **not** claim CI success before execution. Final run logs, `gate-summary.txt`, provenance and Android test reports are authoritative.\n\n## Core regression\nExisting core/JUnit suites remain unchanged and must export exactly 104 canonical tools across 9 subjects.\n\n## Iteration 1.1 instrumentation\n`Iteration11WidgetRuntimeTest` covers standalone Quadratic, Vieta, Physics Ohm's Law, Geometry Rectangle Area, editable Parabola graph signature/render, fixed currency, interactive currency, config migration and persisted widget state.\n\n`Iteration11CurrencyRuntimeTest` covers retry, fresh cache, stale cache, provider failure fallback, timestamps, forced active refresh and offline-style cached conversion.\n\n`LiveCurrencyRuntimeTest` performs the real provider probe when CI passes `liveProbe=true`.\n\n## External runtime gate\nCI must additionally prove APK install/cold launch, process kill/relaunch with widget state, airplane/offline deterministic paths, multi-window task resize, full connected instrumentation, reinstall and final relaunch.\n\nNo `BACKEND COMPLETE` claim is valid unless the final evidence run is green.\n''')
          PY
          (cd ci-project && zip -qr ../VeltrixCalculator-Backend-1.1-FINAL-tested-source.zip VeltrixCalculator)
          sha256sum VeltrixCalculator-Backend-1.1-FINAL-tested-source.zip | tee source.sha256
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/veltrix-11-avd" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Verify production currency provider from runner
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 8 --max-time 30 'https://api.frankfurter.dev/v2/rate/USD/EUR' | tee provider-usd-eur.json
          jq -e '.rate > 0 and (.date|length>0)' provider-usd-eur.json >/dev/null
          curl --fail --silent --show-error --retry 4 --retry-all-errors --connect-timeout 8 --max-time 30 'https://api.frankfurter.dev/v2/rate/USD/UZS?providers=CBU' | tee provider-usd-uzs-cbu.json
          jq -e '.rate > 0 and (.date|length>0)' provider-usd-uzs-cbu.json >/dev/null

      - name: Core full regression
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stacktrace :core:test | tee core-tests.txt
          grep -q 'BUILD SUCCESSFUL' core-tests.txt
          test -s core/build/registry-export.tsv
          TOOLS=$(tail -n +3 core/build/registry-export.tsv | wc -l)
          SUBJECTS=$(tail -n +3 core/build/registry-export.tsv | cut -f3 | sort -u | wc -l)
          printf 'registry_tool_count=%s\nregistry_subject_count=%s\n' "$TOOLS" "$SUBJECTS" | tee registry-count.txt
          test "$TOOLS" -eq 104
          test "$SUBJECTS" -eq 9

      - name: Build app and instrumentation APKs
        working-directory: ci-project/VeltrixCalculator
        run: gradle --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Static Android and widget assertions
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apkanalyzer manifest print "$APK" | tee manifest.txt
          grep -q 'com.veltrix.calculator' manifest.txt
          grep -q '2.1.0-backend-iteration-1.1' manifest.txt
          grep -qi 'resizeableActivity="true"' manifest.txt
          ! grep -q 'android.permission.SYSTEM_ALERT_WINDOW' manifest.txt
          grep -q 'android:updatePeriodMillis="1800000"' app/src/main/res/xml/veltrix_widget_info.xml
          grep -q 'WidgetInteractionEngine' app/src/main/kotlin/com/veltrix/calculator/app/VeltrixToolWidgetProvider.kt
          grep -q 'CURRENT_FETCH' app/src/androidTest/kotlin/com/veltrix/calculator/app/LiveCurrencyRuntimeTest.kt

      - name: Boot emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_11_api35 -k "system-images;android-35;google_apis;x86_64" -f
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx veltrix_11_api35
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_11_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          BOOT=$(adb shell getprop sys.boot_completed | tr -d '\r')
          echo "boot_completed=$BOOT" | tee runtime-debug.txt
          test "$BOOT" = "1"
          adb devices -l | tee -a runtime-debug.txt
          adb get-state | tr -d '\r' | grep -Fx device

      - name: Full Android runtime and standalone widget gate
        working-directory: ci-project/VeltrixCalculator
        shell: bash
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP_APK" | tee install-app.txt; grep -q Success install-app.txt
          adb install -r -t "$TEST_APK" | tee install-test.txt; grep -q Success install-test.txt
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee cold-launch.txt
          grep -q 'Status: ok' cold-launch.txt
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.veltrix.calculator.*MainActivity'
          INSTRUMENTATION=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$INSTRUMENTATION"
          wait_network() { for i in $(seq 1 45); do adb shell dumpsys connectivity 2>/dev/null | grep -q 'VALIDATED' && return 0; sleep 2; done; return 1; }
          wait_network
          adb shell am instrument -w -e liveProbe true -e class com.veltrix.calculator.app.LiveCurrencyRuntimeTest "$INSTRUMENTATION" | tee live-currency.txt
          grep -q 'OK (1 test)' live-currency.txt
          run_test() { local name="$1"; local spec="$2"; adb shell am instrument -w -e class "$spec" "$INSTRUMENTATION" | tee "$name.txt"; grep -q 'OK (1 test)' "$name.txt"; }
          adb shell am force-stop com.veltrix.calculator
          run_test widget-quadratic 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#aQuadraticWidgetEditsCoefficientAndSolvesStandalone'
          run_test widget-vieta 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#bVietaWidgetEditsInputAndSolvesStandalone'
          run_test widget-physics 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#cPhysicsWidgetEditsKnownVariableAndSolvesUnknown'
          run_test widget-geometry 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#dGeometryWidgetEditsDimensionAndSolves'
          run_test widget-graph 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#eGraphWidgetParameterEditChangesGraphSignature'
          run_test widget-fixed-currency 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#fFixedCurrencyWidgetKeepsAmountAndUsesNewVerifiedRate'
          run_test widget-interactive-currency 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#gInteractiveCurrencyWidgetAmountSwapRefreshAndCalculate'
          run_test widget-migration 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#hWidgetStatePersistsAcrossStoreRecreationAndConfigMigration'
          run_test widget-registry-coverage 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#zRegistryWidgetCoverageStillSchemaDriven'
          run_test currency-cache-retry-active 'com.veltrix.calculator.app.Iteration11CurrencyRuntimeTest#cacheFreshnessStaleFailureRetryTimestampAndActiveRefresh'
          run_test widget-process-seed 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#iPersistenceSeedForRealProcessRestart'
          adb shell am force-stop com.veltrix.calculator
          test -z "$(adb shell pidof com.veltrix.calculator 2>/dev/null || true)"
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee process-relaunch.txt
          grep -q 'Status: ok' process-relaunch.txt
          run_test widget-process-persistence 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#yPersistenceAfterRealProcessRestart'
          run_test legacy-process-seed 'com.veltrix.calculator.app.BackendMasterRuntimeTest#dPersistenceSeed'
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee legacy-process-relaunch.txt
          grep -q 'Status: ok' legacy-process-relaunch.txt
          run_test legacy-process-persistence 'com.veltrix.calculator.app.BackendMasterRuntimeTest#zPersistenceAfterProcessRestart'
          TASK_ID=$(adb shell dumpsys activity recents | sed -n 's/.*Task{[^#]*#\([0-9][0-9]*\).*com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r' || true)
          echo "task_id=$TASK_ID" | tee multiwindow.txt
          if [ -n "$TASK_ID" ] && adb shell am task resize "$TASK_ID" 0 0 700 900 >> multiwindow.txt 2>&1; then echo 'resize_runtime=VERIFIED' | tee -a multiwindow.txt; else echo 'resize_runtime=NOT_VERIFIED_ENVIRONMENT' | tee -a multiwindow.txt; fi
          adb shell cmd connectivity airplane-mode enable || adb shell settings put global airplane_mode_on 1
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          AIR=$(adb shell settings get global airplane_mode_on | tr -d '\r'); echo "airplane_mode=$AIR" | tee offline-state.txt; test "$AIR" = "1"
          run_test offline-core-graph 'com.veltrix.calculator.app.BackendMasterRuntimeTest#gOfflineDeterministicAndGraph'
          run_test offline-currency-cache 'com.veltrix.calculator.app.Iteration11CurrencyRuntimeTest#offlineStyleCachedConversionPreservesProviderAndTimestamp'
          adb shell pm path com.veltrix.calculator | tee package-path.txt; grep -q '^package:' package-path.txt
          adb shell cmd connectivity airplane-mode disable || adb shell settings put global airplane_mode_on 0
          adb shell svc wifi enable || true
          wait_network
          gradle --stacktrace :app:connectedDebugAndroidTest | tee connected-tests.txt
          grep -q 'BUILD SUCCESSFUL' connected-tests.txt
          adb install -r -t "$APP_APK" | tee reinstall-after-connected.txt; grep -q Success reinstall-after-connected.txt
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee final-relaunch.txt
          grep -q 'Status: ok' final-relaunch.txt
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.veltrix.calculator.*MainActivity'
          adb emu kill || true
          printf '%s\n' 'BACKEND_ITERATION_1_1=GREEN' 'standalone_widgets=VERIFIED' 'currency_freshness=VERIFIED' 'full_previous_regression=VERIFIED' > gate-summary.txt

      - name: Provenance
        if: always()
        run: |
          SOURCE_SHA=NOT_GENERATED; APK_SHA=NOT_GENERATED; TOOLS=NOT_GENERATED; SUBJECTS=NOT_GENERATED; OVERLAY_SHA=NOT_GENERATED
          [ -f VeltrixCalculator-Backend-1.1-FINAL-tested-source.zip ] && SOURCE_SHA=$(sha256sum VeltrixCalculator-Backend-1.1-FINAL-tested-source.zip | awk '{print $1}')
          [ -f ci/veltrix-calculator-iteration11-patch.zip ] && OVERLAY_SHA=$(sha256sum ci/veltrix-calculator-iteration11-patch.zip | awk '{print $1}')
          APK=ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK" ] && APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          if [ -f ci-project/VeltrixCalculator/core/build/registry-export.tsv ]; then TOOLS=$(tail -n +3 ci-project/VeltrixCalculator/core/build/registry-export.tsv | wc -l); SUBJECTS=$(tail -n +3 ci-project/VeltrixCalculator/core/build/registry-export.tsv | cut -f3 | sort -u | wc -l); fi
          printf 'commit_sha=%s\nbranch=%s\nci_run_id=%s\nbase_tested_source_sha256=%s\niteration11_overlay_sha256=%s\ntested_source_sha256=%s\ngenerated_apk_sha256=%s\nregistry_tool_count=%s\nregistry_subject_count=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" '1a0ec7ee5ac5c4118c5913880eb0a84c254643e3ea9164c7699a6eb2526f0b1a' "$OVERLAY_SHA" "$SOURCE_SHA" "$APK_SHA" "$TOOLS" "$SUBJECTS" | tee provenance.txt
          [ -f "$APK" ] && sha256sum "$APK" > apk.sha256 || true

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixCalculator-Backend-1.1-FINAL
          if-no-files-found: warn
          path: |
            VeltrixCalculator-Backend-1.1-FINAL-tested-source.zip
            source.sha256
            overlay.sha256
            provenance.txt
            apk.sha256
            provider-usd-eur.json
            provider-usd-uzs-cbu.json
            emulator.log
            runtime-debug.txt
            ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
            ci-project/VeltrixCalculator/core/build/registry-export.tsv
            ci-project/VeltrixCalculator/docs/
            ci-project/VeltrixCalculator/core-tests.txt
            ci-project/VeltrixCalculator/registry-count.txt
            ci-project/VeltrixCalculator/manifest.txt
            ci-project/VeltrixCalculator/install-app.txt
            ci-project/VeltrixCalculator/install-test.txt
            ci-project/VeltrixCalculator/cold-launch.txt
            ci-project/VeltrixCalculator/live-currency.txt
            ci-project/VeltrixCalculator/widget-*.txt
            ci-project/VeltrixCalculator/currency-*.txt
            ci-project/VeltrixCalculator/legacy-*.txt
            ci-project/VeltrixCalculator/process-relaunch.txt
            ci-project/VeltrixCalculator/multiwindow.txt
            ci-project/VeltrixCalculator/offline-state.txt
            ci-project/VeltrixCalculator/offline-*.txt
            ci-project/VeltrixCalculator/package-path.txt
            ci-project/VeltrixCalculator/connected-tests.txt
            ci-project/VeltrixCalculator/reinstall-after-connected.txt
            ci-project/VeltrixCalculator/final-relaunch.txt
            ci-project/VeltrixCalculator/gate-summary.txt
            ci-project/VeltrixCalculator/core/build/reports/tests/test/
            ci-project/VeltrixCalculator/app/build/reports/androidTests/
            ci-project/VeltrixCalculator/app/build/outputs/androidTest-results/
