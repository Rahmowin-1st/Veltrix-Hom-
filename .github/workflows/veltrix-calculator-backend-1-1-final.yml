name: Veltrix Calculator Backend 1.1 FINAL

on:
  push:
    branches: [ veltrix-calculator-backend-1.1 ]
    paths:
      - '.github/workflows/veltrix-calculator-backend-1-1-final.yml'
      - 'ci/iteration11-v3/**'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - name: Restore Backend Master and exact 1.1 overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9097404591/zip > parent.zip
          unzip -q parent.zip -d parent
          test -f parent/VeltrixCalculator-BackendMaster-FINAL-tested-source.zip
          echo "44bba38a31ae963e5a0da85ca63de7cab258cc7b86851d144fc9a7fe306345c0  parent/VeltrixCalculator-BackendMaster-FINAL-tested-source.zip" | sha256sum -c -
          mkdir ci-project
          unzip -q parent/VeltrixCalculator-BackendMaster-FINAL-tested-source.zip -d ci-project
          cat ci/iteration11-v3/part-00 ci/iteration11-v3/part-01 ci/iteration11-v3/part-02 \
              ci/iteration11-v3/part-03q0 ci/iteration11-v3/part-03q1 ci/iteration11-v3/part-03q2 ci/iteration11-v3/part-03q3 \
              > iteration11-overlay.b64
          test "$(wc -c < iteration11-overlay.b64)" -eq 56440
          base64 -d iteration11-overlay.b64 > iteration11-patch-v2.zip
          echo "ad9648682e0f3aa4b2eeaa013f72b2cb20f51d2aec56638186234b34090d7a51  iteration11-patch-v2.zip" | sha256sum -c -
          unzip -t iteration11-patch-v2.zip | tee overlay-integrity.txt
          unzip -qo iteration11-patch-v2.zip -d ci-project/VeltrixCalculator
          test -f ci-project/VeltrixCalculator/app/src/main/kotlin/com/veltrix/calculator/app/WidgetInteractionEngine.kt
          test -f ci-project/VeltrixCalculator/docs/CURRENCY_FRESHNESS_1_1.md
          (cd ci-project && zip -qr ../VeltrixCalculator-Backend-1.1-TESTED-SOURCE.zip VeltrixCalculator)
          sha256sum VeltrixCalculator-Backend-1.1-TESTED-SOURCE.zip | tee source.sha256
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/veltrix-i11-avd" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Live provider runner probe
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 https://api.frankfurter.dev/v2/rate/USD/EUR | tee frankfurter-runner.json
          python3 - <<'PY'
          import json
          d=json.load(open('frankfurter-runner.json'))
          assert d['base']=='USD' and d['quote']=='EUR' and float(d['rate'])>0 and d['date']
          print('Frankfurter v2 runner probe PASS')
          PY

      - name: Core unit + registry regression
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stacktrace :core:test | tee core-tests.txt
          grep -q 'BUILD SUCCESSFUL' core-tests.txt
          test -s core/build/registry-export.tsv
          TOOLS=$(tail -n +3 core/build/registry-export.tsv | wc -l)
          SUBJECTS=$(tail -n +3 core/build/registry-export.tsv | cut -f3 | sort -u | wc -l)
          printf 'registry_tool_count=%s\nregistry_subject_count=%s\n' "$TOOLS" "$SUBJECTS" | tee registry-count.txt
          test "$TOOLS" -eq 104
          test "$SUBJECTS" -eq 9

      - name: Compile APK and instrumentation APK
        working-directory: ci-project/VeltrixCalculator
        run: gradle --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Static Android assertions
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apkanalyzer manifest print "$APK" | tee manifest.txt
          grep -q 'com.veltrix.calculator' manifest.txt
          grep -qi 'resizeableActivity="true"' manifest.txt
          grep -q 'VeltrixToolWidgetProvider' manifest.txt
          ! grep -q 'android.permission.SYSTEM_ALERT_WINDOW' manifest.txt

      - name: Boot emulator + ADB
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_i11_api35 -k "system-images;android-35;google_apis;x86_64" -f
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_i11_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          BOOT=$(adb shell getprop sys.boot_completed | tr -d '\r')
          echo "boot_completed=$BOOT" | tee runtime-debug.txt
          test "$BOOT" = "1"
          adb devices -l | tee -a runtime-debug.txt
          adb get-state | tr -d '\r' | grep -Fx device

      - name: Android install + cold launch + 1.1 mandatory runtime
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP_APK" | tee install-app.txt; grep -q Success install-app.txt
          adb install -r -t "$TEST_APK" | tee install-test.txt; grep -q Success install-test.txt
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee cold-launch.txt
          grep -q 'Status: ok' cold-launch.txt
          INSTRUMENTATION=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$INSTRUMENTATION"

          adb shell am force-stop com.veltrix.calculator
          adb shell am instrument -w -e class com.veltrix.calculator.app.Iteration11WidgetRuntimeTest "$INSTRUMENTATION" | tee widget-interaction.txt
          grep -q 'OK (11 tests)' widget-interaction.txt
          ! grep -q 'FAILURES!!!' widget-interaction.txt

          adb shell am instrument -w -e class com.veltrix.calculator.app.Iteration11CurrencyRuntimeTest "$INSTRUMENTATION" | tee currency-runtime.txt
          grep -q 'OK (2 tests)' currency-runtime.txt
          ! grep -q 'FAILURES!!!' currency-runtime.txt

          adb shell am instrument -w -e liveProbe true -e class com.veltrix.calculator.app.LiveCurrencyRuntimeTest "$INSTRUMENTATION" | tee live-currency.txt
          grep -q 'OK (1 test)' live-currency.txt
          ! grep -q 'FAILURES!!!' live-currency.txt

      - name: Real process restart widget persistence
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          INSTRUMENTATION=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#iPersistenceSeedForRealProcessRestart' "$INSTRUMENTATION" | tee widget-persist-seed.txt
          grep -q 'OK (1 test)' widget-persist-seed.txt
          adb shell am force-stop com.veltrix.calculator
          test -z "$(adb shell pidof com.veltrix.calculator 2>/dev/null || true)"
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#yPersistenceAfterRealProcessRestart' "$INSTRUMENTATION" | tee widget-persist-after.txt
          grep -q 'OK (1 test)' widget-persist-after.txt

      - name: Multi-window resize runtime
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity > multiwindow-launch.txt
          TASK_ID=$(adb shell dumpsys activity recents | sed -n 's/.*Task{[^#]*#\([0-9][0-9]*\).*com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r' || true)
          echo "task_id=$TASK_ID" | tee multiwindow.txt
          test -n "$TASK_ID"
          adb shell am task resize "$TASK_ID" 0 0 700 900 | tee -a multiwindow.txt
          echo 'resize_runtime=VERIFIED' | tee -a multiwindow.txt

      - name: Offline deterministic gate
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          INSTRUMENTATION=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          adb shell cmd connectivity airplane-mode enable || adb shell settings put global airplane_mode_on 1
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          AIR=$(adb shell settings get global airplane_mode_on | tr -d '\r')
          echo "airplane_mode=$AIR" | tee offline-state.txt
          test "$AIR" = "1"
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.BackendMasterRuntimeTest#gOfflineDeterministicAndGraph' "$INSTRUMENTATION" | tee offline-graph.txt
          grep -q 'OK (1 test)' offline-graph.txt
          adb shell pm path com.veltrix.calculator | tee package-path.txt
          grep -q '^package:' package-path.txt
          adb shell cmd connectivity airplane-mode disable || adb shell settings put global airplane_mode_on 0
          adb shell svc wifi enable || true
          sleep 5

      - name: Full previous connected regression
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stacktrace :app:connectedDebugAndroidTest | tee connected-tests.txt
          grep -q 'BUILD SUCCESSFUL' connected-tests.txt

      - name: Reinstall + final relaunch
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t "$APP_APK" | tee reinstall.txt
          grep -q Success reinstall.txt
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee final-relaunch.txt
          grep -q 'Status: ok' final-relaunch.txt
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.veltrix.calculator.*MainActivity'
          adb emu kill || true

      - name: Package evidence and provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp -f overlay-integrity.txt frankfurter-runner.json emulator.log runtime-debug.txt evidence/ 2>/dev/null || true
          cp -f ci-project/VeltrixCalculator/{core-tests.txt,registry-count.txt,manifest.txt,install-app.txt,install-test.txt,cold-launch.txt,widget-interaction.txt,currency-runtime.txt,live-currency.txt,widget-persist-seed.txt,widget-persist-after.txt,multiwindow.txt,offline-state.txt,offline-graph.txt,package-path.txt,connected-tests.txt,reinstall.txt,final-relaunch.txt} evidence/ 2>/dev/null || true
          APK=ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
          SOURCE_SHA=NOT_GENERATED; APK_SHA=NOT_GENERATED; TOOLS=NOT_GENERATED
          [ -f VeltrixCalculator-Backend-1.1-TESTED-SOURCE.zip ] && SOURCE_SHA=$(sha256sum VeltrixCalculator-Backend-1.1-TESTED-SOURCE.zip | awk '{print $1}')
          [ -f "$APK" ] && APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          [ -f ci-project/VeltrixCalculator/core/build/registry-export.tsv ] && TOOLS=$(tail -n +3 ci-project/VeltrixCalculator/core/build/registry-export.tsv | wc -l)
          printf 'commit_sha=%s\nbranch=%s\nci_run_id=%s\nparent_source_sha256=%s\noverlay_sha256=%s\ntested_source_sha256=%s\nruntime_apk_sha256=%s\nregistry_tool_count=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" '44bba38a31ae963e5a0da85ca63de7cab258cc7b86851d144fc9a7fe306345c0' 'ad9648682e0f3aa4b2eeaa013f72b2cb20f51d2aec56638186234b34090d7a51' "$SOURCE_SHA" "$APK_SHA" "$TOOLS" | tee provenance.txt
          [ -f "$APK" ] && sha256sum "$APK" > apk.sha256 || true
          [ -f VeltrixCalculator-Backend-1.1-TESTED-SOURCE.zip ] && sha256sum VeltrixCalculator-Backend-1.1-TESTED-SOURCE.zip > tested-source.sha256 || true
          cp -f provenance.txt apk.sha256 tested-source.sha256 evidence/ 2>/dev/null || true
          cp -rf ci-project/VeltrixCalculator/docs evidence/docs 2>/dev/null || true
          (cd evidence && zip -qr ../VeltrixCalculator-Backend-1.1-EVIDENCE.zip .)

      - name: Upload final 1.1 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixCalculator-Backend-1.1-FINAL
          if-no-files-found: error
          path: |
            VeltrixCalculator-Backend-1.1-TESTED-SOURCE.zip
            VeltrixCalculator-Backend-1.1-EVIDENCE.zip
            source.sha256
            tested-source.sha256
            apk.sha256
            provenance.txt
            ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
            ci-project/VeltrixCalculator/core/build/registry-export.tsv
            ci-project/VeltrixCalculator/docs/
