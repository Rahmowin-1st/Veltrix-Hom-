name: Veltrix V4 Materialize Final Docs V2

on:
  push:
    branches:
      - veltrix-calculator-backend-v4-reset
    paths:
      - '.github/workflows/veltrix-v4-materialize-final-docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  BRANCH: veltrix-calculator-backend-v4-reset

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Exact source preflight
        run: |
          set -euxo pipefail
          git fetch origin "$BRANCH"
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse origin/$BRANCH)" = "${{ github.sha }}"
          git merge-base --is-ancestor 544d7e8f8afefcd8a0a61724a4f3c525078181ce HEAD

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: true

      - name: Generate exact registry truth
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          gradle --stacktrace :core:test
          test -s core/build/registry-export.tsv
          test -s core/build/subject-coverage-matrix.tsv
          test -s core/build/solve-target-matrix.tsv
          test "$(tail -n +3 core/build/registry-export.tsv | wc -l)" -eq 260

      - name: Materialize final source-bound documentation
        env:
          MATERIALIZE_PARENT_SHA: ${{ github.sha }}
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, hashlib, os, re

          docs = Path("calculator-v4/docs")
          build = Path("calculator-v4/core/build")
          docs.mkdir(parents=True, exist_ok=True)

          registry = build / "registry-export.tsv"
          with registry.open(encoding="utf-8") as fh:
              meta = fh.readline().strip()
              rows = list(csv.DictReader(fh, delimiter="\t"))
          if len(rows) != 260:
              raise SystemExit(f"registry count drift: {len(rows)}")

          def levels(row):
              return [x for x in re.split(r"[,|]", row.get("educationLevels", "")) if x]

          physics = [r for r in rows if r.get("subject") == "PHYSICS"]
          solve_count = sum(len([x for x in re.split(r"[,|]", r.get("solveTargets","")) if x]) for r in physics)

          (docs / "SUBJECT_COVERAGE_MATRIX.tsv").write_bytes((build / "subject-coverage-matrix.tsv").read_bytes())
          (docs / "SOLVE_TARGET_MATRIX.tsv").write_bytes((build / "solve-target-matrix.tsv").read_bytes())

          grade_header = [
              "sourceRefs","grade/level","toolId","title","category","topic","formula",
              "supportedSolveTargets","calculationMethod","exactness","offlinePolicy","status","boundaryNotes"
          ]
          grade_specs = [
              ("GRADE_9", "PHYSICS_GRADE_9_FULL_MAP.tsv", "9", 20),
              ("GRADE_10", "PHYSICS_GRADE_10_FULL_MAP.tsv", "10", 21),
              ("GRADE_11", "PHYSICS_GRADE_11_FULL_MAP.tsv", "11", 19),
              ("ADVANCED", "PHYSICS_ADVANCED_MAP.tsv", "Advanced", 13),
          ]
          for level, filename, label, expected in grade_specs:
              selected = [r for r in physics if level in levels(r)]
              if len(selected) != expected:
                  raise SystemExit(f"{level} tag count drift: expected {expected}, got {len(selected)}")
              with (docs / filename).open("w", encoding="utf-8", newline="") as out:
                  w = csv.writer(out, delimiter="\t", lineterminator="\n")
                  w.writerow(grade_header)
                  for r in selected:
                      w.writerow([
                          r.get("sourceRefs",""), label, r.get("id",""), r.get("title",""),
                          r.get("category",""), r.get("topic",""), r.get("formula",""),
                          r.get("solveTargets",""), r.get("calculationMethod",""),
                          r.get("exactnessCapability",""), r.get("offlinePolicy",""),
                          "IMPLEMENTED_REGISTRY_BACKED",
                          r.get("omissionReason","") or
                          "Formula-capable deterministic relation only; conceptual-only material is not fabricated as a scalar calculator."
                      ])

          if not (docs / "PHYSICS_GRADE_8_FULL_MAP.tsv").is_file():
              raise SystemExit("Grade 8 hard-gate map missing")

          registry_sha = hashlib.sha256(registry.read_bytes()).hexdigest()
          subject_sha = hashlib.sha256((build / "subject-coverage-matrix.tsv").read_bytes()).hexdigest()
          solve_sha = hashlib.sha256((build / "solve-target-matrix.tsv").read_bytes()).hexdigest()
          parent_sha = os.environ["MATERIALIZE_PARENT_SHA"]

          library = [
              "# Veltrix Calculator V4 — Library Catalog VNext",
              "",
              f"Materialized from exact registry parent `{parent_sha}`.",
              f"Registry metadata: `{meta}`",
              f"Registry SHA-256: `{registry_sha}`",
              f"Actual tool count: **{len(rows)}**.",
              "",
              "Canonical IDs are persistence/deep-link/history keys. Aliases are discovery-only.",
              "Frontend must render metadata; it must not duplicate formulas or invent unsupported solve targets.",
              "",
              "| toolId | name | subject | category | topic | formula | solve targets | source refs |",
              "|---|---|---|---|---|---|---|---|",
          ]
          def esc(v):
              return str(v or "").replace("|", "\\|").replace("\n", " ")
          for r in rows:
              library.append("| " + " | ".join(esc(r.get(k,"")) for k in
                  ("id","title","subject","category","topic","formula","solveTargets","sourceRefs")) + " |")
          (docs / "LIBRARY_CATALOG_VNEXT.md").write_text("\n".join(library) + "\n", encoding="utf-8")

          subject_lines = (build / "subject-coverage-matrix.tsv").read_text(encoding="utf-8").strip().splitlines()
          subject_md = [
              "| " + " | ".join(subject_lines[0].split("\t")) + " |",
              "|" + "|".join(["---"] * len(subject_lines[0].split("\t"))) + "|"
          ]
          subject_md += ["| " + " | ".join(line.split("\t")) + " |" for line in subject_lines[1:]]

          docs_content = {}
          docs_content["SUBJECT_RESEARCH_MAP.md"] = f"""# Veltrix Calculator V4 — Subject Research Map

          Status: SOURCE-BOUND IMPLEMENTATION MAP

          Registry metadata: `{meta}`
          Registry SHA-256: `{registry_sha}`
          Physics tools: **{len(physics)}**; Physics solve targets: **{solve_count}**.

          Rule: product requirement → primary curriculum/reference → deterministic relation → executable test.
          Topic-name similarity alone is never proof of calculator coverage.

          ## Generated coverage

          {chr(10).join(subject_md)}

          ## Source keys

          - `V4_ORIGINAL_MISSION`: product acceptance scope.
          - `V4_DETERMINISTIC_CATALOG`: implementation provenance.
          - `V4_GRADE8_FULL_MAP`: Grade 8 hard-gate map.
          - `UZB_G8_OFFICIAL_PORTAL_2020`
          - `UZB_G9_OFFICIAL_TEXTBOOK_AND_LABS`
          - `UZB_G10_OFFICIAL_TEXTBOOK_INDEX`
          - `UZB_G11_OFFICIAL_CURRICULUM`
          - `OPENSTAX_UNIVERSITY_PHYSICS`
          - `BACKEND_1_1_VERIFIED_BASELINE`

          Education-level tags are implementation/discovery tags, not a claim that conceptual prose was converted into fake numeric tools.
          Underdetermined/device-model/topology/orientation-only topics remain explicit boundaries.
          """

          docs_content["CURRICULUM_SOURCE_MAP.md"] = """# Veltrix Calculator V4 — Curriculum Source Map

          Status: PRIMARY-SOURCE MAP

          | key | scope | source | role |
          |---|---|---|---|
          | `UZB_G8_OFFICIAL_PORTAL_2020` | Grade 8 Physics | https://eduportal.uz/Umumiyfiles/darsliklar/8/fizika_8_uzb.pdf | Grade 8 formula-capable map + explicit conceptual boundaries |
          | `UZB_G9_OFFICIAL_TEXTBOOK_AND_LABS` | Grade 9 Physics | https://old.eduportal.uz/Umumiyfiles/darsliklar/9/fizika_9_uzb.pdf | thermal/molecular, fluids, waves, optics cross-check |
          | `UZB_G10_OFFICIAL_TEXTBOOK_INDEX` | Grade 10 Physics | https://old.eduportal.uz/Umumiyfiles/darsliklar/10/fizika_10_uzb.pdf | mechanics/dynamics/rotation cross-check |
          | `UZB_G11_OFFICIAL_CURRICULUM` | Grade 11 Physics | https://old.eduportal.uz/Umumiyfiles/darsliklar/11/fizika_11_uzb.pdf | electromagnetism/oscillation/modern-physics cross-check |
          | `OPENSTAX_UNIVERSITY_PHYSICS` | Advanced | https://openstax.org/details/books/university-physics-volume-1 | advanced academic cross-check |
          | `V4_ORIGINAL_MISSION` | Product | supplied V4 mission | acceptance authority, not scientific authority |

          Missing values are never guessed. Conceptual-only topics are not fabricated into scalar calculators.
          """

          docs_content["NAVIGATION_ARCHITECTURE.md"] = """# Veltrix Calculator V4 — Navigation Architecture

          Canonical source: `core/.../AppNavigation.kt`.
          Android integration: `app/.../MainActivity.kt`.
          Runtime suite: `V4NavigationRuntimeTest.kt`.

          Destinations: Home; Workspace(Library/Converters/Graphs/History); ToolDetail; ConverterDetail; GraphDetail; HistoryDetail; Settings(returnTab); WidgetCenter(returnTab).

          Primary tab switching replaces primary state instead of building an unbounded stack.
          Detail destinations restore semantic parents. Invalid restored IDs fall back safely.
          Current functional-shell bottom navigation is Library / Convert / Graphs / History + Settings.
          Deep links: `veltrix://home/...`, `veltrix://tool/...`, `veltrix://converter/...`.
          System IME and root Back remain Android-owned.
          Older UX row names absent from executable source are not backend contracts.
          """

          categories = [
              "Length","Area","Volume","Mass","Temperature","Speed","Pressure","Power","Energy","Force",
              "Torque","Density","Acceleration","Data / Storage","Angle","Time","Frequency","Current","Voltage",
              "Resistance","Charge","Capacitance","Inductance"
          ]
          docs_content["CONVERTER_CATALOG_VNEXT.md"] = """# Veltrix Calculator V4 — Converter Catalog VNext

          Canonical source: `ConversionRegistry.default()`.

          Deterministic categories:
          """ + "\n".join(f"- {x}" for x in categories) + """

          Contract:
          - finite input/result guards;
          - linear and affine/offset conversion;
          - category-safe lookup;
          - categoryless ambiguous aliases fail closed;
          - exact case-sensitive canonical IDs may be used by `convert()`;
          - Fahrenheit/Farad and Celsius/Coulomb collisions are disambiguated by contract;
          - live Currency is a separate freshness-aware data subsystem.
          """

          docs_content["WIDGET_PRODUCT_SPEC.md"] = """# Veltrix Calculator V4 — Widget Product Spec

          Canonical implementation: `V4WidgetProviders.kt`, `WidgetConfigActivity.kt`, `StateStores.kt`, `WidgetStateStores.kt`.

          Four families:
          1. Mini Calculator
          2. Quick Converter
          3. Currency Converter
          4. Currency Rate Board

          Every `appWidgetId` owns isolated configuration/runtime state. Stale ID reuse resets incompatible state; deletion cleans stores.
          Responsive capability tiers: XS 57x70, S 130x102, M 203x220, L 276x337, XL 349x455 dp minimums.
          Mini Calculator uses `PlatformEngine`; Quick Converter uses `ConversionRegistry`; currency widgets use `CurrencyRepository`.
          Stale/offline Currency is labeled honestly. Widget actions use exact deep-link context.
          Final acceptance requires real launcher pin/add evidence where the emulator launcher supports it, plus bound-provider resize/multi-instance/process-death proof.
          """

          docs_content["MIGRATION_REPORT.md"] = """# Veltrix Calculator V4 — Migration Report

          Backend 1.1 verified baseline: `544d7e8f8afefcd8a0a61724a4f3c525078181ce`.

          V4 preserves canonical calculation/history semantics while expanding registry schema, navigation state and four-family widget contracts.
          History schema migration preserves prior rows.
          Widget schema normalizes to version 4, maps supported legacy widget tool IDs, resets unsupported legacy state explicitly, and scopes state by `appWidgetId`.
          No destructive account/server migration is required by this Android-local V4 foundation.
          Final runtime migration/process-death evidence is produced by the exact-SHA final gate, not claimed by this document alone.
          """

          docs_content["TEST_REPORT.md"] = f"""# Veltrix Calculator Backend V4 — Test Report

          Status: FINAL-CLEAN PENDING AT MATERIALIZATION TIME.

          Preserved executed evidence:
          - core/Android proof run `32437008752`, job `96640156663`;
          - registry coverage run `32437190869`, job `96640679302`;
          - actual registry count: {len(rows)};
          - Physics: {len(physics)} tools / {solve_count} solve targets.

          Materialization parent: `{parent_sha}`
          Registry SHA-256: `{registry_sha}`
          Subject matrix SHA-256: `{subject_sha}`
          Solve-target matrix SHA-256: `{solve_sha}`

          The final exact descendant must rerun clean core/app builds, emulator install/runtime, navigation, widgets, currency, process death, offline semantics, performance sanity, reinstall/relaunch and package/hash provenance.
          """

          docs_content["VERIFIED_CLAIMED_NOT_VERIFIED.md"] = """# V4 — VERIFIED / CLAIMED / NOT VERIFIED

          ## VERIFIED ancestor evidence
          - deterministic core ambiguity fix and exact-SHA core/Android compile proof;
          - generated 260-tool registry coverage/solve-target audit.

          ## IMPLEMENTED, FINAL EXACT-SHA PROOF REQUIRED
          - V4 navigation runtime on final descendant;
          - four widget families on final descendant;
          - live currency + stale/offline/reconnect truth on final descendant;
          - process-death restoration;
          - performance/no-freeze sanity;
          - final APK/source/evidence provenance.

          ## NOT VERIFIED BY EMULATOR-ONLY CI
          - physical OEM launcher-specific behavior;
          - physical device camera quality;
          - Play Store release/upload signing.

          No source document may upgrade these states without executed evidence.
          """

          docs_content["FRONTEND_HANDOFF_VNEXT.md"] = """# Veltrix Calculator V4 — Frontend Handoff VNext

          Frontend owns final visual design. Backend owns deterministic calculation/domain/navigation/persistence semantics.

          Canonical integration points:
          - `PlatformEngine.execute`
          - `ToolRegistry.default`
          - `ConversionRegistry`
          - `CurrencyRepository`
          - `AppNavigationState`
          - `HistoryDb`
          - `PersonalizationStore`
          - widget config/runtime stores.

          Frontend must not duplicate canonical tool IDs, formulas, solve-target rules, converter registries, route semantics, persistence schemas or currency freshness logic.
          Render from `ToolDefinition`; preserve canonical IDs/schema versions across history, reopen and deep links.
          """

          docs_content["SCIENTIFIC_CALCULATOR_MATRIX.md"] = """# Scientific Calculator Capability Matrix

          Canonical source: `ExpressionEngine.kt` + `scientific-calculator`.
          Implemented: arithmetic, unary signs, parentheses, power, factorial/percent, constants pi/e/tau/phi, trig/inverse trig DEG/RAD, hyperbolic functions, roots, logs/exp, abs/floor/ceil/round/min/max, structured domain/divide-by-zero/non-finite errors.
          Arbitrary-precision transcendental and general complex-valued scientific functions are not claimed by this mode; complex capabilities are separate tools.
          """

          docs_content["CONVERTER_COVERAGE_MATRIX.md"] = """# Converter Coverage Matrix

          Canonical source: `ConversionRegistry.default()`.
          Ambiguous categoryless aliases fail closed; contextual category lookup remains deterministic; exact canonical IDs preserve conversion compatibility.
          Currency is not mixed into physical-unit conversion math.
          Core tests are the executable contract.
          """

          docs_content["ANDROID_INTEGRATION_RUNTIME_REPORT.md"] = """# Android Integration Runtime Report

          Status: READY FOR FINAL EXACT-SHA EXECUTION — NOT SELF-ASSERTED GREEN.

          Final workflow must prove app/test APK build/install, cold launch, navigation/deep-links, calculator→converter adjacency, widget families/launcher binding/resize/multi-instance, currency truth, process death, offline semantics, performance sanity, uninstall/reinstall/relaunch, artifact hashes and provenance.
          """

          docs_content["ANDROID_SCREEN_CONTRACT_EVIDENCE.md"] = """# Android Screen Contract Evidence

          `V4NavigationRuntimeTest` is the executable navigation/back/recreation/deep-link contract.
          `V4WidgetRuntimeTest` is the executable four-family/tier/config/deep-link/state contract.
          `V4FinalRuntimeAcceptanceTest` adds bound-launcher-widget and measured runtime acceptance on the final emulator.
          Source listing is not final runtime proof.
          """

          docs_content["CALCULATOR_BACKEND_V4_PROVENANCE.md"] = f"""# Calculator Backend V4 — Provenance

          Repository: `Rahmowin-1st/Veltrix-Hom-`
          Branch: `veltrix-calculator-backend-v4-reset`
          Materialization parent: `{parent_sha}`
          Baseline: `544d7e8f8afefcd8a0a61724a4f3c525078181ce`
          Registry SHA-256: `{registry_sha}`
          Subject matrix SHA-256: `{subject_sha}`
          Solve-target matrix SHA-256: `{solve_sha}`

          The final workflow binds tested source to `github.sha` and packages exact source/APK/evidence with SHA-256.
          """

          docs_content["CALCULATOR_BACKEND_V4_TEST_REPORT.md"] = docs_content["TEST_REPORT.md"]

          with (docs / "AC_NAV_FINAL_LEDGER.tsv").open("w", encoding="utf-8", newline="") as out:
              w = csv.writer(out, delimiter="\t", lineterminator="\n")
              w.writerow(["id","requirement","status","test/evidence","exactSHA","limitations"])
              for prefix, count in (("AC",110),("NAV",25)):
                  for i in range(1,count+1):
                      w.writerow([
                          f"{prefix}-{i:02d}",
                          "Exact original requirement wording unavailable in indexed continuation sources; requirement text must not be invented.",
                          "NOT VERIFIED",
                          "Original 2,237-line V4 mission required for exact mapping",
                          "",
                          "ID preserved; no fabricated PASS."
                      ])

          for name, content in docs_content.items():
              (docs / name).write_text(content, encoding="utf-8")

          (docs / "V4_FINAL_GATE_READY").write_text(
              "READY_TO_EXECUTE_FINAL_CLEAN_V2\n"
              f"materialization_parent={parent_sha}\n"
              "This marker is not a PASS claim.\n",
              encoding="utf-8"
          )

          required = [
              "NAVIGATION_ARCHITECTURE.md","LIBRARY_CATALOG_VNEXT.md","SUBJECT_RESEARCH_MAP.md",
              "SUBJECT_COVERAGE_MATRIX.tsv","SOLVE_TARGET_MATRIX.tsv","CONVERTER_CATALOG_VNEXT.md",
              "WIDGET_PRODUCT_SPEC.md","MIGRATION_REPORT.md","TEST_REPORT.md",
              "VERIFIED_CLAIMED_NOT_VERIFIED.md","FRONTEND_HANDOFF_VNEXT.md",
              "CURRICULUM_SOURCE_MAP.md","PHYSICS_GRADE_8_FULL_MAP.tsv","PHYSICS_GRADE_9_FULL_MAP.tsv",
              "PHYSICS_GRADE_10_FULL_MAP.tsv","PHYSICS_GRADE_11_FULL_MAP.tsv","PHYSICS_ADVANCED_MAP.tsv",
              "AC_NAV_FINAL_LEDGER.tsv","V4_FINAL_GATE_READY"
          ]
          missing = [p for p in required if not (docs/p).is_file() or (docs/p).stat().st_size == 0]
          if missing:
              raise SystemExit(f"missing outputs: {missing}")
          if (docs/"SUBJECT_COVERAGE_MATRIX.tsv").read_bytes() != (build/"subject-coverage-matrix.tsv").read_bytes():
              raise SystemExit("subject matrix byte drift")
          if (docs/"SOLVE_TARGET_MATRIX.tsv").read_bytes() != (build/"solve-target-matrix.tsv").read_bytes():
              raise SystemExit("solve-target matrix byte drift")

          PY
          git diff --check

      - name: Commit exact materialized outputs
        id: commit
        run: |
          set -euxo pipefail
          git config user.name veltrix-backend-bot
          git config user.email veltrix-backend-bot@users.noreply.github.com
          git add calculator-v4/docs
          test -n "$(git diff --cached --name-only)"
          git diff --cached --check
          git commit -m 'docs(v4): materialize exact final VNext contracts'
          FINAL_SHA="$(git rev-parse HEAD)"
          echo "final_sha=$FINAL_SHA" >> "$GITHUB_OUTPUT"
          git push origin "HEAD:$BRANCH"
          printf 'materialized_sha=%s\nrun_id=%s\n' "$FINAL_SHA" "$GITHUB_RUN_ID"

      - name: Final source pointer
        run: |
          echo "Final source SHA after materialization: ${{ steps.commit.outputs.final_sha }}"
          echo "Push of V4_FINAL_GATE_READY triggers Veltrix V4 Final Clean Proof V2."
