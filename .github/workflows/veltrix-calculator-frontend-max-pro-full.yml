name: Veltrix Calculator Frontend MAX PRO Full Gate

on:
  push:
    branches: [ veltrix-calculator-frontend-max-pro ]
    paths:
      - 'frontend-max-pro-full-v3/**'
      - '.github/workflows/veltrix-calculator-frontend-max-pro-full.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact accepted Backend 1.1 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9102778871/zip > backend-v5-artifact.zip
          unzip -q backend-v5-artifact.zip -d backend-v5-artifact
          test -f backend-v5-artifact/VeltrixCalculator-Backend-1.1-FINAL-TESTED-SOURCE.zip
          echo "4bdd0bdbc493c506c94c11a65f5e47e4637f1587ffe5523c6c50428f9621e0b9  backend-v5-artifact/VeltrixCalculator-Backend-1.1-FINAL-TESTED-SOURCE.zip" | sha256sum -c -
          mkdir ci-project
          unzip -q backend-v5-artifact/VeltrixCalculator-Backend-1.1-FINAL-TESTED-SOURCE.zip -d ci-project
          test -d ci-project/VeltrixCalculator

      - name: Seal frozen backend/domain
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          sha256sum -c "$GITHUB_WORKSPACE/frontend-max-pro-prototype/core-frozen.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/frontend-max-pro-prototype/app-backend-boundaries.sha256"
          cp "$GITHUB_WORKSPACE/frontend-max-pro-prototype/core-frozen.sha256" "$GITHUB_WORKSPACE/core-before.sha256"
          cp "$GITHUB_WORKSPACE/frontend-max-pro-prototype/app-backend-boundaries.sha256" "$GITHUB_WORKSPACE/app-boundaries-before.sha256"

      - name: Restore verified Phase 2 optical material layer
        run: |
          set -euo pipefail
          cat frontend-max-pro-prototype/chunk_* > prototype-overlay.b64
          base64 -d prototype-overlay.b64 > prototype-overlay.tar.gz
          echo "eaf06617416ddceb8e88368e8af5d79e3e1844fa1742f86cedf926a4ea1a99c6  prototype-overlay.tar.gz" | sha256sum -c -
          echo "41d6d44baea6632b3c7586adb3fa316c2aa5c86341dcb20bbb1e0b69f813c322  frontend-max-pro-prototype/phase2-visual-evidence.patch" | sha256sum -c -
          tar -xzf prototype-overlay.tar.gz -C ci-project/VeltrixCalculator
          (cd ci-project/VeltrixCalculator && patch -p1 < "$GITHUB_WORKSPACE/frontend-max-pro-prototype/phase2-visual-evidence.patch")
          grep -q 'RuntimeShader' ci-project/VeltrixCalculator/app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          grep -q 'uniform shader scene' ci-project/VeltrixCalculator/app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          grep -q 'boundsOrigin' ci-project/VeltrixCalculator/app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt

      - name: Apply full MAX PRO presentation overlay
        run: |
          set -euo pipefail
          cat frontend-max-pro-full-v3/chunk_* > full-overlay.b64
          base64 -d full-overlay.b64 > full-overlay.tar.gz
          echo "695b6ad6c16b0f808d5fef04a77e83435eadfeb19c646dab959b8c422febf37e  full-overlay.tar.gz" | sha256sum -c -
          tar -xzf full-overlay.tar.gz -C ci-project/VeltrixCalculator
          test -f ci-project/VeltrixCalculator/app/src/main/kotlin/com/veltrix/calculator/app/frontend/VeltrixUi.kt
          test -f ci-project/VeltrixCalculator/app/src/main/kotlin/com/veltrix/calculator/app/frontend/VeltrixGraphView.kt
          test -f ci-project/VeltrixCalculator/app/src/androidTest/kotlin/com/veltrix/calculator/app/FrontendMaxProRuntimeTest.kt

      - name: Static architecture contracts and frozen proof
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          sha256sum -c "$GITHUB_WORKSPACE/frontend-max-pro-prototype/core-frozen.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/frontend-max-pro-prototype/app-backend-boundaries.sha256"
          find core -type f -print0 | sort -z | xargs -0 sha256sum > "$GITHUB_WORKSPACE/core-tree-after.sha256"
          test "$(grep -c 'setContentView' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt)" -eq 1
          grep -q 'veltrix_persistent_shell' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'NoImeEditText' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'showSoftInputOnFocus = false' app/src/main/kotlin/com/veltrix/calculator/app/frontend/VeltrixUi.kt
          ! grep -qi 'bottom_navigation' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          ! grep -qi 'Smart Calculator' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          ! grep -qi 'AI chat' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'main_brain' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'converters_screen' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'library_screen' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'graph_screen' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'history_screen' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'settings_screen' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK and emulator image
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Frozen core regression and canonical registry
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stacktrace :core:test | tee "$GITHUB_WORKSPACE/core-tests.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/core-tests.txt"
          test -s core/build/registry-export.tsv
          TOOLS=$(tail -n +3 core/build/registry-export.tsv | wc -l)
          SUBJECTS=$(tail -n +3 core/build/registry-export.tsv | cut -f3 | sort -u | wc -l)
          printf 'registry_tool_count=%s\nregistry_subject_count=%s\n' "$TOOLS" "$SUBJECTS" | tee "$GITHUB_WORKSPACE/registry-count.txt"
          test "$TOOLS" -eq 104
          test "$SUBJECTS" -eq 9

      - name: Compile MAX PRO APK and instrumentation
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest | tee "$GITHUB_WORKSPACE/android-compile.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/android-compile.txt"
          test -s app/build/outputs/apk/debug/app-debug.apk
          find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | grep -q .

      - name: Boot API 35 emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/veltrix-maxpro-full-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_maxpro_full_api35 -k "system-images;android-35;google_apis;x86_64" -f
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_maxpro_full_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb get-state | tr -d '\r' | grep -Fx device
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1

      - name: Install and MAX PRO runtime contracts
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP_APK" | tee "$GITHUB_WORKSPACE/install-app.txt"
          grep -q Success "$GITHUB_WORKSPACE/install-app.txt"
          adb install -r -t "$TEST_APK" | tee "$GITHUB_WORKSPACE/install-test.txt"
          grep -q Success "$GITHUB_WORKSPACE/install-test.txt"
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$I"
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendMaxProRuntimeTest "$I" | tee "$GITHUB_WORKSPACE/maxpro-runtime.txt"
          grep -q 'OK (2 tests)' "$GITHUB_WORKSPACE/maxpro-runtime.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/maxpro-runtime.txt"

      - name: Full connected regression
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stacktrace :app:connectedDebugAndroidTest | tee "$GITHUB_WORKSPACE/connected-tests.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/connected-tests.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/connected-tests.txt"

      - name: Cold launch, visual captures and motion evidence
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/maxpro-visual-evidence"
          adb shell wm size reset || true
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee "$GITHUB_WORKSPACE/cold-launch.txt"
          grep -q 'Status: ok' "$GITHUB_WORKSPACE/cold-launch.txt"
          sleep 2
          test -n "$(adb shell pidof com.veltrix.calculator | tr -d '\r')"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/01-standard.png"

          tap_desc() {
            local q="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml "$RUNNER_TEMP/window.xml" >/dev/null
            local xy
            xy=$(python3 - "$RUNNER_TEMP/window.xml" "$q" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          p,q=sys.argv[1],sys.argv[2]
          root=ET.parse(p).getroot()
          nodes=list(root.iter('node'))
          n=next((x for x in nodes if x.attrib.get('content-desc')==q),None)
          if n is None: n=next((x for x in nodes if x.attrib.get('content-desc','').startswith(q)),None)
          if n is None: n=next((x for x in nodes if x.attrib.get('text')==q),None)
          if n is None: raise SystemExit('not found: '+q)
          a=list(map(int,re.findall(r'\d+',n.attrib['bounds'])))
          print((a[0]+a[2])//2,(a[1]+a[3])//2)
          PY
          )
            adb shell input tap $xy
            sleep 0.7
          }

          adb shell screenrecord --time-limit 10 /sdcard/maxpro-motion.mp4 >/dev/null 2>&1 & REC=$!
          tap_desc "7"
          tap_desc "+"
          tap_desc "8"
          tap_desc "="
          tap_desc "Main Brain"
          sleep 1
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/02-main-brain.png"
          tap_desc "Library"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/03-library.png"
          adb shell input keyevent 4; sleep 0.7
          tap_desc "Main Brain"
          tap_desc "Graphs"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/04-graph.png"
          adb shell input keyevent 4; sleep 0.7
          tap_desc "Main Brain"
          tap_desc "History"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/05-history.png"
          adb shell input keyevent 4; sleep 0.7
          tap_desc "Converters"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/06-converters.png"
          adb shell input keyevent 4; sleep 0.7
          tap_desc "Main Brain"
          tap_desc "Settings"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/07-settings.png"
          adb shell input swipe 180 1450 285 1450 420 || true
          adb shell input keyevent 4; sleep 0.7
          tap_desc "Main Brain"
          sleep 0.5
          wait "$REC" || true
          adb pull /sdcard/maxpro-motion.mp4 "$GITHUB_WORKSPACE/maxpro-visual-evidence/maxpro-motion.mp4" >/dev/null
          test -s "$GITHUB_WORKSPACE/maxpro-visual-evidence/maxpro-motion.mp4"
          for f in "$GITHUB_WORKSPACE"/maxpro-visual-evidence/*.png; do test -s "$f"; done

      - name: Live-process frame timing and memory evidence
        run: |
          set -euo pipefail
          test -n "$(adb shell pidof com.veltrix.calculator | tr -d '\r')"
          adb shell dumpsys gfxinfo com.veltrix.calculator reset >/dev/null
          adb shell uiautomator dump /sdcard/perf.xml >/dev/null
          adb pull /sdcard/perf.xml "$RUNNER_TEMP/perf.xml" >/dev/null
          XY=$(python3 - "$RUNNER_TEMP/perf.xml" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot(); nodes=list(root.iter('node'))
          n=next((x for x in nodes if x.attrib.get('content-desc')=='7'),None)
          if n is None: raise SystemExit('calculator key not found')
          a=list(map(int,re.findall(r'\d+',n.attrib['bounds']))); print((a[0]+a[2])//2,(a[1]+a[3])//2)
          PY
          )
          for i in $(seq 1 45); do adb shell input tap $XY >/dev/null; done
          sleep 1
          test -n "$(adb shell pidof com.veltrix.calculator | tr -d '\r')"
          adb shell dumpsys gfxinfo com.veltrix.calculator > maxpro-gfxinfo.txt
          adb shell dumpsys gfxinfo com.veltrix.calculator framestats > maxpro-framestats.txt
          adb shell dumpsys meminfo com.veltrix.calculator > maxpro-meminfo.txt
          ! grep -q 'No process found' maxpro-gfxinfo.txt
          ! grep -q 'No process found' maxpro-framestats.txt
          ! grep -q 'No process found' maxpro-meminfo.txt
          grep -q 'Janky frames' maxpro-gfxinfo.txt || grep -q 'PROFILEDATA' maxpro-framestats.txt
          python3 - <<'PY' | tee maxpro-performance-summary.txt
          import re
          t=open('maxpro-gfxinfo.txt',errors='ignore').read()
          for label in ['Total frames rendered','Janky frames','50th percentile','90th percentile','95th percentile','99th percentile']:
              m=re.search(r'^\s*'+re.escape(label)+r':\s*(.*)$',t,re.M)
              if m: print(f'{label}: {m.group(1).strip()}')
          PY

      - name: Offline deterministic backend smoke after frontend rebuild
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          adb shell cmd connectivity airplane-mode enable || adb shell settings put global airplane_mode_on 1
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.BackendMasterRuntimeTest#gOfflineDeterministicAndGraph' "$I" | tee "$GITHUB_WORKSPACE/offline-graph.txt"
          grep -q 'OK (1 test)' "$GITHUB_WORKSPACE/offline-graph.txt"
          adb shell cmd connectivity airplane-mode disable || adb shell settings put global airplane_mode_on 0
          adb shell svc wifi enable || true

      - name: Package exact tested MAX PRO source, APK and handoff evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p final-package
          if [ -d ci-project/VeltrixCalculator ]; then
            mkdir -p ci-project/VeltrixCalculator/docs/frontend-max-pro
            cat > ci-project/VeltrixCalculator/docs/frontend-max-pro/MAX_PRO_HANDOFF.md <<EOF
          # Veltrix Calculator Frontend MAX PRO Handoff

          Frontend branch: ${GITHUB_REF_NAME}
          Frontend commit: ${GITHUB_SHA}
          CI run: ${GITHUB_RUN_ID}
          Frozen Backend 1.1 commit: 544d7e8f8afefcd8a0a61724a4f3c525078181ce
          Frozen exact source SHA-256: 4bdd0bdbc493c506c94c11a65f5e47e4637f1587ffe5523c6c50428f9621e0b9
          Full presentation overlay SHA-256: 695b6ad6c16b0f808d5fef04a77e83435eadfeb19c646dab959b8c422febf37e

          FUNCTIONALLY VERIFIED only where CI steps are green. Physical-device Liquid Glass perception, OEM-specific behavior, 60/90/120 Hz physical-device jank, TalkBack exhaustive audit and Founder perception remain NOT VERIFIED by this emulator gate.
          EOF
            sed -i 's/^          //' ci-project/VeltrixCalculator/docs/frontend-max-pro/MAX_PRO_HANDOFF.md
            (cd ci-project && zip -qr "$GITHUB_WORKSPACE/final-package/VeltrixCalculator-Frontend-MAX-PRO-tested-source.zip" VeltrixCalculator)
          fi
          APK=ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
          if [ -s "$APK" ]; then cp "$APK" final-package/VeltrixCalculator-Frontend-MAX-PRO.apk; fi
          cp -f core-before.sha256 core-tree-after.sha256 app-boundaries-before.sha256 final-package/ 2>/dev/null || true
          cp -f core-tests.txt registry-count.txt android-compile.txt connected-tests.txt maxpro-runtime.txt cold-launch.txt maxpro-gfxinfo.txt maxpro-framestats.txt maxpro-meminfo.txt maxpro-performance-summary.txt offline-graph.txt emulator.log final-package/ 2>/dev/null || true
          cp -rf maxpro-visual-evidence final-package/ 2>/dev/null || true
          if [ -f final-package/VeltrixCalculator-Frontend-MAX-PRO.apk ]; then sha256sum final-package/VeltrixCalculator-Frontend-MAX-PRO.apk | tee final-package/apk.sha256; fi
          if [ -f final-package/VeltrixCalculator-Frontend-MAX-PRO-tested-source.zip ]; then sha256sum final-package/VeltrixCalculator-Frontend-MAX-PRO-tested-source.zip | tee final-package/tested-source.sha256; fi
          printf 'frontend_branch=%s\nfrontend_commit=%s\nci_run_id=%s\nbackend_commit=%s\nbackend_exact_source_sha256=%s\nfull_overlay_sha256=%s\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            544d7e8f8afefcd8a0a61724a4f3c525078181ce \
            4bdd0bdbc493c506c94c11a65f5e47e4637f1587ffe5523c6c50428f9621e0b9 \
            695b6ad6c16b0f808d5fef04a77e83435eadfeb19c646dab959b8c422febf37e | tee final-package/provenance.txt

      - name: Upload MAX PRO final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixCalculator-Frontend-MAX-PRO-Full-evidence
          path: final-package/
          if-no-files-found: error
