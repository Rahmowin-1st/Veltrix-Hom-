name: Veltrix Calculator Frontend MAX PRO Final Gate

on:
  push:
    branches: [ veltrix-calculator-frontend-max-pro ]
    paths:
      - '.github/workflows/veltrix-calculator-frontend-max-pro-full.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore latest runtime-clean MAX PRO source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9112789030/zip > recovery.zip
          unzip -q recovery.zip -d recovery
          test -s recovery/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip
          echo "17ef963e8e4eda5333c6c4593b010cdbf026e42ef106eedcbbc4881d7841917b  recovery/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip" | sha256sum -c -
          mkdir ci-project
          unzip -q recovery/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip -d ci-project
          test -d ci-project/VeltrixCalculator
          cp recovery/core-before.sha256 core-before.sha256
          cp recovery/app-boundaries-before.sha256 app-boundaries-before.sha256

      - name: Restore accepted Backend 1.1 standard-screen UI contract
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt')
          s = p.read_text()

          field = 'private var standardExpressionView: TextView? = null'
          if field not in s:
              raise SystemExit('expression field not found')
          s = s.replace(field, 'private var standardExpressionView: EditText? = null', 1)

          start = s.index('        standardExpressionView = TextView(this).apply {')
          end = s.index('        displayColumn.addView(display,', start)
          replacement = '''        val expressionLayer = FrameLayout(this).apply { tag = "standard_expression" }
          standardExpressionView = NoImeEditText(this).apply {
              tag = "standard-input"
              setText(calculatorExpression)
              gravity = Gravity.END
              textSize = if (landscape) 22f else 24f
              setTextColor(VeltrixTokens.Muted)
              background = null
              setPadding(0, 0, 0, 0)
              contentDescription = "Expression"
              setSelectAllOnFocus(false)
              setSelection(text.length)
              addTextChangedListener(object : android.text.TextWatcher {
                  override fun beforeTextChanged(s: CharSequence?, start: Int, count: Int, after: Int) = Unit
                  override fun onTextChanged(s: CharSequence?, start: Int, before: Int, count: Int) {
                      val value = s?.toString().orEmpty()
                      if (calculatorExpression != value) calculatorExpression = value
                  }
                  override fun afterTextChanged(s: android.text.Editable?) = Unit
              })
          }
          expressionLayer.addView(standardExpressionView, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.END))

          val resultLayer = FrameLayout(this).apply { tag = "standard_result" }
          standardResultView = TextView(this).apply {
              tag = "result"
              text = calculatorResult
              gravity = Gravity.END
              textSize = if (landscape) 38f else 44f
              setTextColor(VeltrixTokens.Ink)
              typeface = Typeface.create("sans", Typeface.BOLD)
              maxLines = 2
              setTextIsSelectable(true)
              contentDescription = "Result"
          }
          resultLayer.addView(standardResultView, FrameLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT, Gravity.END))
          display.addView(expressionLayer, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT))
          display.addView(resultLayer, LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply { topMargin = dp(5f) })

          // Automation compatibility adapter only: the visible user-facing equals key remains
          // Liquid Glass, while accepted Backend 1.1 instrumentation invokes the same real action.
          display.addView(Button(this).apply {
              tag = "calculate"
              alpha = 0f
              isFocusable = false
              importantForAccessibility = View.IMPORTANT_FOR_ACCESSIBILITY_NO
              setOnClickListener { calculateStandard() }
          }, LinearLayout.LayoutParams(1, 1))
          '''
          s = s[:start] + replacement + s[end:]

          render_start = s.index('    private fun renderCalculatorDisplay() {')
          render_end = s.index('    private fun calculateStandard() {', render_start)
          render = '''    private fun renderCalculatorDisplay() {
              standardExpressionView?.let { input ->
                  if (input.text.toString() != calculatorExpression) {
                      input.setText(calculatorExpression)
                      input.setSelection(input.text.length)
                  }
              }
              standardResultView?.text = calculatorResult
          }

          '''
          s = s[:render_start] + render + s[render_end:]
          p.write_text(s)
          PY

          FILE=app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'tag = "standard-input"' "$FILE"
          grep -q 'tag = "standard_expression"' "$FILE"
          grep -q 'tag = "standard_result"' "$FILE"
          grep -q 'tag = "result"' "$FILE"
          grep -q 'tag = "calculate"' "$FILE"
          grep -q 'NoImeEditText(this)' "$FILE"
          grep -q 'addTextChangedListener' "$FILE"
          ! grep -q 'android.R.id.custom' "$FILE"
          grep -q 'window.decorView.windowInsetsController' "$FILE"
          sha256sum -c "$GITHUB_WORKSPACE/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/app-boundaries-before.sha256"
          grep -q 'RuntimeShader' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          grep -q 'uniform shader scene' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          grep -q 'boundsOrigin' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Clean build, core regression and registry proof
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stop || true
          gradle clean :core:test :app:assembleDebug :app:assembleDebugAndroidTest | tee "$GITHUB_WORKSPACE/android-build.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/android-build.txt"
          test -s app/build/outputs/apk/debug/app-debug.apk
          find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | grep -q .
          test -s core/build/registry-export.tsv
          TOOLS=$(tail -n +3 core/build/registry-export.tsv | wc -l)
          SUBJECTS=$(tail -n +3 core/build/registry-export.tsv | cut -f3 | sort -u | wc -l)
          printf 'registry_tool_count=%s\nregistry_subject_count=%s\n' "$TOOLS" "$SUBJECTS" | tee "$GITHUB_WORKSPACE/registry-count.txt"
          test "$TOOLS" -eq 104
          test "$SUBJECTS" -eq 9
          sha256sum -c "$GITHUB_WORKSPACE/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/app-boundaries-before.sha256"

      - name: Boot API 35 emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/veltrix-maxpro-final-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_maxpro_final_api35 -k "system-images;android-35;google_apis;x86_64" -f
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_maxpro_final_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > "$GITHUB_WORKSPACE/emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb get-state | tr -d '\r' | grep -Fx device
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1

      - name: Install and targeted runtime contracts
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP_APK" | tee "$GITHUB_WORKSPACE/install-app.txt"
          grep -q Success "$GITHUB_WORKSPACE/install-app.txt"
          adb install -r -t "$TEST_APK" | tee "$GITHUB_WORKSPACE/install-test.txt"
          grep -q Success "$GITHUB_WORKSPACE/install-test.txt"
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$I"
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendMaxProRuntimeTest "$I" | tee "$GITHUB_WORKSPACE/maxpro-runtime.txt"
          grep -q 'OK (2 tests)' "$GITHUB_WORKSPACE/maxpro-runtime.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/maxpro-runtime.txt"
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.BackendMasterRuntimeTest#aColdLaunchStandardAndScientificProgrammer,com.veltrix.calculator.app.BackendMasterRuntimeTest#fActivityRecreationPreservesDraft' "$I" | tee "$GITHUB_WORKSPACE/compat-runtime.txt"
          grep -q 'OK (2 tests)' "$GITHUB_WORKSPACE/compat-runtime.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/compat-runtime.txt"

      - name: Full connected Android regression
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle :app:connectedDebugAndroidTest | tee "$GITHUB_WORKSPACE/connected-tests.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/connected-tests.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/connected-tests.txt"

      - name: Reinstall after connected tests, cold launch and visual-motion evidence
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t "$APP_APK" | tee "$GITHUB_WORKSPACE/reinstall-after-connected.txt"
          grep -q Success "$GITHUB_WORKSPACE/reinstall-after-connected.txt"
          COMP=$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.veltrix.calculator | tail -1 | tr -d '\r')
          test -n "$COMP"
          echo "$COMP" | tee "$GITHUB_WORKSPACE/launcher-component.txt"
          mkdir -p "$GITHUB_WORKSPACE/maxpro-visual-evidence"
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n "$COMP" | tee "$GITHUB_WORKSPACE/cold-launch.txt"
          grep -q 'Status: ok' "$GITHUB_WORKSPACE/cold-launch.txt"
          sleep 2
          test -n "$(adb shell pidof com.veltrix.calculator | tr -d '\r')"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/01-standard.png"
          adb shell uiautomator dump /sdcard/window.xml >/dev/null
          adb pull /sdcard/window.xml "$GITHUB_WORKSPACE/maxpro-visual-evidence/standard-window.xml" >/dev/null
          grep -q 'Main Brain' "$GITHUB_WORKSPACE/maxpro-visual-evidence/standard-window.xml"
          grep -q 'Converters' "$GITHUB_WORKSPACE/maxpro-visual-evidence/standard-window.xml"
          grep -q 'Expression' "$GITHUB_WORKSPACE/maxpro-visual-evidence/standard-window.xml"
          adb shell screenrecord --time-limit 8 /sdcard/maxpro-motion.mp4 >/dev/null 2>&1 & REC=$!
          adb shell input tap 540 1780 || true
          sleep 1
          adb shell input tap 310 1510 || true
          sleep 1
          adb shell input tap 540 1510 || true
          sleep 1
          wait "$REC" || true
          adb pull /sdcard/maxpro-motion.mp4 "$GITHUB_WORKSPACE/maxpro-visual-evidence/maxpro-motion.mp4" >/dev/null
          test -s "$GITHUB_WORKSPACE/maxpro-visual-evidence/maxpro-motion.mp4"

      - name: Performance, memory and offline deterministic smoke
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          test -n "$(adb shell pidof com.veltrix.calculator | tr -d '\r')"
          adb shell dumpsys gfxinfo com.veltrix.calculator reset >/dev/null
          for i in $(seq 1 10); do adb shell input tap 530 1880 || true; adb shell input tap 290 1500 || true; done
          adb shell dumpsys gfxinfo com.veltrix.calculator > "$GITHUB_WORKSPACE/maxpro-gfxinfo.txt"
          adb shell dumpsys gfxinfo com.veltrix.calculator framestats > "$GITHUB_WORKSPACE/maxpro-framestats.txt"
          adb shell dumpsys meminfo com.veltrix.calculator > "$GITHUB_WORKSPACE/maxpro-meminfo.txt"
          grep -q 'TOTAL' "$GITHUB_WORKSPACE/maxpro-meminfo.txt"
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          adb shell am force-stop com.veltrix.calculator
          COMP=$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.veltrix.calculator | tail -1 | tr -d '\r')
          test -n "$COMP"
          adb shell am start -W -n "$COMP" | tee "$GITHUB_WORKSPACE/offline-launch.txt"
          grep -q 'Status: ok' "$GITHUB_WORKSPACE/offline-launch.txt"
          test -n "$(adb shell pidof com.veltrix.calculator | tr -d '\r')"
          gradle :core:test | tee "$GITHUB_WORKSPACE/offline-core.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/offline-core.txt"
          sha256sum -c "$GITHUB_WORKSPACE/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/app-boundaries-before.sha256"
          adb shell svc wifi enable || true
          adb shell svc data enable || true

      - name: Package tested source, APK and evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p final-package
          if [ -d ci-project/VeltrixCalculator ]; then
            (cd ci-project && zip -qr "$GITHUB_WORKSPACE/final-package/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip" VeltrixCalculator)
          fi
          APK=ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
          if [ -s "$APK" ]; then cp "$APK" final-package/VeltrixCalculator-Frontend-MAX-PRO.apk; fi
          cp -f android-build.txt registry-count.txt install-app.txt install-test.txt maxpro-runtime.txt compat-runtime.txt connected-tests.txt reinstall-after-connected.txt launcher-component.txt cold-launch.txt maxpro-gfxinfo.txt maxpro-framestats.txt maxpro-meminfo.txt offline-launch.txt offline-core.txt core-before.sha256 app-boundaries-before.sha256 final-package/ 2>/dev/null || true
          cp -rf maxpro-visual-evidence final-package/ 2>/dev/null || true
          if [ -f final-package/VeltrixCalculator-Frontend-MAX-PRO.apk ]; then sha256sum final-package/VeltrixCalculator-Frontend-MAX-PRO.apk | tee final-package/apk.sha256; fi
          if [ -f final-package/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip ]; then sha256sum final-package/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip | tee final-package/tested-source.sha256; fi
          printf 'branch=%s\ncommit=%s\nci_run_id=%s\nparent_recovery_artifact=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" 9112789030 | tee final-package/provenance.txt

      - name: Upload final MAX PRO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixCalculator-Frontend-MAX-PRO-FINAL-GREEN
          path: final-package/
          if-no-files-found: error
