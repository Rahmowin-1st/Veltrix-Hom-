name: Veltrix Calculator Frontend MAX PRO Recovery Gate

on:
  push:
    branches: [ veltrix-calculator-frontend-max-pro ]
    paths:
      - '.github/workflows/veltrix-calculator-frontend-max-pro-full.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact MAX PRO source from failed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9111583449/zip > recovery-artifact.zip
          unzip -q recovery-artifact.zip -d recovery-artifact
          test -s recovery-artifact/VeltrixCalculator-Frontend-MAX-PRO-tested-source.zip
          mkdir ci-project
          unzip -q recovery-artifact/VeltrixCalculator-Frontend-MAX-PRO-tested-source.zip -d ci-project
          test -d ci-project/VeltrixCalculator
          cp -f recovery-artifact/core-before.sha256 "$GITHUB_WORKSPACE/core-before.sha256"
          cp -f recovery-artifact/app-boundaries-before.sha256 "$GITHUB_WORKSPACE/app-boundaries-before.sha256"
          cp -f recovery-artifact/provenance.txt "$GITHUB_WORKSPACE/recovery-provenance.txt"

      - name: Apply deterministic compile recovery
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          main = Path('app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt')
          text = main.read_text()
          replacements = {
              'glassIcon(LiquidGlassButton.Glyph.GRID, "Converters") { showScreen("converters") }, dp(52f))':
                  'glassIcon(LiquidGlassButton.Glyph.GRID, "Converters", { showScreen("converters") }, dp(52f))',
              'glassIcon(LiquidGlassButton.Glyph.LIBRARY, "Library") { showScreen("library") }, dp(52f))':
                  'glassIcon(LiquidGlassButton.Glyph.LIBRARY, "Library", { showScreen("library") }, dp(52f))',
              'glassIcon(LiquidGlassButton.Glyph.BRAIN, "Main Brain") { openBrain() }, dp(52f))':
                  'glassIcon(LiquidGlassButton.Glyph.BRAIN, "Main Brain", { openBrain() }, dp(52f))',
              'glassIcon(LiquidGlassButton.Glyph.CLOSE, "Close Main Brain") { closeBrain() }, dp(54f))':
                  'glassIcon(LiquidGlassButton.Glyph.CLOSE, "Close Main Brain", { closeBrain() }, dp(54f))',
              'val swap = glassIcon(LiquidGlassButton.Glyph.SWAP, "Swap units") {':
                  'val swap = glassIcon(LiquidGlassButton.Glyph.SWAP, "Swap units", {',
              '            from.setSelection(b); to.setSelection(a); convertNow(fromValue, from, to, toValue, units)\n        }\n        root.addView(swap,':
                  '            from.setSelection(b); to.setSelection(a); convertNow(fromValue, from, to, toValue, units)\n        })\n        root.addView(swap,',
              'pair.addView(glassIcon(LiquidGlassButton.Glyph.SWAP, "Swap currencies") {':
                  'pair.addView(glassIcon(LiquidGlassButton.Glyph.SWAP, "Swap currencies", {',
              '            currencyBase?.setText(q); currencyQuote?.setText(b); refreshCurrency(true)\n        }, LinearLayout.LayoutParams(dp(54f), dp(54f)))':
                  '            currencyBase?.setText(q); currencyQuote?.setText(b); refreshCurrency(true)\n        }), LinearLayout.LayoutParams(dp(54f), dp(54f)))',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected MainActivity recovery pattern: {old[:100]}')
              text = text.replace(old, new, 1)
          main.write_text(text)

          ui = Path('app/src/main/kotlin/com/veltrix/calculator/app/frontend/VeltrixUi.kt')
          text = ui.read_text()
          old = 'typeface = Typeface.create("sans", Typeface.MEDIUM)'
          new = 'typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)'
          if old not in text:
              raise SystemExit('missing expected VeltrixUi MEDIUM recovery pattern')
          ui.write_text(text.replace(old, new, 1))
          PY
          ! grep -n 'glassIcon(.*) {' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          ! grep -R 'Typeface.MEDIUM' app/src/main/kotlin/com/veltrix/calculator/app/frontend
          grep -q 'sans-serif-medium' app/src/main/kotlin/com/veltrix/calculator/app/frontend/VeltrixUi.kt

      - name: Verify frozen backend and architecture boundaries
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          sha256sum -c "$GITHUB_WORKSPACE/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/app-boundaries-before.sha256"
          find core -type f -print0 | sort -z | xargs -0 sha256sum > "$GITHUB_WORKSPACE/core-tree-after.sha256"
          test "$(grep -c 'setContentView' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt)" -eq 1
          grep -q 'veltrix_persistent_shell' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'NoImeEditText' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'showSoftInputOnFocus = false' app/src/main/kotlin/com/veltrix/calculator/app/frontend/VeltrixUi.kt
          grep -q 'RuntimeShader' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          grep -q 'uniform shader scene' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          grep -q 'boundsOrigin' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          grep -q 'main_brain' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'converters_screen' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'library_screen' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'graph_screen' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'history_screen' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'settings_screen' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK and emulator image
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Clean, core regression, registry proof and compile
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stop || true
          gradle clean :core:test :app:assembleDebug :app:assembleDebugAndroidTest | tee "$GITHUB_WORKSPACE/android-compile.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/android-compile.txt"
          test -s core/build/registry-export.tsv
          TOOLS=$(tail -n +3 core/build/registry-export.tsv | wc -l)
          SUBJECTS=$(tail -n +3 core/build/registry-export.tsv | cut -f3 | sort -u | wc -l)
          printf 'registry_tool_count=%s\nregistry_subject_count=%s\n' "$TOOLS" "$SUBJECTS" | tee "$GITHUB_WORKSPACE/registry-count.txt"
          test "$TOOLS" -eq 104
          test "$SUBJECTS" -eq 9
          test -s app/build/outputs/apk/debug/app-debug.apk
          find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | grep -q .

      - name: Boot API 35 emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/veltrix-maxpro-recovery-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_maxpro_recovery_api35 -k "system-images;android-35;google_apis;x86_64" -f
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_maxpro_recovery_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > "$GITHUB_WORKSPACE/emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb get-state | tr -d '\r' | grep -Fx device
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1

      - name: Install and MAX PRO runtime contracts
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP_APK" | tee "$GITHUB_WORKSPACE/install-app.txt"
          grep -q Success "$GITHUB_WORKSPACE/install-app.txt"
          adb install -r -t "$TEST_APK" | tee "$GITHUB_WORKSPACE/install-test.txt"
          grep -q Success "$GITHUB_WORKSPACE/install-test.txt"
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$I"
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendMaxProRuntimeTest "$I" | tee "$GITHUB_WORKSPACE/maxpro-runtime.txt"
          grep -q 'OK (2 tests)' "$GITHUB_WORKSPACE/maxpro-runtime.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/maxpro-runtime.txt"

      - name: Full connected regression
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle :app:connectedDebugAndroidTest | tee "$GITHUB_WORKSPACE/connected-tests.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/connected-tests.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/connected-tests.txt"

      - name: Cold launch and visual-motion evidence
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/maxpro-visual-evidence"
          adb shell wm size reset || true
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee "$GITHUB_WORKSPACE/cold-launch.txt"
          grep -q 'Status: ok' "$GITHUB_WORKSPACE/cold-launch.txt"
          sleep 2
          test -n "$(adb shell pidof com.veltrix.calculator | tr -d '\r')"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/01-standard.png"

          tap_desc() {
            local q="$1"
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml "$RUNNER_TEMP/window.xml" >/dev/null
            local xy
            xy=$(python3 - "$RUNNER_TEMP/window.xml" "$q" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          p,q=sys.argv[1],sys.argv[2]
          root=ET.parse(p).getroot()
          nodes=list(root.iter('node'))
          n=next((x for x in nodes if x.attrib.get('content-desc')==q),None)
          if n is None: n=next((x for x in nodes if x.attrib.get('content-desc','').startswith(q)),None)
          if n is None: n=next((x for x in nodes if x.attrib.get('text')==q),None)
          if n is None: raise SystemExit('not found: '+q)
          a=list(map(int,re.findall(r'\d+',n.attrib['bounds'])))
          print((a[0]+a[2])//2,(a[1]+a[3])//2)
          PY
          )
            adb shell input tap $xy
            sleep 0.7
          }

          adb shell screenrecord --time-limit 12 /sdcard/maxpro-motion.mp4 >/dev/null 2>&1 & REC=$!
          tap_desc "7"
          tap_desc "+"
          tap_desc "8"
          tap_desc "="
          tap_desc "Main Brain"
          sleep 1
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/02-main-brain.png"
          tap_desc "Library"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/03-library.png"
          adb shell input keyevent 4; sleep 0.7
          tap_desc "Main Brain"
          tap_desc "Graphs"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/04-graph.png"
          adb shell input keyevent 4; sleep 0.7
          tap_desc "Main Brain"
          tap_desc "History"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/05-history.png"
          adb shell input keyevent 4; sleep 0.7
          tap_desc "Converters"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/06-converters.png"
          adb shell input keyevent 4; sleep 0.7
          tap_desc "Main Brain"
          tap_desc "Settings"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/07-settings.png"
          adb shell input keyevent 4; sleep 0.7
          tap_desc "Main Brain"
          wait "$REC" || true
          adb pull /sdcard/maxpro-motion.mp4 "$GITHUB_WORKSPACE/maxpro-visual-evidence/maxpro-motion.mp4" >/dev/null
          test -s "$GITHUB_WORKSPACE/maxpro-visual-evidence/maxpro-motion.mp4"
          for f in "$GITHUB_WORKSPACE"/maxpro-visual-evidence/*.png; do test -s "$f"; done

      - name: Live-process performance and memory evidence
        run: |
          set -euo pipefail
          test -n "$(adb shell pidof com.veltrix.calculator | tr -d '\r')"
          adb shell dumpsys gfxinfo com.veltrix.calculator reset >/dev/null
          for i in $(seq 1 12); do adb shell input tap 530 1880; adb shell input tap 290 1500; done
          adb shell dumpsys gfxinfo com.veltrix.calculator > "$GITHUB_WORKSPACE/maxpro-gfxinfo.txt"
          adb shell dumpsys gfxinfo com.veltrix.calculator framestats > "$GITHUB_WORKSPACE/maxpro-framestats.txt"
          adb shell dumpsys meminfo com.veltrix.calculator > "$GITHUB_WORKSPACE/maxpro-meminfo.txt"
          grep -q 'TOTAL' "$GITHUB_WORKSPACE/maxpro-meminfo.txt"
          grep -q 'Janky frames' "$GITHUB_WORKSPACE/maxpro-gfxinfo.txt" || true

      - name: Offline deterministic backend smoke after frontend rebuild
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee "$GITHUB_WORKSPACE/offline-launch.txt"
          grep -q 'Status: ok' "$GITHUB_WORKSPACE/offline-launch.txt"
          gradle :core:test | tee "$GITHUB_WORKSPACE/offline-core-tests.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/offline-core-tests.txt"
          adb shell svc wifi enable || true
          adb shell svc data enable || true

      - name: Final frozen-source proof
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          sha256sum -c "$GITHUB_WORKSPACE/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/app-boundaries-before.sha256"
          find core -type f -print0 | sort -z | xargs -0 sha256sum > "$GITHUB_WORKSPACE/core-tree-final.sha256"
          diff -u "$GITHUB_WORKSPACE/core-tree-after.sha256" "$GITHUB_WORKSPACE/core-tree-final.sha256"

      - name: Package tested MAX PRO source, APK and evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p final-package
          if [ -d ci-project/VeltrixCalculator ]; then
            mkdir -p ci-project/VeltrixCalculator/docs/frontend-max-pro
            cat > ci-project/VeltrixCalculator/docs/frontend-max-pro/MAX_PRO_RECOVERY_HANDOFF.md <<EOF
          # Veltrix Calculator Frontend MAX PRO Recovery Handoff

          Recovery branch: ${GITHUB_REF_NAME}
          Recovery commit: ${GITHUB_SHA}
          CI run: ${GITHUB_RUN_ID}
          Recovery source artifact: 9111583449

          The build is FUNCTIONALLY VERIFIED only when every required CI step in this run is green. Physical-device Liquid Glass perception, OEM-specific behavior, 60/90/120 Hz physical-device jank, exhaustive TalkBack audit and Founder perception remain separate release checks.
          EOF
            sed -i 's/^          //' ci-project/VeltrixCalculator/docs/frontend-max-pro/MAX_PRO_RECOVERY_HANDOFF.md
            (cd ci-project && zip -qr "$GITHUB_WORKSPACE/final-package/VeltrixCalculator-Frontend-MAX-PRO-tested-source.zip" VeltrixCalculator)
          fi
          APK=ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
          if [ -s "$APK" ]; then cp "$APK" final-package/VeltrixCalculator-Frontend-MAX-PRO.apk; fi
          cp -f "$GITHUB_WORKSPACE"/android-compile.txt "$GITHUB_WORKSPACE"/registry-count.txt "$GITHUB_WORKSPACE"/install-app.txt "$GITHUB_WORKSPACE"/install-test.txt "$GITHUB_WORKSPACE"/maxpro-runtime.txt "$GITHUB_WORKSPACE"/connected-tests.txt "$GITHUB_WORKSPACE"/cold-launch.txt "$GITHUB_WORKSPACE"/maxpro-gfxinfo.txt "$GITHUB_WORKSPACE"/maxpro-framestats.txt "$GITHUB_WORKSPACE"/maxpro-meminfo.txt "$GITHUB_WORKSPACE"/offline-launch.txt "$GITHUB_WORKSPACE"/offline-core-tests.txt "$GITHUB_WORKSPACE"/core-before.sha256 "$GITHUB_WORKSPACE"/app-boundaries-before.sha256 "$GITHUB_WORKSPACE"/core-tree-final.sha256 "$GITHUB_WORKSPACE"/recovery-provenance.txt final-package/ 2>/dev/null || true
          cp -rf "$GITHUB_WORKSPACE/maxpro-visual-evidence" final-package/ 2>/dev/null || true
          if [ -f final-package/VeltrixCalculator-Frontend-MAX-PRO.apk ]; then sha256sum final-package/VeltrixCalculator-Frontend-MAX-PRO.apk | tee final-package/apk.sha256; fi
          if [ -f final-package/VeltrixCalculator-Frontend-MAX-PRO-tested-source.zip ]; then sha256sum final-package/VeltrixCalculator-Frontend-MAX-PRO-tested-source.zip | tee final-package/tested-source.sha256; fi
          printf 'frontend_branch=%s\nfrontend_commit=%s\nci_run_id=%s\nrecovery_source_artifact=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" 9111583449 | tee final-package/provenance.txt

      - name: Upload MAX PRO recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixCalculator-Frontend-MAX-PRO-Recovery-evidence
          path: final-package/
          if-no-files-found: error
