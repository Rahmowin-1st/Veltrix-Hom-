name: Veltrix Calculator Frontend MAX PRO Final Gate

on:
  push:
    branches: [ veltrix-calculator-frontend-max-pro ]
    paths:
      - '.github/workflows/veltrix-calculator-frontend-max-pro-full.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  full-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore compile-clean MAX PRO source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9112173359/zip > recovery.zip
          unzip -q recovery.zip -d recovery
          test -s recovery/VeltrixCalculator-Frontend-MAX-PRO-tested-source.zip
          mkdir ci-project
          unzip -q recovery/VeltrixCalculator-Frontend-MAX-PRO-tested-source.zip -d ci-project
          test -d ci-project/VeltrixCalculator
          cp recovery/core-before.sha256 core-before.sha256
          cp recovery/app-boundaries-before.sha256 app-boundaries-before.sha256

      - name: Apply runtime crash fixes and seal frontend boundaries
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          FILE=app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'window.insetsController?.setSystemBarsAppearance' "$FILE"
          sed -i 's/window\.insetsController?\.setSystemBarsAppearance(/window.decorView.windowInsetsController?.setSystemBarsAppearance(/' "$FILE"
          ! grep -q 'window.insetsController?.setSystemBarsAppearance' "$FILE"
          grep -q 'window.decorView.windowInsetsController?.setSystemBarsAppearance' "$FILE"
          grep -q 'root.setTag(android.R.id.custom, lastUsed)' "$FILE"
          sed -i '/root\.setTag(android\.R\.id\.custom, lastUsed)/d' "$FILE"
          sed -i 's/val list = brainPanel.getTag(android.R.id.custom) as? LinearLayout ?: return/val list = brainPanel.findViewWithTag<View>("brain_last_used_5") as? LinearLayout ?: return/' "$FILE"
          ! grep -q 'android.R.id.custom' "$FILE"
          grep -q 'findViewWithTag<View>("brain_last_used_5")' "$FILE"
          sha256sum -c "$GITHUB_WORKSPACE/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/app-boundaries-before.sha256"
          grep -q 'veltrix_persistent_shell' "$FILE"
          grep -q 'NoImeEditText' "$FILE"
          grep -q 'main_brain' "$FILE"
          grep -q 'converters_screen' "$FILE"
          grep -q 'library_screen' "$FILE"
          grep -q 'graph_screen' "$FILE"
          grep -q 'history_screen' "$FILE"
          grep -q 'settings_screen' "$FILE"
          grep -q 'RuntimeShader' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          grep -q 'uniform shader scene' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          grep -q 'boundsOrigin' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK and emulator image
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Clean build, core regression and registry proof
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stop || true
          gradle clean :core:test :app:assembleDebug :app:assembleDebugAndroidTest | tee "$GITHUB_WORKSPACE/android-build.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/android-build.txt"
          test -s app/build/outputs/apk/debug/app-debug.apk
          find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | grep -q .
          test -s core/build/registry-export.tsv
          TOOLS=$(tail -n +3 core/build/registry-export.tsv | wc -l)
          SUBJECTS=$(tail -n +3 core/build/registry-export.tsv | cut -f3 | sort -u | wc -l)
          printf 'registry_tool_count=%s\nregistry_subject_count=%s\n' "$TOOLS" "$SUBJECTS" | tee "$GITHUB_WORKSPACE/registry-count.txt"
          test "$TOOLS" -eq 104
          test "$SUBJECTS" -eq 9
          sha256sum -c "$GITHUB_WORKSPACE/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/app-boundaries-before.sha256"

      - name: Boot API 35 emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/veltrix-maxpro-final-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_maxpro_final_api35 -k "system-images;android-35;google_apis;x86_64" -f
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_maxpro_final_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > "$GITHUB_WORKSPACE/emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb get-state | tr -d '\r' | grep -Fx device
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1

      - name: Install and MAX PRO runtime contracts
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP_APK" | tee "$GITHUB_WORKSPACE/install-app.txt"
          grep -q Success "$GITHUB_WORKSPACE/install-app.txt"
          adb install -r -t "$TEST_APK" | tee "$GITHUB_WORKSPACE/install-test.txt"
          grep -q Success "$GITHUB_WORKSPACE/install-test.txt"
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$I"
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendMaxProRuntimeTest "$I" | tee "$GITHUB_WORKSPACE/maxpro-runtime.txt"
          grep -q 'OK (2 tests)' "$GITHUB_WORKSPACE/maxpro-runtime.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/maxpro-runtime.txt"

      - name: Full connected regression
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle :app:connectedDebugAndroidTest | tee "$GITHUB_WORKSPACE/connected-tests.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/connected-tests.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/connected-tests.txt"

      - name: Cold launch and visual evidence
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/maxpro-visual-evidence"
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee "$GITHUB_WORKSPACE/cold-launch.txt"
          grep -q 'Status: ok' "$GITHUB_WORKSPACE/cold-launch.txt"
          sleep 2
          test -n "$(adb shell pidof com.veltrix.calculator | tr -d '\r')"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/01-standard.png"
          adb shell uiautomator dump /sdcard/window.xml >/dev/null
          adb pull /sdcard/window.xml "$GITHUB_WORKSPACE/maxpro-visual-evidence/standard-window.xml" >/dev/null
          grep -q 'Main Brain' "$GITHUB_WORKSPACE/maxpro-visual-evidence/standard-window.xml"
          grep -q 'Converters' "$GITHUB_WORKSPACE/maxpro-visual-evidence/standard-window.xml"
          adb shell screenrecord --time-limit 8 /sdcard/maxpro-motion.mp4 >/dev/null 2>&1 & REC=$!
          adb shell input tap 540 1780 || true
          sleep 1
          adb shell input tap 310 1510 || true
          sleep 1
          adb shell input tap 540 1510 || true
          sleep 1
          wait "$REC" || true
          adb pull /sdcard/maxpro-motion.mp4 "$GITHUB_WORKSPACE/maxpro-visual-evidence/maxpro-motion.mp4" >/dev/null
          test -s "$GITHUB_WORKSPACE/maxpro-visual-evidence/maxpro-motion.mp4"

      - name: Performance, memory and offline deterministic smoke
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          test -n "$(adb shell pidof com.veltrix.calculator | tr -d '\r')"
          adb shell dumpsys gfxinfo com.veltrix.calculator reset >/dev/null
          for i in $(seq 1 10); do adb shell input tap 530 1880 || true; adb shell input tap 290 1500 || true; done
          adb shell dumpsys gfxinfo com.veltrix.calculator > "$GITHUB_WORKSPACE/maxpro-gfxinfo.txt"
          adb shell dumpsys gfxinfo com.veltrix.calculator framestats > "$GITHUB_WORKSPACE/maxpro-framestats.txt"
          adb shell dumpsys meminfo com.veltrix.calculator > "$GITHUB_WORKSPACE/maxpro-meminfo.txt"
          grep -q 'TOTAL' "$GITHUB_WORKSPACE/maxpro-meminfo.txt"
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee "$GITHUB_WORKSPACE/offline-launch.txt"
          grep -q 'Status: ok' "$GITHUB_WORKSPACE/offline-launch.txt"
          gradle :core:test | tee "$GITHUB_WORKSPACE/offline-core.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/offline-core.txt"
          sha256sum -c "$GITHUB_WORKSPACE/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/app-boundaries-before.sha256"

      - name: Package tested MAX PRO source, APK and evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p final-package
          if [ -d ci-project/VeltrixCalculator ]; then
            (cd ci-project && zip -qr "$GITHUB_WORKSPACE/final-package/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip" VeltrixCalculator)
          fi
          APK=ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
          if [ -s "$APK" ]; then cp "$APK" final-package/VeltrixCalculator-Frontend-MAX-PRO.apk; fi
          cp -f android-build.txt registry-count.txt install-app.txt install-test.txt maxpro-runtime.txt connected-tests.txt cold-launch.txt maxpro-gfxinfo.txt maxpro-framestats.txt maxpro-meminfo.txt offline-launch.txt offline-core.txt core-before.sha256 app-boundaries-before.sha256 final-package/ 2>/dev/null || true
          cp -rf maxpro-visual-evidence final-package/ 2>/dev/null || true
          if [ -f final-package/VeltrixCalculator-Frontend-MAX-PRO.apk ]; then sha256sum final-package/VeltrixCalculator-Frontend-MAX-PRO.apk | tee final-package/apk.sha256; fi
          if [ -f final-package/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip ]; then sha256sum final-package/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip | tee final-package/tested-source.sha256; fi
          printf 'branch=%s\ncommit=%s\nci_run_id=%s\nrecovery_artifact=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" 9112173359 | tee final-package/provenance.txt

      - name: Upload final MAX PRO evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixCalculator-Frontend-MAX-PRO-FINAL
          path: final-package/
          if-no-files-found: error
