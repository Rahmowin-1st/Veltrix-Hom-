name: Veltrix V4 Wire Specialized Expansion

on:
  push:
    branches:
      - veltrix-calculator-backend-v4-reset
    paths:
      - '.github/workflows/veltrix-v4-wire-subject-expansion.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Wire specialized catalog and executor
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          registry = Path('calculator-v4/core/src/main/kotlin/com/veltrix/calculator/core/ToolRegistry.kt')
          text = registry.read_text(encoding='utf-8')
          old_count = 'const val EXPECTED_V4_TOOLS = VERIFIED_BACKEND_1_1_TOOLS + V4Catalog.EXPECTED_ADDITIONS + Grade8PhysicsCatalog.EXPECTED_ADDITIONS + V4ExpansionCatalog.EXPECTED_ADDITIONS'
          new_count = old_count + ' + V4SpecialCatalog.EXPECTED_ADDITIONS'
          old_list = 'val tools = (baseline + V4Catalog.tools() + Grade8PhysicsCatalog.tools() + V4ExpansionCatalog.tools()).map(::normalizeMetadata)'
          new_list = 'val tools = (baseline + V4Catalog.tools() + Grade8PhysicsCatalog.tools() + V4ExpansionCatalog.tools() + V4SpecialCatalog.tools()).map(::normalizeMetadata)'
          if new_count not in text:
              if old_count not in text: raise SystemExit('registry expected-count anchor missing')
              text = text.replace(old_count, new_count, 1)
          if new_list not in text:
              if old_list not in text: raise SystemExit('registry catalog anchor missing')
              text = text.replace(old_list, new_list, 1)
          registry.write_text(text, encoding='utf-8')

          engine = Path('calculator-v4/core/src/main/kotlin/com/veltrix/calculator/core/PlatformEngine.kt')
          etext = engine.read_text(encoding='utf-8')
          old = '        val tool = registry.get(request.toolId) ?: return fail(request.toolId, "UNKNOWN_TOOL", "Unknown tool id")\n        return try {'
          new = '        val tool = registry.get(request.toolId) ?: return fail(request.toolId, "UNKNOWN_TOOL", "Unknown tool id")\n        V4SpecialPlatform.execute(tool, request)?.let { return it }\n        return try {'
          if new not in etext:
              if old not in etext: raise SystemExit('PlatformEngine execute anchor missing')
              etext = etext.replace(old, new, 1)
          engine.write_text(etext, encoding='utf-8')
          PY
          git diff --check

      - name: Cheap decisive core proof
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          gradle --stacktrace :core:test

      - name: Commit exact tested specialized wiring
        run: |
          set -euxo pipefail
          git config user.name 'veltrix-backend-master'
          git config user.email 'actions@users.noreply.github.com'
          git add calculator-v4/core/src/main/kotlin/com/veltrix/calculator/core/ToolRegistry.kt \
                  calculator-v4/core/src/main/kotlin/com/veltrix/calculator/core/PlatformEngine.kt
          if git diff --cached --quiet; then
            echo 'No specialized wiring change required'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'feat(v4): wire specialized deterministic platform tools'
          git push origin HEAD:veltrix-calculator-backend-v4-reset
