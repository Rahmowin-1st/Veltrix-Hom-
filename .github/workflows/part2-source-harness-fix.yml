name: Part 2 Source Harness Fix

on:
  push:
    branches:
      - veltrix-hom-backend-part2-knowledge-core
    paths:
      - .github/workflows/part2-source-harness-fix.yml

permissions:
  contents: write

jobs:
  fix-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-hom-backend-part2-knowledge-core
      - name: Make regex replacements literal-safe
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/part2-source-implementation.yml')
          s = p.read_text()
          replacements = {
            'detect + "\\n\\nfunction mimeCompatible", s, count=1)': 'lambda _m: detect + "\\n\\nfunction mimeCompatible", s, count=1)',
            'process + "\\n\\n// ---------- Notebooks and grounded retrieval ----------", s, count=1)': 'lambda _m: process + "\\n\\n// ---------- Notebooks and grounded retrieval ----------", s, count=1)',
            'ingest + "\\n\\nrouter.post(\'/notebooks/:notebookId/research/candidates/:candidateId/add\'", s, count=1)': 'lambda _m: ingest + "\\n\\nrouter.post(\'/notebooks/:notebookId/research/candidates/:candidateId/add\'", s, count=1)',
          }
          for old, new in replacements.items():
            if s.count(old) != 1:
              raise SystemExit(f'harness anchor mismatch: {old}')
            s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit harness-only fix and remove this fixer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/part2-source-implementation.yml
          git rm .github/workflows/part2-source-harness-fix.yml
          git commit -m "ci(part2): make source patch replacements literal-safe"
          git push origin HEAD:veltrix-hom-backend-part2-knowledge-core
