name: Veltrix Calculator Frontend Rebuild Gate

on:
  push:
    branches: [ veltrix-calculator-frontend-rebuild ]
  workflow_dispatch:

jobs:
  rebuild-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Configure deterministic Android paths
        run: echo "ANDROID_AVD_HOME=$RUNNER_TEMP/veltrix-avd" >> "$GITHUB_ENV"

      - name: Reconstruct frozen backend and apply rebuilt frontend
        run: |
          set -euo pipefail
          cat veltrix-chunks/chunk_* > source.b64
          base64 -d source.b64 > base-source.zip
          echo "da40c39fd22d19d2686d8702ea36b64ef0f6af87506fd2ea6f51232b1f59e6dd  base-source.zip" | sha256sum -c -
          unzip -q base-source.zip -d ci-project

          cp ci-overrides/RuntimeGateTest.kt ci-project/VeltrixCalculator/app/src/androidTest/kotlin/com/veltrix/calculator/app/RuntimeGateTest.kt
          cp ci-overrides/gradle.properties ci-project/VeltrixCalculator/gradle.properties
          cp ci-overrides/GateSmokeRegressionTest.kt ci-project/VeltrixCalculator/core/src/test/kotlin/com/veltrix/calculator/core/GateSmokeRegressionTest.kt

          cd ci-project/VeltrixCalculator
          find core -type f -print0 | sort -z | xargs -0 sha256sum > ../../core-before.sha256
          cd ../..

          cat frontend-bundle-rebuild/chunk_* > frontend-rebuild.b64
          base64 -d frontend-rebuild.b64 > frontend-rebuild.tar.gz
          echo "25ba8a072e6fa3ef3b671fc3f4243b8f8346f2be453d720b3c6c442916047169  frontend-rebuild.tar.gz" | sha256sum -c -
          echo "3b13d3996174dbc23305e49ba54fb766771b9819adb889e91c3aded1af9828ba  frontend-rebuild-patches/hero-performance.patch" | sha256sum -c -
          echo "51d4cddba6aff0c4bde085dda4dfc7f9b076da3d3f0747ecbfe5e4e9f47e0f72  frontend-rebuild-patches/optics-prewarm.patch" | sha256sum -c -
          tar -xzf frontend-rebuild.tar.gz -C ci-project/VeltrixCalculator
          (cd ci-project/VeltrixCalculator && patch -p1 < ../../frontend-rebuild-patches/hero-performance.patch)
          (cd ci-project/VeltrixCalculator && patch -p1 < ../../frontend-rebuild-patches/optics-prewarm.patch)

          cd ci-project/VeltrixCalculator
          find core -type f -print0 | sort -z | xargs -0 sha256sum > ../../core-after.sha256
          cd ../..
          cmp core-before.sha256 core-after.sha256

          (cd ci-project && zip -qr ../VeltrixCalculator-Frontend-Rebuild-tested-source.zip VeltrixCalculator)
          sha256sum VeltrixCalculator-Frontend-Rebuild-tested-source.zip | tee source.sha256
          sha256sum frontend-rebuild.tar.gz | tee frontend-rebuild.sha256
          sha256sum frontend-rebuild-patches/hero-performance.patch | tee hero-performance-patch.sha256
          sha256sum frontend-rebuild-patches/optics-prewarm.patch | tee optics-prewarm-patch.sha256

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK and emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Frozen core regression
        working-directory: ci-project/VeltrixCalculator
        run: gradle --stacktrace :core:test

      - name: Compile rebuilt frontend and test APKs
        working-directory: ci-project/VeltrixCalculator
        run: gradle --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create deterministic API 35 AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_api35 -k "system-images;android-35;google_apis;x86_64" -f
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx veltrix_api35

      - name: Runtime functional visual and performance gate
        working-directory: ci-project/VeltrixCalculator
        shell: bash
        run: |
          set -euo pipefail
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb get-state | tr -d '\r' | grep -Fx device

          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP_APK" | tee install-app.txt
          grep -q Success install-app.txt
          adb install -r -t "$TEST_APK" | tee install-test.txt
          grep -q Success install-test.txt

          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee runtime-launch.txt
          grep -q 'Status: ok' runtime-launch.txt
          sleep 2
          adb exec-out screencap -p > screenshot-calculator.png

          adb shell cmd connectivity airplane-mode enable || true
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = "1"

          INSTRUMENTATION=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$INSTRUMENTATION"

          adb shell am instrument -w -e class com.veltrix.calculator.app.RuntimeGateTest "$INSTRUMENTATION" | tee instrumentation-backend-contract.txt
          grep -q 'OK (6 tests)' instrumentation-backend-contract.txt
          ! grep -q 'FAILURES!!!' instrumentation-backend-contract.txt

          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendGateTest "$INSTRUMENTATION" | tee instrumentation-frontend.txt
          grep -q 'OK (4 tests)' instrumentation-frontend.txt
          ! grep -q 'FAILURES!!!' instrumentation-frontend.txt

          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee runtime-relaunch.txt
          grep -q 'Status: ok' runtime-relaunch.txt
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.RuntimeGateTest#eHistoryVisibleFromPersistentDatabase' "$INSTRUMENTATION" | tee history-after-process-restart.txt
          grep -q 'OK (1 test)' history-after-process-restart.txt

          mkdir -p visual-evidence
          adb shell rm -rf /sdcard/Android/data/com.veltrix.calculator/files/veltrix-evidence || true
          adb shell rm -f /sdcard/veltrix-motion.mp4 || true
          adb shell 'screenrecord --bit-rate 8000000 --time-limit 30 /sdcard/veltrix-motion.mp4 >/dev/null 2>&1 &' || true
          sleep 1
          adb shell am instrument -w -e class com.veltrix.calculator.app.VisualEvidenceTest "$INSTRUMENTATION" | tee instrumentation-visual-evidence.txt
          grep -q 'OK (1 test)' instrumentation-visual-evidence.txt
          ! grep -q 'FAILURES!!!' instrumentation-visual-evidence.txt
          adb shell pkill -2 screenrecord || true
          sleep 2
          adb pull /sdcard/veltrix-motion.mp4 visual-evidence/veltrix-motion.mp4 || true
          adb pull /sdcard/Android/data/com.veltrix.calculator/files/veltrix-evidence/. visual-evidence/ || true
          test -s visual-evidence/veltrix-motion.mp4
          test "$(find visual-evidence -maxdepth 1 -name '*.png' -type f | wc -l)" -ge 9

          # Instrumentation verifies the interaction path and cached-navigation dispatch bound.
          adb shell am instrument -w -e class com.veltrix.calculator.app.PerformanceExerciseTest "$INSTRUMENTATION" | tee instrumentation-performance.txt
          grep -q 'OK (1 test)' instrumentation-performance.txt
          ! grep -q 'FAILURES!!!' instrumentation-performance.txt

          # Collect gfx frame data while the actual app process stays alive. This avoids the invalid
          # post-instrumentation "No process found" measurement from the previous gate.
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee performance-launch.txt
          grep -q 'Status: ok' performance-launch.txt
          sleep 1
          adb shell dumpsys gfxinfo com.veltrix.calculator reset >/dev/null
          SIZE=$(adb shell wm size | sed -n 's/.*Physical size: \([0-9]*\)x\([0-9]*\).*/\1 \2/p' | tail -1)
          W=$(echo "$SIZE" | awk '{print $1}'); H=$(echo "$SIZE" | awk '{print $2}')
          DPI=$(adb shell wm density | sed -n 's/.*Physical density: \([0-9]*\).*/\1/p' | tail -1)
          test -n "$W"; test -n "$H"; test -n "$DPI"
          NAV_Y=$((H - (42 * DPI / 160)))
          for PCT in 30 50 70 90 10 50 10; do
            X=$((W * PCT / 100))
            adb shell input tap "$X" "$NAV_Y"
            sleep 0.22
          done
          adb shell input swipe $((W * 72 / 100)) $((H * 67 / 100)) $((W * 30 / 100)) $((H * 56 / 100)) 280 || true
          sleep 0.8
          adb shell dumpsys gfxinfo com.veltrix.calculator framestats > performance-framestats.txt
          adb shell dumpsys gfxinfo com.veltrix.calculator > performance-summary.txt
          ! grep -q 'No process found' performance-summary.txt
          grep -E 'Total frames rendered|Janky frames|50th percentile|90th percentile|95th percentile|99th percentile|Number Missed Vsync|Number High input latency|Number Slow UI thread|Number Slow bitmap uploads|Number Slow issue draw commands' performance-summary.txt | tee performance-metrics.txt
          test -s performance-metrics.txt

          gradle --stacktrace :app:connectedDebugAndroidTest | tee connected-tests.txt
          grep -q 'BUILD SUCCESSFUL' connected-tests.txt

          adb install -r -t "$APP_APK" | tee reinstall-after-connected.txt
          grep -q Success reinstall-after-connected.txt
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee final-relaunch.txt
          grep -q 'Status: ok' final-relaunch.txt
          sleep 1
          adb exec-out screencap -p > screenshot-final.png
          adb emu kill || true

      - name: Build provenance chain
        if: always()
        run: |
          SOURCE_SHA=$(sha256sum VeltrixCalculator-Frontend-Rebuild-tested-source.zip 2>/dev/null | awk '{print $1}')
          APK=ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
          APK_SHA=$(test -s "$APK" && sha256sum "$APK" | awk '{print $1}' || echo NOT_GENERATED)
          printf 'base_backend_commit=%s\nfrontend_commit=%s\nci_run_id=%s\ntested_source_sha256=%s\ngenerated_apk_sha256=%s\nsealed_frontend_bundle_sha256=%s\nhero_performance_patch_sha256=%s\noptics_prewarm_patch_sha256=%s\n' \
            280086be767d5c4f6aa334f5fdba8ec9bd054282 "$GITHUB_SHA" "$GITHUB_RUN_ID" "$SOURCE_SHA" "$APK_SHA" 25ba8a072e6fa3ef3b671fc3f4243b8f8346f2be453d720b3c6c442916047169 3b13d3996174dbc23305e49ba54fb766771b9819adb889e91c3aded1af9828ba 51d4cddba6aff0c4bde085dda4dfc7f9b076da3d3f0747ecbfe5e4e9f47e0f72 | tee provenance.txt
          test ! -s "$APK" || sha256sum "$APK" > apk.sha256

      - name: Upload exact tested source APK motion performance and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixCalculator-Frontend-Rebuild-evidence
          path: |
            VeltrixCalculator-Frontend-Rebuild-tested-source.zip
            source.sha256
            frontend-rebuild.sha256
            hero-performance-patch.sha256
            optics-prewarm-patch.sha256
            core-before.sha256
            core-after.sha256
            provenance.txt
            apk.sha256
            ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
            ci-project/VeltrixCalculator/emulator.log
            ci-project/VeltrixCalculator/install-app.txt
            ci-project/VeltrixCalculator/install-test.txt
            ci-project/VeltrixCalculator/runtime-launch.txt
            ci-project/VeltrixCalculator/instrumentation-backend-contract.txt
            ci-project/VeltrixCalculator/instrumentation-frontend.txt
            ci-project/VeltrixCalculator/runtime-relaunch.txt
            ci-project/VeltrixCalculator/history-after-process-restart.txt
            ci-project/VeltrixCalculator/instrumentation-visual-evidence.txt
            ci-project/VeltrixCalculator/instrumentation-performance.txt
            ci-project/VeltrixCalculator/performance-launch.txt
            ci-project/VeltrixCalculator/performance-framestats.txt
            ci-project/VeltrixCalculator/performance-summary.txt
            ci-project/VeltrixCalculator/performance-metrics.txt
            ci-project/VeltrixCalculator/connected-tests.txt
            ci-project/VeltrixCalculator/reinstall-after-connected.txt
            ci-project/VeltrixCalculator/final-relaunch.txt
            ci-project/VeltrixCalculator/screenshot-calculator.png
            ci-project/VeltrixCalculator/screenshot-final.png
            ci-project/VeltrixCalculator/visual-evidence/
            ci-project/VeltrixCalculator/core/build/reports/tests/test/
            ci-project/VeltrixCalculator/app/build/reports/androidTests/
            ci-project/VeltrixCalculator/app/build/outputs/androidTest-results/
