name: Veltrix Hom Backend MAX Hardening

on:
  push:
    branches: [veltrix-hom-backend-max-hardening-canonical-work]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-max-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  max-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veltrix_max
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
        ports: ['5432:5432']
    defaults:
      run:
        working-directory: server
        shell: bash --noprofile --norc -e -o pipefail {0}
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: veltrix_max
      GEMINI_API_KEY: ci-placeholder-not-a-secret
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-not-a-secret
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-not-a-secret
      APP_HMAC_SECRET: ci-only-placeholder-secret-0123456789abcdef0123456789abcdef
      APP_ENV: test
      GOOGLE_CLIENT_ID: ci-client-id.apps.googleusercontent.com

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Exact accepted ancestry and narrow scope
        run: |
          BASE=0458e1b96bdf03b2c607280d392946780fd083af
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$BASE" "$GITHUB_SHA"
          git -C "$GITHUB_WORKSPACE" diff --check "$BASE...$GITHUB_SHA"
          changed=$(git -C "$GITHUB_WORKSPACE" diff --name-only "$BASE...$GITHUB_SHA")
          printf '%s\n' "$changed"
          while IFS= read -r path; do
            case "$path" in
              server/src/v1/jobs.ts|server/src/v1/jobs.lease-heartbeat.test.ts|server/src/v1/part5MaxHardening.test.ts|server/src/v1/part4Notifications.ts|server/src/db/migration-133-vh-part5-max-hardening-durability.sql|server/src/db/migration-134-vh-part5-max-hardening-notification-delivery.sql|.github/workflows/veltrix-hom-backend-max-hardening.yml) ;;
              *) echo "unexpected hardening path: $path"; exit 1 ;;
            esac
          done <<< "$changed"
          echo MAX_SCOPE=PASS

      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund

      - name: Focused canonical lease and notification tests
        run: |
          npx vitest run \
            src/v1/jobs.worker.test.ts \
            src/v1/jobs.lease-heartbeat.test.ts \
            src/v1/part5MaxHardening.test.ts \
            src/v1/part4Notifications.test.ts \
            --reporter=verbose

      - name: Fresh migrations 100 through 134
        run: |
          dropdb --if-exists veltrix_max_fresh
          createdb veltrix_max_fresh
          export PGDATABASE=veltrix_max_fresh
          bash scripts/part5-ci-db-bootstrap.sh
          for n in $(seq 100 134); do
            file=$(find src/db -maxdepth 1 -type f -name "migration-${n}*.sql" | sort -V | head -1)
            test -n "$file"
            psql -X -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
          test "$(psql -X -qAt -c "select to_regprocedure('public.vh_renew_job_lease(uuid,text,integer)') is not null")" = t
          test "$(psql -X -qAt -c "select to_regprocedure('public.vh_claim_notification_delivery(uuid,uuid,uuid,text)') is not null")" = t
          echo MAX_FRESH_MIGRATIONS=PASS

      - name: Upgrade 100 through 132 then 133 through 134 preserves state
        run: |
          dropdb --if-exists veltrix_max_upgrade
          createdb veltrix_max_upgrade
          export PGDATABASE=veltrix_max_upgrade
          bash scripts/part5-ci-db-bootstrap.sh
          for n in $(seq 100 132); do
            file=$(find src/db -maxdepth 1 -type f -name "migration-${n}*.sql" | sort -V | head -1)
            test -n "$file"
            psql -X -v ON_ERROR_STOP=1 -f "$file" >/dev/null
          done
          psql -X -v ON_ERROR_STOP=1 -c "insert into public.vh_accounts(id,email) values('55555555-5555-4555-8555-555555555555','max-upgrade-sentinel@example.invalid')" >/dev/null
          psql -X -v ON_ERROR_STOP=1 -f src/db/migration-133-vh-part5-max-hardening-durability.sql >/dev/null
          psql -X -v ON_ERROR_STOP=1 -f src/db/migration-134-vh-part5-max-hardening-notification-delivery.sql >/dev/null
          test "$(psql -X -qAt -c "select count(*) from public.vh_accounts where id='55555555-5555-4555-8555-555555555555'")" = 1
          echo MAX_UPGRADE_MIGRATION=PASS

      - name: Real PostgreSQL stale-lease adversarial proof
        run: |
          export PGDATABASE=veltrix_max_upgrade
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          insert into public.vh_jobs(account_id,kind,payload,max_attempts)
          values('55555555-5555-4555-8555-555555555555','max.pg.reclaim','{}',3);
          do $$
          declare j1 public.vh_jobs%rowtype; j2 public.vh_jobs%rowtype;
          begin
            select * into j1 from public.vh_claim_job('pg-worker-a',60);
            if j1.id is null or j1.attempts<>1 then raise exception 'first_claim_failed'; end if;
            update public.vh_jobs set lease_expires_at=now()-interval '1 second' where id=j1.id;
            select * into j2 from public.vh_claim_job('pg-worker-b',60);
            if j2.id is distinct from j1.id or j2.attempts<>2 or j2.lease_owner<>'pg-worker-b' then raise exception 'stale_reclaim_failed'; end if;
            if exists(select 1 from public.vh_jobs where id=j1.id and lease_owner='pg-worker-a') then raise exception 'zombie_not_fenced'; end if;
          end $$;
          rollback;
          SQL
          echo MAX_REAL_PG_LEASE=PASS

      - name: Real PostgreSQL notification side-effect fencing
        run: |
          export PGDATABASE=veltrix_max_upgrade
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          insert into public.vh_accounts(id,email) values('66666666-6666-4666-8666-666666666666','max-notify-other@example.invalid');
          insert into public.vh_device_tokens(id,account_id,provider,token_digest,encrypted_token,active)
          values('77777777-7777-4777-8777-777777777777','55555555-5555-4555-8555-555555555555','FCM',repeat('a',64),'fixture-token',true);
          select public.vh_set_notification_preference('55555555-5555-4555-8555-555555555555','max_notify',true,true);
          do $$
          declare n uuid; first_claim boolean; duplicate_claim boolean; foreign_claim boolean; delivery_count integer;
          begin
            n:=public.vh_emit_notification(
              '55555555-5555-4555-8555-555555555555','max.notify','max_notify','info','max.notify.title','{}','{}','NORMAL','{}'
            );
            select public.vh_claim_notification_delivery('55555555-5555-4555-8555-555555555555',n,'77777777-7777-4777-8777-777777777777','FCM') into first_claim;
            select public.vh_claim_notification_delivery('55555555-5555-4555-8555-555555555555',n,'77777777-7777-4777-8777-777777777777','FCM') into duplicate_claim;
            select public.vh_claim_notification_delivery('66666666-6666-4666-8666-666666666666',n,'77777777-7777-4777-8777-777777777777','FCM') into foreign_claim;
            select count(*) into delivery_count from public.vh_notification_deliveries where notification_id=n;
            if first_claim is distinct from true then raise exception 'notification_first_claim_failed'; end if;
            if duplicate_claim is distinct from false then raise exception 'notification_duplicate_claim_allowed'; end if;
            if foreign_claim is distinct from false then raise exception 'notification_cross_owner_claim_allowed'; end if;
            if delivery_count<>1 then raise exception 'notification_claim_row_count %',delivery_count; end if;
          end $$;
          rollback;
          SQL
          echo MAX_NOTIFICATION_SIDE_EFFECT_FENCING=PASS

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Hardening proof summary
        run: |
          echo MAX_HARDENING_HEAD=$GITHUB_SHA
          echo MAX_CANONICAL_JOB_LEASE=PASS
          echo MAX_NOTIFICATION_SIDE_EFFECT_FENCING=PASS
          echo MAX_HARDENING_TARGETED_CI=PASS
