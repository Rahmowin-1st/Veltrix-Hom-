name: Veltrix Calculator Frontend MAX PRO Q2 Final Gate v4

on:
  push:
    branches: [ veltrix-calculator-frontend-max-pro-q2 ]
    paths: [ '.github/workflows/veltrix-calculator-frontend-max-pro-q2-final-v4.yml' ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  APP_PACKAGE: com.veltrix.calculator
  MAIN_COMPONENT: com.veltrix.calculator/com.veltrix.calculator.app.MainActivity

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Compose exact Q2 production source and protect frozen backend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p provenance delivery evidence/{tests,performance,visual,motion,accessibility}
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9129072133/zip > provenance/baseline-artifact.zip
          echo 'f3d612dd35cd58d024128e93d3c8bc04e0be297e85e307b71956aa0e4d5604f0  provenance/baseline-artifact.zip' | sha256sum -c -
          unzip -q provenance/baseline-artifact.zip -d provenance/baseline
          echo 'd7b3a796adf39308a94da4acc58cd0d0ad8ff463372e00cae1714738f5de6029  provenance/baseline/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip' | sha256sum -c -
          mkdir ci-project
          unzip -q provenance/baseline/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip -d ci-project
          cp provenance/baseline/core-before.sha256 provenance/core-before.sha256
          cp provenance/baseline/app-boundaries-before.sha256 provenance/app-boundaries-before.sha256
          cat q2/patch2/part_00 q2/patch2/part_01 q2/patch2/part_02 q2/patch2/part_03 q2/patch2/part_04 q2/patch2/part_05 q2/patch2/part_06 > provenance/q2.patch
          cd ci-project/VeltrixCalculator
          patch -p3 < "$GITHUB_WORKSPACE/provenance/q2.patch"
          patch -p1 < "$GITHUB_WORKSPACE/q2/gesture-arch-fix.patch"
          patch -p1 < "$GITHUB_WORKSPACE/q2/completion-ui.patch"
          patch -p1 < "$GITHUB_WORKSPACE/q2/graph-tags-v2.patch"
          sha256sum -c "$GITHUB_WORKSPACE/provenance/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/provenance/app-boundaries-before.sha256"
          test "$(grep -c 'setContentView(' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt)" -eq 1
          grep -q 'BrainGestureLayout' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'polynomial_degree_lens' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'RuntimeShader' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          grep -q 'Convex-lens center magnification' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          printf '%s\n' \
            'accepted_commit=53e055093b1237da612ef3b0efa60f46bcd9e9aa' \
            'accepted_run=31564469655' \
            'accepted_job=94013370817' \
            'accepted_artifact=9129072133' \
            "q2_gate_commit=${GITHUB_SHA}" > "$GITHUB_WORKSPACE/provenance/identity.txt"

      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }

      - name: SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Clean build, core regression, APKs
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle clean :core:test :app:assembleDebug :app:assembleDebugAndroidTest | tee "$GITHUB_WORKSPACE/evidence/tests/build-core.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/evidence/tests/build-core.txt"
          test -s app/build/outputs/apk/debug/app-debug.apk
          find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | grep -q .
          sha256sum -c "$GITHUB_WORKSPACE/provenance/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/provenance/app-boundaries-before.sha256"

      - name: Boot API 35 1080x2400 emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/q2-avd"; echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"; mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n q2_api35 -k "system-images;android-35;google_apis;x86_64" -f
          printf '\nhw.lcd.width=1080\nhw.lcd.height=2400\nhw.lcd.density=420\nhw.ramSize=3072\n' >> "$ANDROID_AVD_HOME/q2_api35.avd/config.ini"
          nohup "$ANDROID_HOME/emulator/emulator" @q2_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > evidence/tests/emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell wm size | tee evidence/tests/wm-size.txt
          adb shell wm density | tee evidence/tests/wm-density.txt

      - name: Install, cold launch, targeted contracts
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APP=app/build/outputs/apk/debug/app-debug.apk
          TEST=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP" | tee "$GITHUB_WORKSPACE/evidence/tests/install-app.txt"
          adb install -r -t "$TEST" | tee "$GITHUB_WORKSPACE/evidence/tests/install-test.txt"
          grep -q Success "$GITHUB_WORKSPACE/evidence/tests/install-app.txt"; grep -q Success "$GITHUB_WORKSPACE/evidence/tests/install-test.txt"
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r'); test -n "$I"; echo "INSTRUMENTATION=$I" >> "$GITHUB_ENV"
          adb shell am force-stop "$APP_PACKAGE"
          adb shell am start -W -S -n "$MAIN_COMPONENT" | tee "$GITHUB_WORKSPACE/evidence/tests/cold-launch.txt"
          grep -q 'Status: ok' "$GITHUB_WORKSPACE/evidence/tests/cold-launch.txt"
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendQ2QualityRuntimeTest "$I" | tee "$GITHUB_WORKSPACE/evidence/tests/q2-targeted.txt"
          grep -q 'OK (3 tests)' "$GITHUB_WORKSPACE/evidence/tests/q2-targeted.txt"; ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/evidence/tests/q2-targeted.txt"
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendMaxProRuntimeTest "$I" | tee "$GITHUB_WORKSPACE/evidence/tests/maxpro-targeted.txt"
          grep -q 'OK (2 tests)' "$GITHUB_WORKSPACE/evidence/tests/maxpro-targeted.txt"; ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/evidence/tests/maxpro-targeted.txt"

      - name: Full existing connected Android regression
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle :app:connectedDebugAndroidTest | tee "$GITHUB_WORKSPACE/evidence/tests/connected.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/evidence/tests/connected.txt"; ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/evidence/tests/connected.txt"
          sha256sum -c "$GITHUB_WORKSPACE/provenance/core-before.sha256"; sha256sum -c "$GITHUB_WORKSPACE/provenance/app-boundaries-before.sha256"

      - name: Compile final evidence harness
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          cp "$GITHUB_WORKSPACE"/q2/final-tests/*.kt app/src/androidTest/kotlin/com/veltrix/calculator/app/
          patch -p1 < "$GITHUB_WORKSPACE/q2/final-tests-hotfix.patch"
          patch -p1 < "$GITHUB_WORKSPACE/q2/final-tests-graph-hotfix.patch"
          gradle :app:assembleDebugAndroidTest | tee "$GITHUB_WORKSPACE/evidence/tests/evidence-harness-build.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/evidence/tests/evidence-harness-build.txt"
          TEST=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1); adb install -r -t "$TEST" | tee "$GITHUB_WORKSPACE/evidence/tests/evidence-test-install.txt"; grep -q Success "$GITHUB_WORKSPACE/evidence/tests/evidence-test-install.txt"
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r'); test -n "$I"; echo "INSTRUMENTATION=$I" >> "$GITHUB_ENV"
          adb shell cmd appwidget grantbind --package "$APP_PACKAGE" || adb shell appwidget grantbind --package "$APP_PACKAGE" || true

      - name: Non-zero FrameMetrics performance workload
        run: |
          set -euo pipefail
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendQ2PerformanceRuntimeTest "$INSTRUMENTATION" | tee evidence/performance/test.txt
          grep -q 'OK (1 test)' evidence/performance/test.txt; ! grep -q 'FAILURES!!!' evidence/performance/test.txt
          mkdir -p evidence/device
          adb pull /sdcard/Android/data/$APP_PACKAGE/files/q2evidence evidence/device/ >/dev/null
          PERF=$(find evidence/device -name frame_metrics.json -type f | head -1); test -s "$PERF"; cp "$PERF" evidence/performance/frame_metrics.json
          python3 - <<'PY'
          import json
          d=json.load(open('evidence/performance/frame_metrics.json'))
          assert int(d['framesMeasured']) > 20, d
          print(json.dumps(d,indent=2))
          PY
          adb shell dumpsys meminfo "$APP_PACKAGE" > evidence/performance/meminfo.txt || true
          adb shell dumpsys gfxinfo "$APP_PACKAGE" > evidence/performance/gfxinfo-supplemental.txt || true

      - name: Capture 55+ real visual frames and contact sheet
        run: |
          set -euo pipefail
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendQ2FinalEvidenceTest "$INSTRUMENTATION" | tee evidence/visual/test.txt
          grep -q 'OK (4 tests)' evidence/visual/test.txt; ! grep -q 'FAILURES!!!' evidence/visual/test.txt
          rm -rf evidence/device/q2evidence; adb pull /sdcard/Android/data/$APP_PACKAGE/files/q2evidence evidence/device/ >/dev/null
          VIS=$(find evidence/device -type d -path '*/q2evidence/visual' | head -1); test -d "$VIS"; cp -a "$VIS"/. evidence/visual/
          COUNT=$(find evidence/visual -maxdepth 1 -name '*.png' -type f | wc -l | tr -d ' '); echo "$COUNT" > evidence/visual/count.txt; test "$COUNT" -ge 55
          python3 -c 'import PIL' >/dev/null 2>&1 || python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image,ImageDraw
          import os,math
          fs=sorted(f for f in os.listdir('evidence/visual') if f.endswith('.png')); assert len(fs)>=55
          cells=[]
          for f in fs:
            im=Image.open('evidence/visual/'+f).convert('RGB'); im.thumbnail((176,390)); c=Image.new('RGB',(186,420),'white'); c.paste(im,((186-im.width)//2,4)); ImageDraw.Draw(c).text((5,400),f[:26],fill='black'); cells.append(c)
          cols=5; sheet=Image.new('RGB',(cols*186,math.ceil(len(cells)/cols)*420),(235,235,235))
          for i,c in enumerate(cells): sheet.paste(c,((i%cols)*186,(i//cols)*420))
          sheet.save('evidence/visual/Q2_VISUAL_CONTACT_SHEET.jpg',quality=88)
          open('evidence/visual/manifest.txt','w').write('\n'.join(fs)+'\n')
          PY

      - name: Capture 17 real motion clips
        run: |
          set -euo pipefail
          capture(){ m="$1"; n="$2"; r="/sdcard/$n.mp4"; adb shell rm -f "$r" || true; timeout 10 adb shell screenrecord --size 720x1600 --bit-rate 4000000 --time-limit 9 "$r" >/dev/null 2>&1 & p=$!; sleep .55; adb shell am instrument -w -e class "com.veltrix.calculator.app.FrontendQ2MotionEvidenceTest#$m" "$INSTRUMENTATION" | tee "evidence/motion/$n.txt"; grep -q 'OK (1 test)' "evidence/motion/$n.txt"; ! grep -q 'FAILURES!!!' "evidence/motion/$n.txt"; wait $p || true; adb pull "$r" "evidence/motion/$n.mp4" >/dev/null; test "$(stat -c%s "evidence/motion/$n.mp4")" -gt 15000; }
          capture clip01_standard_press_rapid_equals 01_key_press_typing_equals
          capture clip02_standard_scientific_continuity 02_standard_scientific
          capture clip03_main_brain_icon_open_close 03_brain_icon_open_close
          capture clip04_main_brain_direct_drag_cancel_complete 04_brain_direct_drag
          capture clip05_library_subject_moving_lens 05_library_lens
          capture clip06_library_custom_keyboard_biyt_vieta 06_library_biyt
          capture clip07_library_item_to_purpose_tool 07_library_to_tool
          capture clip08_polynomial_degree_morph 08_polynomial_degree
          capture clip09_converter_swap 09_converter_swap
          capture clip10_currency_refresh_state 10_currency_refresh
          capture clip11_segmented_rapid_retarget 11_segmented_retarget
          capture clip12_slider_direct_manipulation 12_slider
          capture clip13_expanded_glass_control_space 13_expanded_glass
          capture clip14_graph_parameter_change 14_graph_parameter
          capture clip15_graph_pan_pinch_crosshair 15_graph_pan_pinch_crosshair
          capture clip16_system_back_behavior 16_system_back
          capture clip17_reduced_motion_comparison 17_reduced_motion
          test "$(find evidence/motion -maxdepth 1 -name '*.mp4' -type f | wc -l | tr -d ' ')" -eq 17

      - name: Offline, relaunch, frozen hash final gate
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          adb shell settings put global airplane_mode_on 1 || true; adb shell svc wifi disable || true; adb shell svc data disable || true
          adb shell am force-stop "$APP_PACKAGE"; adb shell am start -W -S -n "$MAIN_COMPONENT" | tee "$GITHUB_WORKSPACE/evidence/tests/offline-launch.txt"; grep -q 'Status: ok' "$GITHUB_WORKSPACE/evidence/tests/offline-launch.txt"
          gradle :core:test | tee "$GITHUB_WORKSPACE/evidence/tests/offline-core.txt"; grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/evidence/tests/offline-core.txt"
          adb shell settings put global airplane_mode_on 0 || true; adb shell svc wifi enable || true; adb shell svc data enable || true
          adb shell am force-stop "$APP_PACKAGE"; adb shell am start -W -S -n "$MAIN_COMPONENT" | tee "$GITHUB_WORKSPACE/evidence/tests/final-relaunch.txt"; grep -q 'Status: ok' "$GITHUB_WORKSPACE/evidence/tests/final-relaunch.txt"
          sha256sum -c "$GITHUB_WORKSPACE/provenance/core-before.sha256"; sha256sum -c "$GITHUB_WORKSPACE/provenance/app-boundaries-before.sha256"

      - name: Package exact deliverables
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          cp app/build/outputs/apk/debug/app-debug.apk "$ROOT/delivery/VeltrixCalculator-Frontend-MAX-PRO-Q2-FINAL.apk"
          rm -rf app/build core/build .gradle
          cd "$ROOT/ci-project"; zip -qr "$ROOT/delivery/VeltrixCalculator-Frontend-MAX-PRO-Q2-TESTED-SOURCE.zip" VeltrixCalculator -x '*/build/*' 'VeltrixCalculator/.gradle/*'; cd "$ROOT"
          cp -a provenance evidence/provenance
          cat > evidence/accessibility/ACCESSIBILITY.md <<'EOF'
          Reduced Transparency is captured in visual evidence; Reduced Motion is captured in motion clip 17. Physical TalkBack/OEM accessibility remains a real-device gate.
          EOF
          cat > delivery/KNOWN_LIMITATIONS.md <<'EOF'
          # Known Limitations
          Physical Android-device visual/performance perception is NOT VERIFIED by emulator CI. API 35 x86_64 SwiftShader differs from phone GPUs. Full AGSL optical path requires API 33+; older/accessibility modes use fallback. Physical 60/90/120 Hz jank, OEM GPU and TalkBack remain Founder/Check Engine gates.
          EOF
          cat > delivery/VERIFIED_CLAIMED_NOT_VERIFIED.md <<'EOF'
          # VERIFIED / CLAIMED / NOT VERIFIED
          VERIFIED: accepted baseline provenance; frozen backend hashes; clean Android build/core tests; APK install/cold launch; Q2 targeted tests; connected regression; non-zero FrameMetrics workload; 55+ visual captures; 17 motion clips; offline/relaunch.
          CLAIMED: product intent is premium Android-native Veltrix Liquid Glass and motion-centric UX, evaluated against captured emulator evidence.
          NOT VERIFIED: physical-device perceived glass quality, physical-device frame pacing/touch latency, OEM GPU behavior, TalkBack/OEM accessibility, broad 60/90/120 Hz matrix.
          EOF
          cat > delivery/FINAL_REPORT.md <<EOF
          # Veltrix Calculator Frontend MAX PRO Q2 Final
          Gate commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_RUN_ID}
          Accepted baseline: 53e055093b1237da612ef3b0efa60f46bcd9e9aa / run 31564469655 / job 94013370817 / artifact 9129072133
          Frozen backend: byte-hash protected.
          Production architecture: persistent shell, Android AGSL/RuntimeShader optical Liquid Glass, direct Main Brain gesture host, one-object moving lenses, purpose-built tool environments, cached graph rendering.
          Engineering verification: see EVIDENCE, VISUAL, MOTION and PERFORMANCE archives.
          Physical-device perception/performance: NOT VERIFIED by this gate.
          EOF
          cat > delivery/glass_architecture.md <<'EOF'
          # Liquid Glass Architecture
          API33+ RuntimeShader/AGSL samples the captured scene through transmission, convex lensing, edge refraction, chromatic sampling, adaptive tint, edge concentration, apparent thickness/caustic response and touch-origin deformation. GlassSceneHost reuses dirty-driven scene snapshots; dense controls stay lightweight.
          EOF
          cat > delivery/MOTION_SYSTEM.md <<'EOF'
          # Motion System
          Context-specific press compression, moving segmented lens, finger-following slider, direct Main Brain drag with velocity-aware settle, converter swap, graph pan/pinch/crosshair, retargetable motion and reduced-motion fallback. See 17 clips.
          EOF
          zip -qr delivery/VeltrixCalculator-Frontend-MAX-PRO-Q2-VISUAL.zip evidence/visual
          zip -qr delivery/VeltrixCalculator-Frontend-MAX-PRO-Q2-MOTION.zip evidence/motion
          zip -qr delivery/VeltrixCalculator-Frontend-MAX-PRO-Q2-PERFORMANCE.zip evidence/performance
          mkdir -p evidence/docs; cp delivery/*.md evidence/docs/
          zip -qr delivery/VeltrixCalculator-Frontend-MAX-PRO-Q2-EVIDENCE.zip evidence
          cd delivery
          sha256sum VeltrixCalculator-Frontend-MAX-PRO-Q2-FINAL.apk VeltrixCalculator-Frontend-MAX-PRO-Q2-TESTED-SOURCE.zip VeltrixCalculator-Frontend-MAX-PRO-Q2-EVIDENCE.zip VeltrixCalculator-Frontend-MAX-PRO-Q2-VISUAL.zip VeltrixCalculator-Frontend-MAX-PRO-Q2-MOTION.zip VeltrixCalculator-Frontend-MAX-PRO-Q2-PERFORMANCE.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          find . -maxdepth 1 -type f -printf '%f\t%s bytes\n' | sort > FINAL_INVENTORY.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VeltrixCalculator-Frontend-MAX-PRO-Q2-FINAL-DELIVERY-v4
          path: delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: VeltrixCalculator-Q2-v4-DIAGNOSTICS
          path: evidence/
          retention-days: 7
