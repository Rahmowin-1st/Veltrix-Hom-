name: Veltrix V4 Durable Route Persistence Fix

on:
  push:
    branches:
      - veltrix-calculator-backend-v4-reset
    paths:
      - '.github/workflows/v4-fix-final-widget-scroll-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Apply durable navigation state fix
        run: |
          set -euxo pipefail
          SOURCE="$GITHUB_SHA"
          FILE=calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1]); s=p.read_text()
          if 'PERSISTED_ROUTE = "v4.persisted.route"' in s:
              print('durable-navigation-fix already present')
              raise SystemExit(0)
          old='''        restoreUiState(state, prefs.getString("mode", "standard-calculator").orEmpty())
        navigation = AppNavigationState.restore(
            state?.getString(STATE_ROUTE),
            toolExists = { platform.registry.get(it) != null },
            converterExists = { it == CURRENCY_ROUTE || platform.converters.categories().containsKey(it) }
        )
        if (state == null) routeIntent(intent)
'''
          new='''        restoreUiState(state, prefs.getString("mode", "standard-calculator").orEmpty())
        val uiPrefs = getSharedPreferences("ui_state", MODE_PRIVATE)
        val explicitDeepLink = state == null && intent?.action == Intent.ACTION_VIEW && intent?.data?.scheme == "veltrix"
        navigation = AppNavigationState.restore(
            state?.getString(STATE_ROUTE) ?: if (explicitDeepLink) null else uiPrefs.getString(PERSISTED_ROUTE, null),
            toolExists = { platform.registry.get(it) != null },
            converterExists = { it == CURRENCY_ROUTE || platform.converters.categories().containsKey(it) }
        )
        if (explicitDeepLink) routeIntent(intent)
'''
          if old not in s: raise SystemExit('onCreate target not found exactly')
          s=s.replace(old,new,1)
          old='''    override fun onPause() {
        captureCurrentState()
        getSharedPreferences("ui_state", MODE_PRIVATE).edit().putString("draft", standardDraft).apply()
        super.onPause()
    }
'''
          new='''    override fun onPause() {
        captureCurrentState()
        getSharedPreferences("ui_state", MODE_PRIVATE).edit()
            .putString("draft", standardDraft)
            .putString(PERSISTED_ROUTE, navigation.encode())
            .commit()
        super.onPause()
    }
'''
          if old not in s: raise SystemExit('onPause target not found exactly')
          s=s.replace(old,new,1)
          old='''        private const val STATE_ROUTE = "v4.route"
'''
          new='''        private const val STATE_ROUTE = "v4.route"
        private const val PERSISTED_ROUTE = "v4.persisted.route"
'''
          if old not in s: raise SystemExit('constant target not found exactly')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          test -n "$(git diff --name-only)"
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "$FILE"
          grep -q 'PERSISTED_ROUTE = "v4.persisted.route"' "$FILE"
          grep -q 'putString(PERSISTED_ROUTE, navigation.encode())' "$FILE"
          grep -q 'explicitDeepLink' "$FILE"
          git diff --check -- "$FILE"
          git config user.name veltrix-backend-bot
          git config user.email veltrix-backend-bot@users.noreply.github.com
          git add "$FILE"
          git commit -m 'fix(v4): persist semantic route across process death'
          REMOTE="$(git ls-remote origin refs/heads/veltrix-calculator-backend-v4-reset | awk '{print $1}')"
          test "$REMOTE" = "$SOURCE"
          git push origin HEAD:veltrix-calculator-backend-v4-reset
