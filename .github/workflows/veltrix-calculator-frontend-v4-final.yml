name: Veltrix Calculator V4 Frontend Final Proof

on:
  push:
    branches:
      - veltrix-calculator-frontend-v4-final
  workflow_dispatch:

concurrency:
  group: veltrix-calculator-frontend-v4-final
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ github.sha }}
  PRODUCT_FRONTEND_SHA: 553adda367a2d146984deefb64f83df10b37c651
  BASE_SHA: 2de429d93cefb775a71cf3cb96b5513456f25a7d
  BASELINE_SHA: 544d7e8f8afefcd8a0a61724a4f3c525078181ce
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd

jobs:
  frontend-final:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Exact source backend freeze and closure-only delta
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$PRODUCT_FRONTEND_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git merge-base --is-ancestor "$PRODUCT_FRONTEND_SHA" HEAD
          git diff --exit-code "$BASE_SHA"...HEAD -- calculator-v4/core
          git diff --exit-code "$BASE_SHA"...HEAD -- \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/CurrencyRefreshWorker.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/CurrencyRepository.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/HistoryDb.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/OcrService.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/ScannerActivity.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/StateStores.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/V4WidgetProviders.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/WidgetConfigActivity.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/WidgetStateStores.kt
          git diff --exit-code "$PRODUCT_FRONTEND_SHA"...HEAD -- \
            calculator-v4/core \
            calculator-v4/app/src/main/AndroidManifest.xml \
            calculator-v4/app/src/main/kotlin \
            calculator-v4/app/src/main/res
          git diff --name-status "$BASE_SHA"...HEAD | tee "$RUNNER_TEMP/frontend-full-delta.txt"
          git diff --name-status "$PRODUCT_FRONTEND_SHA"...HEAD | tee "$RUNNER_TEMP/frontend-closure-delta.txt"
          python3 - <<'PY'
          import subprocess,sys
          base='553adda367a2d146984deefb64f83df10b37c651'
          allowed={
            '.github/workflows/veltrix-calculator-frontend-v4-final.yml',
            'calculator-v4/app/src/androidTest/kotlin/com/veltrix/calculator/app/FrontendLiquidGlassRuntimeTest.kt',
          }
          out=subprocess.check_output(['git','diff','--name-only',f'{base}...HEAD'],text=True)
          changed={x for x in out.splitlines() if x}
          bad=changed-allowed
          if bad:
              print('Unexpected post-product frontend source mutation:',sorted(bad))
              sys.exit(1)
          print('PRODUCT_FRONTEND_IMPLEMENTATION_FROZEN_AT',base)
          print('CLOSURE_ONLY_PATHS',sorted(changed))
          PY

      - name: Bounded rendering and accessibility source guard
        run: |
          set -euxo pipefail
          APP=calculator-v4/app/src/main
          ! grep -R -n -E 'RenderEffect|BlurMaskFilter|setRenderEffect|Choreographer|INFINITE|repeatCount[[:space:]]*=[[:space:]]*-1' "$APP" || {
            echo 'Unbounded/high-risk rendering primitive found in frontend source'; exit 1;
          }
          test -s "$APP/res/drawable/vlx_glass_button.xml"
          test -s "$APP/res/drawable/vlx_glass_field.xml"
          test -s "$APP/res/animator/vlx_glass_elevation.xml"
          grep -q 'Widget.Veltrix.GlassButton' "$APP/res/values/styles.xml"
          grep -q '48dp' "$APP/res/values/styles.xml"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: true

      - name: Execute Manager accepted V3 proof sequence on exact frontend SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          template = root / '.ci' / 'v4-final-clean-v3-template.yml'
          lines = template.read_text(encoding='utf-8').splitlines()
          env = os.environ.copy()

          def ingest_github_path():
              gp = env.get('GITHUB_PATH')
              if not gp:
                  return
              p = pathlib.Path(gp)
              if not p.exists():
                  return
              added = [x.strip() for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
              if added:
                  current = env.get('PATH', '')
                  env['PATH'] = os.pathsep.join(list(reversed(added)) + [current])

          blocks = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.startswith('      - name: '):
                  name = line.split(': ', 1)[1]
                  workdir = None
                  run_block = None
                  j = i + 1
                  while j < len(lines) and not lines[j].startswith('      - '):
                      stripped = lines[j].strip()
                      if stripped.startswith('working-directory:'):
                          workdir = stripped.split(':', 1)[1].strip()
                      if stripped == 'run: |':
                          k = j + 1
                          buf = []
                          while k < len(lines):
                              raw = lines[k]
                              if raw.startswith('      - '):
                                  break
                              if raw and not raw.startswith('          '):
                                  break
                              buf.append(raw[10:] if raw.startswith('          ') else '')
                              k += 1
                          run_block = '\n'.join(buf) + '\n'
                          j = k - 1
                      j += 1
                  if run_block is not None:
                      blocks.append((name, workdir, run_block))
                  i = j
              else:
                  i += 1

          if len(blocks) < 10:
              raise SystemExit(f'parser found too few canonical run blocks: {len(blocks)}')

          navigation_suite = 'run_class com.veltrix.calculator.app.V4NavigationRuntimeTest navigation-runtime.txt'
          navigation_isolated = r'''NAV_METHODS=(
            nav01To05_homeWorkspacePrimaryTabsAndBack
            nav06Nav07Nav14_settingsRememberTabAndWidgetCenterParentsSettings
            nav08Nav09_systemImeShowsAndFirstBackDismissesWithoutLeavingLibrary
            nav10Nav17Nav19_toolStateRestoresAndBackReturnsSameLibraryState
            nav11Nav12Nav18_converterAndGraphRestoreTheirSemanticParents
            nav13_historyReopenBackReturnsHistory
            nav21Nav22_deepLinksBuildCorrectParentChains
            nav15Nav16Nav20Nav23Nav24Nav25_stressIsBoundedAndRootBackFinishes
          )
          : > "$OUT/navigation-runtime.txt"
          for method in "${NAV_METHODS[@]}"; do
            adb shell am force-stop com.veltrix.calculator || true
            adb shell "run-as com.veltrix.calculator rm -f shared_prefs/ui_state.xml" || true
            CASE_OUT="$OUT/navigation-${method}.txt"
            adb shell am instrument -w -e class "com.veltrix.calculator.app.V4NavigationRuntimeTest#${method}" "$I" | tee "$CASE_OUT"
            grep -q 'OK (1 test)' "$CASE_OUT"
            ! grep -q 'FAILURES!!!' "$CASE_OUT"
            cat "$CASE_OUT" >> "$OUT/navigation-runtime.txt"
          done'''

          backend_suite = 'run_class com.veltrix.calculator.app.BackendMasterRuntimeTest backend-runtime.txt'
          backend_isolated = r'''adb shell am force-stop com.veltrix.calculator || true
          adb shell "run-as com.veltrix.calculator rm -f shared_prefs/ui_state.xml" || true
          run_class com.veltrix.calculator.app.BackendMasterRuntimeTest backend-runtime.txt'''

          casec_currency_suite = 'run_class com.veltrix.calculator.app.Iteration11CurrencyRuntimeTest currency-runtime.txt'
          casec_currency_isolated = r'''adb shell am force-stop com.veltrix.calculator || true
          adb shell "run-as com.veltrix.calculator rm -f shared_prefs/ui_state.xml" || true
          run_class com.veltrix.calculator.app.CaseCAcceptanceRuntimeTest casec-runtime.txt
          adb shell am force-stop com.veltrix.calculator || true
          adb shell "run-as com.veltrix.calculator rm -f shared_prefs/ui_state.xml" || true
          run_class com.veltrix.calculator.app.Iteration11CurrencyRuntimeTest currency-runtime.txt'''

          plain_start = 'adb shell am force-stop com.veltrix.calculator; adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity'
          plain_start_isolated = 'adb shell am force-stop com.veltrix.calculator; adb shell "run-as com.veltrix.calculator rm -f shared_prefs/ui_state.xml" || true; adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity'
          timed_plain_start = 'adb shell am force-stop com.veltrix.calculator; R=$(adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity)'
          timed_plain_start_isolated = 'adb shell am force-stop com.veltrix.calculator; adb shell "run-as com.veltrix.calculator rm -f shared_prefs/ui_state.xml" || true; R=$(adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity)'

          old_visual_guard = "! grep -R -n -E 'class[[:space:]]+(LiquidGlass|MainBrain|ControlSpace)|object[[:space:]]+(LiquidGlass|MainBrain|ControlSpace)' calculator-v4/app/src/main calculator-v4/core/src/main"
          frontend_visual_guard = "! grep -R -n -E 'class[[:space:]]+(MainBrain|ControlSpace)|object[[:space:]]+(MainBrain|ControlSpace)' calculator-v4/app/src/main calculator-v4/core/src/main"

          for name, workdir, command in blocks:
              command = command.replace(old_visual_guard, frontend_visual_guard)
              command = command.replace(
                  'branch=veltrix-calculator-backend-v4-reset',
                  'branch=veltrix-calculator-frontend-v4-final'
              )
              command = command.replace(
                  'adb shell am start -W -a android.intent.action.VIEW -d "$uri" com.veltrix.calculator',
                  'adb shell "am start -W -a android.intent.action.VIEW -d \'$uri\' com.veltrix.calculator"'
              )
              command = command.replace(
                  "adb shell am start -W -a android.intent.action.VIEW -d 'veltrix://home/standard-calculator?expression=6*7' com.veltrix.calculator",
                  "adb shell \"am start -W -a android.intent.action.VIEW -d 'veltrix://home/standard-calculator?expression=6*7' com.veltrix.calculator\""
              )
              command = command.replace(
                  "adb shell am start -W -a android.intent.action.VIEW -d 'veltrix://converter/Length?from=km&to=mi&amount=100' com.veltrix.calculator",
                  "adb shell \"am start -W -a android.intent.action.VIEW -d 'veltrix://converter/Length?from=km&to=mi&amount=100' com.veltrix.calculator\""
              )
              command = command.replace(
                  '''grep -q 'content-desc="converter-amount"' "$OUT/converter-after-calculator.xml"''',
                  '''grep -q 'text="100.0"' "$OUT/converter-after-calculator.xml"'''
              )
              command = command.replace(navigation_suite, navigation_isolated)
              command = command.replace(backend_suite, backend_isolated)
              command = command.replace(casec_currency_suite, casec_currency_isolated)
              command = command.replace(plain_start, plain_start_isolated)
              command = command.replace(timed_plain_start, timed_plain_start_isolated)
              command = command.replace(
                  'ac_nav_ledger_note=Exact original AC/NAV wording unavailable in indexed continuation source; ledger IDs remain fail-closed NOT VERIFIED until original mission is supplied.',
                  'ac_nav_ledger_note=Canonical authority recovered; packaged AC_NAV_FINAL_LEDGER.tsv is historical pre-closure evidence. Final verbatim AC/NAV closure belongs on isolated post-run acceptance evidence.'
              )
              command = command.replace(
                  'git archive --format=zip --output="$H/VeltrixCalculator-V4-FINAL-TESTED-SOURCE.zip" "$SOURCE_SHA" calculator-v4 .github/workflows/veltrix-v4-final-clean-v3.yml',
                  'git archive --format=zip --output="$H/VeltrixCalculator-V4-FINAL-TESTED-SOURCE.zip" "$SOURCE_SHA" calculator-v4 .github/workflows/veltrix-v4-final-clean-v3.yml .github/workflows/veltrix-calculator-frontend-v4-final.yml .ci/v4-final-clean-v3-template.yml'
              )
              cwd = root / workdir if workdir else root
              print(f'=== FRONTEND CANONICAL BLOCK: {name} ===', flush=True)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', command], cwd=cwd, env=env, check=True)
              ingest_github_path()
          PY

      - name: Frontend Liquid Glass isolated runtime acceptance
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          H="$RUNNER_TEMP/veltrix-v4-final/handoff"
          F="$H/frontend-final"
          mkdir -p "$F/runtime" "$F/screenshots"
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          test -s "$APP_APK"; test -s "$TEST_APK"
          adb install -r -t "$APP_APK" >/dev/null
          adb install -r -t "$TEST_APK" >/dev/null
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$I"
          adb shell am force-stop com.veltrix.calculator || true
          adb shell "run-as com.veltrix.calculator rm -f shared_prefs/ui_state.xml" || true
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendLiquidGlassRuntimeTest "$I" | tee "$F/runtime/frontend-liquid-glass.txt"
          grep -q 'OK (2 tests)' "$F/runtime/frontend-liquid-glass.txt"
          ! grep -q 'FAILURES!!!' "$F/runtime/frontend-liquid-glass.txt"
          sha256sum "$APP_APK" "$TEST_APK" | tee "$F/frontend-apk-sha256.txt"

      - name: Exact SHA frontend visual evidence
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          H="$RUNNER_TEMP/veltrix-v4-final/handoff"
          F="$H/frontend-final"
          S="$F/screenshots"
          mkdir -p "$S"
          clear_ui(){ adb shell am force-stop com.veltrix.calculator || true; adb shell "run-as com.veltrix.calculator rm -f shared_prefs/ui_state.xml" || true; }
          dump(){ adb shell uiautomator dump /sdcard/vlx.xml >/dev/null; adb pull /sdcard/vlx.xml "$RUNNER_TEMP/vlx.xml" >/dev/null; }
          tap_desc(){ local D="$1"; dump; read X Y < <(python3 - "$D" "$RUNNER_TEMP/vlx.xml" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          target,path=sys.argv[1],sys.argv[2]
          root=ET.parse(path).getroot()
          for n in root.iter('node'):
              if n.attrib.get('content-desc') == target:
                  m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      a,b,c,d=map(int,m.groups()); print((a+c)//2,(b+d)//2); raise SystemExit(0)
          raise SystemExit(f'content-desc not found: {target}')
          PY
          ); adb shell input tap "$X" "$Y"; sleep 1; }

          clear_ui
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity >/dev/null; sleep 1
          dump; grep -q 'content-desc="route-home"' "$RUNNER_TEMP/vlx.xml"
          adb exec-out screencap -p > "$S/01-home-standard.png"

          tap_desc home-menu
          adb exec-out screencap -p > "$S/02-library.png"
          tap_desc nav-converters
          adb exec-out screencap -p > "$S/03-converter-grid.png"

          adb shell "am start -W -a android.intent.action.VIEW -d 'veltrix://converter/Length' com.veltrix.calculator" >/dev/null; sleep 1
          adb exec-out screencap -p > "$S/04-converter-detail.png"
          adb shell "am start -W -a android.intent.action.VIEW -d 'veltrix://tool/physics-ohms-law' com.veltrix.calculator" >/dev/null; sleep 1
          adb exec-out screencap -p > "$S/05-complex-tool.png"

          clear_ui
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity >/dev/null; sleep 1
          tap_desc home-menu
          tap_desc nav-settings
          adb exec-out screencap -p > "$S/06-settings.png"
          tap_desc settings-widgets
          adb exec-out screencap -p > "$S/07-widget-center.png"

          adb shell "am start -W -a android.intent.action.VIEW -d 'veltrix://home/scientific-calculator' com.veltrix.calculator" >/dev/null; sleep 1
          adb exec-out screencap -p > "$S/08-home-advanced.png"
          for f in "$S"/*.png; do test -s "$f"; done

      - name: Frontend closure manifest
        if: always()
        run: |
          H="$RUNNER_TEMP/veltrix-v4-final/handoff"
          F="$H/frontend-final"
          mkdir -p "$F"
          cp "$RUNNER_TEMP/frontend-full-delta.txt" "$F/frontend-full-delta.txt" 2>/dev/null || true
          cp "$RUNNER_TEMP/frontend-closure-delta.txt" "$F/frontend-closure-delta.txt" 2>/dev/null || true
          {
            echo "repo=Rahmowin-1st/Veltrix-Hom-"
            echo "branch=veltrix-calculator-frontend-v4-final"
            echo "source_sha=${SOURCE_SHA}"
            echo "product_frontend_content_sha=${PRODUCT_FRONTEND_SHA}"
            echo "backend_base_sha=${BASE_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "job=frontend-final"
            echo "product_frontend_implementation=FROZEN_AT_553adda_CONTENT"
            echo "post_product_delta=androidTest_and_frontend_CI_evidence_only"
            echo "measured=canonical V3 runtime/regression/performance proof plus frontend isolated runtime"
            echo "visually_observed=exact-SHA emulator screenshots; composition only"
            echo "not_verified=physical-device perceived smoothness tactile quality and 90/120Hz hardware behavior"
          } | tee "$F/frontend-evidence-manifest.txt"

      - name: Upload exact SHA final frontend handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-calculator-frontend-v4-final-${{ env.SOURCE_SHA }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/veltrix-v4-final/handoff/
