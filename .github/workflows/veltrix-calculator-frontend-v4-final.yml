name: Veltrix Calculator V4 Frontend Final Proof

on:
  push:
    branches:
      - veltrix-calculator-frontend-v4-final
  workflow_dispatch:

permissions:
  contents: read

env:
  BASE_SHA: 2de429d93cefb775a71cf3cb96b5513456f25a7d
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd

jobs:
  frontend-final:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Provenance and backend freeze guard
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git cat-file -e "$BASE_SHA^{commit}"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --exit-code "$BASE_SHA"...HEAD -- calculator-v4/core
          git diff --exit-code "$BASE_SHA"...HEAD -- \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/CurrencyRefreshWorker.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/CurrencyRepository.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/HistoryDb.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/OcrService.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/ScannerActivity.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/StateStores.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/V4WidgetProviders.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/WidgetConfigActivity.kt \
            calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/WidgetStateStores.kt
          git diff --name-status "$BASE_SHA"...HEAD | tee "$RUNNER_TEMP/frontend-delta.txt"

      - name: Bounded-rendering static guard
        run: |
          set -euxo pipefail
          APP=calculator-v4/app/src/main
          ! grep -R -n -E 'RenderEffect|BlurMaskFilter|setRenderEffect|Choreographer|INFINITE|repeatCount[[:space:]]*=[[:space:]]*-1' "$APP" || {
            echo 'Unbounded/high-risk rendering primitive found in frontend source'; exit 1;
          }
          test -s "$APP/res/drawable/vlx_glass_button.xml"
          test -s "$APP/res/drawable/vlx_glass_field.xml"
          test -s "$APP/res/animator/vlx_glass_elevation.xml"
          grep -q 'Widget.Veltrix.GlassButton' "$APP/res/values/styles.xml"
          grep -q '48dp' "$APP/res/values/styles.xml"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: true

      - name: Core regression and Android build
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          gradle --stacktrace :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          test -s app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          test -s "$TEST_APK"
          mkdir -p frontend-evidence
          sha256sum app/build/outputs/apk/debug/app-debug.apk "$TEST_APK" | tee frontend-evidence/apk-sha256.txt
          git rev-parse HEAD | tee frontend-evidence/source-sha.txt

      - name: Install Android runtime
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SM="$(command -v sdkmanager || true)"; [ -n "$SM" ] || SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          "$SM" "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
          for d in "$SDK/platform-tools" "$SDK/emulator" "$(dirname "$SM")" "$SDK/build-tools/35.0.0"; do printf '%s\n' "$d" >> "$GITHUB_PATH"; done

      - name: Boot clean API 35 emulator
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_frontend_api35 -k "system-images;android-35;google_apis;x86_64" -f
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_frontend_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > "$RUNNER_TEMP/frontend-emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 0 || true
          adb shell wm dismiss-keyguard || true

      - name: Install and reinstall proof
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP_APK"
          adb install -r -t "$APP_APK"
          adb install -r -t "$TEST_APK"
          adb shell pm path com.veltrix.calculator | tee frontend-evidence/install-proof.txt

      - name: Frontend accessibility and backend runtime regression
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$I"
          mkdir -p frontend-evidence/runtime
          run_class() {
            CLASS="$1"; NAME="$2"
            adb shell am instrument -w -e class "$CLASS" "$I" | tee "frontend-evidence/runtime/$NAME.txt"
            ! grep -q 'FAILURES!!!' "frontend-evidence/runtime/$NAME.txt"
            grep -q 'OK (' "frontend-evidence/runtime/$NAME.txt"
          }
          run_class com.veltrix.calculator.app.FrontendLiquidGlassRuntimeTest frontend-liquid-glass
          run_class com.veltrix.calculator.app.CaseCAcceptanceRuntimeTest case-c
          run_class com.veltrix.calculator.app.V4NavigationRuntimeTest navigation
          run_class com.veltrix.calculator.app.V4FinalRuntimeAcceptanceTest final-runtime
          run_class com.veltrix.calculator.app.BackendMasterRuntimeTest backend-master-runtime
          run_class com.veltrix.calculator.app.V4WidgetRuntimeTest widgets
          run_class com.veltrix.calculator.app.Iteration11CurrencyRuntimeTest currency

      - name: Measured startup interaction and render evidence
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          mkdir -p frontend-evidence/performance frontend-evidence/screenshots
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -S -W -n com.veltrix.calculator/.MainActivity | tee frontend-evidence/performance/cold-start.txt
          grep -q 'Status: ok' frontend-evidence/performance/cold-start.txt
          adb shell dumpsys gfxinfo com.veltrix.calculator reset || true
          adb exec-out screencap -p > frontend-evidence/screenshots/01-home-standard.png

          tap_desc() {
            DESC="$1"
            adb shell uiautomator dump /sdcard/vlx-window.xml >/dev/null
            adb pull /sdcard/vlx-window.xml "$RUNNER_TEMP/vlx-window.xml" >/dev/null
            python3 - "$DESC" "$RUNNER_TEMP/vlx-window.xml" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          target,path=sys.argv[1],sys.argv[2]
          root=ET.parse(path).getroot()
          for n in root.iter('node'):
              if n.attrib.get('content-desc') == target:
                  m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib.get('bounds',''))
                  if m:
                      x1,y1,x2,y2=map(int,m.groups()); print((x1+x2)//2,(y1+y2)//2); raise SystemExit(0)
          raise SystemExit(f'content-desc not found: {target}')
          PY
          }
          read X Y < <(tap_desc home-menu); adb shell input tap "$X" "$Y"; sleep 1
          adb exec-out screencap -p > frontend-evidence/screenshots/02-library.png
          read X Y < <(tap_desc nav-converters); adb shell input tap "$X" "$Y"; sleep 1
          adb exec-out screencap -p > frontend-evidence/screenshots/03-converter-grid.png

          adb shell am start -W -a android.intent.action.VIEW -d 'veltrix://converter/Length' com.veltrix.calculator >/dev/null; sleep 1
          adb exec-out screencap -p > frontend-evidence/screenshots/04-converter-detail.png
          adb shell am start -W -a android.intent.action.VIEW -d 'veltrix://tool/physics-ohms-law' com.veltrix.calculator >/dev/null; sleep 1
          adb exec-out screencap -p > frontend-evidence/screenshots/05-complex-tool.png
          read X Y < <(tap_desc nav-settings); adb shell input tap "$X" "$Y"; sleep 1
          adb exec-out screencap -p > frontend-evidence/screenshots/06-settings.png
          read X Y < <(tap_desc settings-widgets); adb shell input tap "$X" "$Y"; sleep 1
          adb exec-out screencap -p > frontend-evidence/screenshots/07-widget-center.png
          adb shell am start -W -a android.intent.action.VIEW -d 'veltrix://home/scientific-calculator' com.veltrix.calculator >/dev/null; sleep 1
          adb exec-out screencap -p > frontend-evidence/screenshots/08-home-scientific.png

          adb shell am start -W -n com.veltrix.calculator/.MainActivity >/dev/null
          adb shell uiautomator dump /sdcard/vlx-home.xml >/dev/null
          adb pull /sdcard/vlx-home.xml "$RUNNER_TEMP/vlx-home.xml" >/dev/null
          read X Y < <(python3 - "$RUNNER_TEMP/vlx-home.xml" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          for n in root.iter('node'):
              if n.attrib.get('text') == '7':
                  m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]', n.attrib.get('bounds',''))
                  if m:
                      x1,y1,x2,y2=map(int,m.groups()); print((x1+x2)//2,(y1+y2)//2); raise SystemExit(0)
          raise SystemExit('key 7 not found')
          PY
          )
          for i in $(seq 1 35); do adb shell input tap "$X" "$Y" >/dev/null; done
          sleep 1
          adb shell dumpsys gfxinfo com.veltrix.calculator > frontend-evidence/performance/gfxinfo-after-rapid-taps.txt || true
          adb shell dumpsys meminfo com.veltrix.calculator > frontend-evidence/performance/meminfo-after-rapid-taps.txt || true
          adb shell dumpsys activity activities | grep -A8 'com.veltrix.calculator' > frontend-evidence/performance/activity-state.txt || true

      - name: Evidence manifest
        if: always()
        working-directory: calculator-v4
        run: |
          mkdir -p frontend-evidence
          {
            echo "source_sha=${GITHUB_SHA}"
            echo "base_sha=${BASE_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "job=frontend-final"
            echo "measured=CI build, unit tests, API35 runtime tests, cold-start timing, gfxinfo, meminfo"
            echo "visually_observed=CI screenshots only; composition evidence, not physical-device smoothness"
            echo "not_verified=physical-device perceived smoothness, tactile feel, 90/120Hz device behavior"
          } | tee frontend-evidence/evidence-manifest.txt
          cp "$RUNNER_TEMP/frontend-delta.txt" frontend-evidence/frontend-delta.txt 2>/dev/null || true
          cp "$RUNNER_TEMP/frontend-emulator.log" frontend-evidence/emulator.log 2>/dev/null || true

      - name: Upload exact-SHA frontend handoff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-calculator-frontend-v4-${{ github.sha }}
          path: |
            calculator-v4/app/build/outputs/apk/debug/app-debug.apk
            calculator-v4/app/build/outputs/apk/androidTest/**/*.apk
            calculator-v4/frontend-evidence/**
          if-no-files-found: warn
          retention-days: 14
