name: Veltrix V4 Route Fix Push Executor

on:
  push:
    branches:
      - veltrix-calculator-backend-v4-reset
    paths:
      - '.github/workflows/v4-route-fix-push.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply durable semantic route persistence
        env:
          BRANCH: veltrix-calculator-backend-v4-reset
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          FILE=calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          python3 - "$FILE" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          s=p.read_text()
          if 'PERSISTED_ROUTE = "v4.persisted.route"' in s:
              print('already patched')
              raise SystemExit(0)
          old='''        restoreUiState(state, prefs.getString("mode", "standard-calculator").orEmpty())
        navigation = AppNavigationState.restore(
            state?.getString(STATE_ROUTE),
            toolExists = { platform.registry.get(it) != null },
            converterExists = { it == CURRENCY_ROUTE || platform.converters.categories().containsKey(it) }
        )
        if (state == null) routeIntent(intent)
'''
          new='''        restoreUiState(state, prefs.getString("mode", "standard-calculator").orEmpty())
        val uiPrefs = getSharedPreferences("ui_state", MODE_PRIVATE)
        val explicitDeepLink = state == null && intent?.action == Intent.ACTION_VIEW && intent?.data?.scheme == "veltrix"
        navigation = AppNavigationState.restore(
            state?.getString(STATE_ROUTE) ?: if (explicitDeepLink) null else uiPrefs.getString(PERSISTED_ROUTE, null),
            toolExists = { platform.registry.get(it) != null },
            converterExists = { it == CURRENCY_ROUTE || platform.converters.categories().containsKey(it) }
        )
        if (explicitDeepLink) routeIntent(intent)
'''
          if old not in s: raise SystemExit('onCreate target not found')
          s=s.replace(old,new,1)
          old2='''    override fun onPause() {
        captureCurrentState()
        getSharedPreferences("ui_state", MODE_PRIVATE).edit().putString("draft", standardDraft).apply()
        super.onPause()
    }
'''
          new2='''    override fun onPause() {
        captureCurrentState()
        getSharedPreferences("ui_state", MODE_PRIVATE).edit()
            .putString("draft", standardDraft)
            .putString(PERSISTED_ROUTE, navigation.encode())
            .commit()
        super.onPause()
    }
'''
          if old2 not in s: raise SystemExit('onPause target not found')
          s=s.replace(old2,new2,1)
          old3='''        private const val STATE_ROUTE = "v4.route"
'''
          new3='''        private const val STATE_ROUTE = "v4.route"
        private const val PERSISTED_ROUTE = "v4.persisted.route"
'''
          if old3 not in s: raise SystemExit('constant target not found')
          s=s.replace(old3,new3,1)
          p.write_text(s)
          PY
          if git diff --quiet; then exit 0; fi
          test "$(git diff --name-only)" = "$FILE"
          git diff --check
          git config user.name veltrix-backend-bot
          git config user.email veltrix-backend-bot@users.noreply.github.com
          git add "$FILE"
          git commit -m 'fix(v4): persist semantic route across process death'
          REMOTE="$(git ls-remote origin "refs/heads/$BRANCH" | awk '{print $1}')"
          test "$REMOTE" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$BRANCH"
