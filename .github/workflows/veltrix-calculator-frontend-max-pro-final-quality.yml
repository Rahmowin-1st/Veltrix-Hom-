name: Veltrix Calculator Frontend MAX PRO Final Quality Gate

on:
  push:
    branches: [ veltrix-calculator-frontend-max-pro ]
    paths:
      - '.github/workflows/veltrix-calculator-frontend-max-pro-final-quality.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  final-quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Restore latest fully-regressed MAX PRO source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9113549184/zip > recovery.zip
          unzip -q recovery.zip -d recovery
          test -s recovery/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip
          echo "ff88ee246fcead6eca0a8831560d7629cac163cfc80051eaca164b0dd9a4019e  recovery/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip" | sha256sum -c -
          mkdir ci-project
          unzip -q recovery/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip -d ci-project
          test -d ci-project/VeltrixCalculator
          cp recovery/core-before.sha256 "$GITHUB_WORKSPACE/core-before.sha256"
          cp recovery/app-boundaries-before.sha256 "$GITHUB_WORKSPACE/app-boundaries-before.sha256"

      - name: Fix root Liquid Glass wrap-content measurement and narrow top actions
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          button = Path('app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/LiquidGlassButton.kt')
          s = button.read_text()
          marker = '    override fun onDraw(canvas: Canvas) {'
          idx = s.index(marker)
          measure = '''    override fun onMeasure(widthMeasureSpec: Int, heightMeasureSpec: Int) {
              val density = resources.displayMetrics.density
              val defaultTouchTarget = (48f * density).toInt()
              val desiredWidth = suggestedMinimumWidth.coerceAtLeast(defaultTouchTarget)
              val desiredHeight = suggestedMinimumHeight.coerceAtLeast(defaultTouchTarget)
              setMeasuredDimension(
                  resolveSize(desiredWidth, widthMeasureSpec),
                  resolveSize(desiredHeight, heightMeasureSpec),
              )
          }

          '''
          s = s[:idx] + measure + s[idx:]
          button.write_text(s)

          main = Path('app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt')
          s = main.read_text()
          start = s.index('    private fun buildTopActions(): View = LinearLayout(this).apply {')
          end = s.index('    private fun rebuildCalculatorKeypad', start)
          top = '''    private fun buildTopActions(): View = LinearLayout(this).apply {
              orientation = LinearLayout.HORIZONTAL
              gravity = Gravity.CENTER_VERTICAL
              val compact = resources.configuration.screenWidthDp < 360
              val actionSize = dp(48f)
              val gap = dp(4f)
              addView(TextView(this@MainActivity).apply {
                  text = if (compact) "V" else "Veltrix"
                  textSize = if (compact) 17f else 18f
                  typeface = Typeface.create("sans", Typeface.BOLD)
                  setTextColor(VeltrixTokens.Ink)
                  gravity = Gravity.CENTER_VERTICAL
                  letterSpacing = 0.02f
                  maxLines = 1
                  contentDescription = "Veltrix"
              }, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.MATCH_PARENT, 1f))
              addView(glassIcon(LiquidGlassButton.Glyph.GRID, "Converters", { showScreen("converters") }, actionSize), LinearLayout.LayoutParams(actionSize, actionSize))
              addView(space(gap), LinearLayout.LayoutParams(gap, 1))
              addView(glassIcon(LiquidGlassButton.Glyph.LIBRARY, "Library", { showScreen("library") }, actionSize), LinearLayout.LayoutParams(actionSize, actionSize))
              addView(space(gap), LinearLayout.LayoutParams(gap, 1))
              addView(glassIcon(LiquidGlassButton.Glyph.BRAIN, "Main Brain", { openBrain() }, actionSize), LinearLayout.LayoutParams(actionSize, actionSize))
          }

          '''
          s = s[:start] + top + s[end:]
          main.write_text(s)
          PY

          grep -q 'override fun onMeasure' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/LiquidGlassButton.kt
          grep -q 'defaultTouchTarget' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/LiquidGlassButton.kt
          grep -q 'screenWidthDp < 360' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'contentDescription = "Veltrix"' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'LinearLayout.LayoutParams(actionSize, actionSize)' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          sha256sum -c "$GITHUB_WORKSPACE/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/app-boundaries-before.sha256"
          grep -q 'RuntimeShader' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          grep -q 'uniform shader scene' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          grep -q 'boundsOrigin' app/src/main/kotlin/com/veltrix/calculator/app/frontend/glass/GlassMaterialRenderer.kt
          grep -q 'tag = "standard-input"' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'tag = "calculate"' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          ! grep -q 'android.R.id.custom' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          grep -q 'window.decorView.windowInsetsController' app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK and API 35 image
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Clean compile, frozen core regression and registry proof
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stop || true
          gradle clean :core:test :app:assembleDebug :app:assembleDebugAndroidTest | tee "$GITHUB_WORKSPACE/android-build.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/android-build.txt"
          test -s app/build/outputs/apk/debug/app-debug.apk
          find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | grep -q .
          test -s core/build/registry-export.tsv
          TOOLS=$(tail -n +3 core/build/registry-export.tsv | wc -l)
          SUBJECTS=$(tail -n +3 core/build/registry-export.tsv | cut -f3 | sort -u | wc -l)
          printf 'registry_tool_count=%s\nregistry_subject_count=%s\n' "$TOOLS" "$SUBJECTS" | tee "$GITHUB_WORKSPACE/registry-count.txt"
          test "$TOOLS" -eq 104
          test "$SUBJECTS" -eq 9
          sha256sum -c "$GITHUB_WORKSPACE/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/app-boundaries-before.sha256"

      - name: Boot API 35 emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/veltrix-maxpro-quality-avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_maxpro_quality_api35 -k "system-images;android-35;google_apis;x86_64" -f
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_maxpro_quality_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > "$GITHUB_WORKSPACE/emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb get-state | tr -d '\r' | grep -Fx device
          adb shell settings put global window_animation_scale 1
          adb shell settings put global transition_animation_scale 1
          adb shell settings put global animator_duration_scale 1

      - name: Install and targeted runtime contracts
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP_APK" | tee "$GITHUB_WORKSPACE/install-app.txt"
          grep -q Success "$GITHUB_WORKSPACE/install-app.txt"
          adb install -r -t "$TEST_APK" | tee "$GITHUB_WORKSPACE/install-test.txt"
          grep -q Success "$GITHUB_WORKSPACE/install-test.txt"
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$I"
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendMaxProRuntimeTest "$I" | tee "$GITHUB_WORKSPACE/maxpro-runtime.txt"
          grep -q 'OK (2 tests)' "$GITHUB_WORKSPACE/maxpro-runtime.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/maxpro-runtime.txt"
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.BackendMasterRuntimeTest#aColdLaunchStandardAndScientificProgrammer,com.veltrix.calculator.app.BackendMasterRuntimeTest#fActivityRecreationPreservesDraft' "$I" | tee "$GITHUB_WORKSPACE/compat-runtime.txt"
          grep -q 'OK (2 tests)' "$GITHUB_WORKSPACE/compat-runtime.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/compat-runtime.txt"

      - name: Full connected Android regression
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle :app:connectedDebugAndroidTest | tee "$GITHUB_WORKSPACE/connected-tests.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/connected-tests.txt"
          ! grep -q 'FAILURES!!!' "$GITHUB_WORKSPACE/connected-tests.txt"

      - name: Reinstall and verify narrow portrait hierarchy, navigation and motion
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t "$APP_APK" | tee "$GITHUB_WORKSPACE/reinstall-after-connected.txt"
          grep -q Success "$GITHUB_WORKSPACE/reinstall-after-connected.txt"
          COMP=$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.veltrix.calculator | tail -1 | tr -d '\r')
          test -n "$COMP"
          echo "$COMP" | tee "$GITHUB_WORKSPACE/launcher-component.txt"
          mkdir -p "$GITHUB_WORKSPACE/maxpro-visual-evidence"
          adb shell wm size 320x640
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n "$COMP" | tee "$GITHUB_WORKSPACE/cold-launch.txt"
          grep -q 'Status: ok' "$GITHUB_WORKSPACE/cold-launch.txt"
          sleep 2
          test -n "$(adb shell pidof com.veltrix.calculator | tr -d '\r')"

          dump_ui() {
            adb shell uiautomator dump /sdcard/window.xml >/dev/null
            adb pull /sdcard/window.xml "$1" >/dev/null
          }
          tap_desc() {
            local q="$1"
            dump_ui "$RUNNER_TEMP/window.xml"
            local xy
            xy=$(python3 - "$RUNNER_TEMP/window.xml" "$q" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot(); q=sys.argv[2]
          nodes=list(root.iter('node'))
          n=next((x for x in nodes if x.attrib.get('content-desc')==q),None)
          if n is None: n=next((x for x in nodes if x.attrib.get('content-desc','').startswith(q)),None)
          if n is None: n=next((x for x in nodes if x.attrib.get('text')==q),None)
          if n is None: raise SystemExit('not found: '+q)
          a=list(map(int,re.findall(r'\d+',n.attrib['bounds'])))
          print((a[0]+a[2])//2,(a[1]+a[3])//2)
          PY
          )
            adb shell input tap $xy
            sleep 0.8
          }

          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/01-standard-narrow.png"
          dump_ui "$GITHUB_WORKSPACE/maxpro-visual-evidence/01-standard-narrow.xml"
          grep -q 'content-desc="Veltrix"' "$GITHUB_WORKSPACE/maxpro-visual-evidence/01-standard-narrow.xml"
          grep -q 'content-desc="Converters"' "$GITHUB_WORKSPACE/maxpro-visual-evidence/01-standard-narrow.xml"
          grep -q 'content-desc="Library"' "$GITHUB_WORKSPACE/maxpro-visual-evidence/01-standard-narrow.xml"
          grep -q 'content-desc="Main Brain"' "$GITHUB_WORKSPACE/maxpro-visual-evidence/01-standard-narrow.xml"
          grep -q 'content-desc="Expression"' "$GITHUB_WORKSPACE/maxpro-visual-evidence/01-standard-narrow.xml"
          grep -q 'content-desc="Result"' "$GITHUB_WORKSPACE/maxpro-visual-evidence/01-standard-narrow.xml"

          adb shell screenrecord --time-limit 12 /sdcard/maxpro-motion.mp4 >/dev/null 2>&1 & REC=$!
          tap_desc "Main Brain"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/02-main-brain.png"
          dump_ui "$GITHUB_WORKSPACE/maxpro-visual-evidence/02-main-brain.xml"
          grep -q 'Close Main Brain' "$GITHUB_WORKSPACE/maxpro-visual-evidence/02-main-brain.xml"
          tap_desc "Close Main Brain"
          tap_desc "Library"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/03-library.png"
          dump_ui "$GITHUB_WORKSPACE/maxpro-visual-evidence/03-library.xml"
          adb shell input keyevent 4
          sleep 0.8
          tap_desc "Converters"
          adb exec-out screencap -p > "$GITHUB_WORKSPACE/maxpro-visual-evidence/04-converters.png"
          adb shell input keyevent 4
          sleep 0.8
          wait "$REC" || true
          adb pull /sdcard/maxpro-motion.mp4 "$GITHUB_WORKSPACE/maxpro-visual-evidence/maxpro-motion.mp4" >/dev/null
          test -s "$GITHUB_WORKSPACE/maxpro-visual-evidence/maxpro-motion.mp4"
          for f in "$GITHUB_WORKSPACE"/maxpro-visual-evidence/*.png; do test -s "$f"; done
          adb shell wm size reset

      - name: Live-process performance, memory and offline deterministic smoke
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          test -n "$(adb shell pidof com.veltrix.calculator | tr -d '\r')"
          adb shell dumpsys gfxinfo com.veltrix.calculator reset >/dev/null
          for i in $(seq 1 12); do adb shell input tap 530 1880 || true; adb shell input tap 290 1500 || true; done
          adb shell dumpsys gfxinfo com.veltrix.calculator > "$GITHUB_WORKSPACE/maxpro-gfxinfo.txt"
          adb shell dumpsys gfxinfo com.veltrix.calculator framestats > "$GITHUB_WORKSPACE/maxpro-framestats.txt"
          adb shell dumpsys meminfo com.veltrix.calculator > "$GITHUB_WORKSPACE/maxpro-meminfo.txt"
          grep -q 'TOTAL' "$GITHUB_WORKSPACE/maxpro-meminfo.txt"
          grep -E 'Janky frames|Total frames rendered|TOTAL' "$GITHUB_WORKSPACE/maxpro-gfxinfo.txt" "$GITHUB_WORKSPACE/maxpro-meminfo.txt" > "$GITHUB_WORKSPACE/performance-summary.txt" || true
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          adb shell am force-stop com.veltrix.calculator
          COMP=$(adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER com.veltrix.calculator | tail -1 | tr -d '\r')
          test -n "$COMP"
          adb shell am start -W -n "$COMP" | tee "$GITHUB_WORKSPACE/offline-launch.txt"
          grep -q 'Status: ok' "$GITHUB_WORKSPACE/offline-launch.txt"
          test -n "$(adb shell pidof com.veltrix.calculator | tr -d '\r')"
          gradle :core:test | tee "$GITHUB_WORKSPACE/offline-core.txt"
          grep -q 'BUILD SUCCESSFUL' "$GITHUB_WORKSPACE/offline-core.txt"
          sha256sum -c "$GITHUB_WORKSPACE/core-before.sha256"
          sha256sum -c "$GITHUB_WORKSPACE/app-boundaries-before.sha256"
          adb shell svc wifi enable || true
          adb shell svc data enable || true

      - name: Package exact tested MAX PRO source, APK and evidence
        if: always()
        run: |
          set -euo pipefail
          mkdir -p final-package
          if [ -d ci-project/VeltrixCalculator ]; then
            mkdir -p ci-project/VeltrixCalculator/docs/frontend-max-pro
            cat > ci-project/VeltrixCalculator/docs/frontend-max-pro/MAX_PRO_FINAL_QUALITY_HANDOFF.md <<EOF
          # Veltrix Calculator Frontend MAX PRO Final Quality Handoff

          Branch: ${GITHUB_REF_NAME}
          Commit: ${GITHUB_SHA}
          CI run: ${GITHUB_RUN_ID}
          Recovery source artifact: 9113549184

          This package is VERIFIED only if all required gate steps in this run are green. Physical-device/OEM optical perception, exhaustive TalkBack audit, 60/90/120 Hz physical-device jank, and Founder subjective acceptance remain separate final checks.
          EOF
            sed -i 's/^          //' ci-project/VeltrixCalculator/docs/frontend-max-pro/MAX_PRO_FINAL_QUALITY_HANDOFF.md
            (cd ci-project && zip -qr "$GITHUB_WORKSPACE/final-package/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip" VeltrixCalculator)
          fi
          APK=ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
          if [ -s "$APK" ]; then cp "$APK" final-package/VeltrixCalculator-Frontend-MAX-PRO.apk; fi
          cp -f android-build.txt registry-count.txt install-app.txt install-test.txt maxpro-runtime.txt compat-runtime.txt connected-tests.txt reinstall-after-connected.txt launcher-component.txt cold-launch.txt maxpro-gfxinfo.txt maxpro-framestats.txt maxpro-meminfo.txt performance-summary.txt offline-launch.txt offline-core.txt core-before.sha256 app-boundaries-before.sha256 final-package/ 2>/dev/null || true
          cp -rf maxpro-visual-evidence final-package/ 2>/dev/null || true
          if [ -f final-package/VeltrixCalculator-Frontend-MAX-PRO.apk ]; then sha256sum final-package/VeltrixCalculator-Frontend-MAX-PRO.apk | tee final-package/apk.sha256; fi
          if [ -f final-package/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip ]; then sha256sum final-package/VeltrixCalculator-Frontend-MAX-PRO-TESTED-SOURCE.zip | tee final-package/tested-source.sha256; fi
          printf 'branch=%s\ncommit=%s\nci_run_id=%s\nrecovery_source_artifact=%s\n' "$GITHUB_REF_NAME" "$GITHUB_SHA" "$GITHUB_RUN_ID" 9113549184 | tee final-package/provenance.txt

      - name: Upload final MAX PRO quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixCalculator-Frontend-MAX-PRO-FINAL-QUALITY
          path: final-package/
          if-no-files-found: error
