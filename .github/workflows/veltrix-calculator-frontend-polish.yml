name: Veltrix Calculator Frontend Polish Full Gate

on:
  push:
    branches: [ veltrix-calculator-frontend-i1 ]
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Configure deterministic Android paths
        run: echo "ANDROID_AVD_HOME=$RUNNER_TEMP/veltrix-avd" >> "$GITHUB_ENV"

      - name: Reconstruct frozen backend and apply polish frontend
        run: |
          set -euo pipefail
          cat veltrix-chunks/chunk_* > source.b64
          base64 -d source.b64 > base-source.zip
          echo "da40c39fd22d19d2686d8702ea36b64ef0f6af87506fd2ea6f51232b1f59e6dd  base-source.zip" | sha256sum -c -
          unzip -q base-source.zip -d ci-project

          cp ci-overrides/RuntimeGateTest.kt ci-project/VeltrixCalculator/app/src/androidTest/kotlin/com/veltrix/calculator/app/RuntimeGateTest.kt
          cp ci-overrides/gradle.properties ci-project/VeltrixCalculator/gradle.properties
          cp ci-overrides/GateSmokeRegressionTest.kt ci-project/VeltrixCalculator/core/src/test/kotlin/com/veltrix/calculator/core/GateSmokeRegressionTest.kt

          cd ci-project/VeltrixCalculator
          find core -type f -print0 | sort -z | xargs -0 sha256sum > ../../core-before.sha256
          cd ../..

          cat frontend-bundle-polish/chunk_* > frontend-polish.b64
          base64 -d frontend-polish.b64 > frontend-polish.tar.gz
          echo "e19704ed9893fc3aa762ebecb90b0151c01ece878c179d66eb5ce9d339cabff6  frontend-polish.tar.gz" | sha256sum -c -
          mkdir frontend-stage
          tar -xzf frontend-polish.tar.gz -C frontend-stage
          cp -a frontend-stage/. ci-project/VeltrixCalculator/

          # Exact frontend compile fix discovered by Android CI: this view is app-internal
          # and its UiPrefs parameter is intentionally internal as well.
          sed -i 's/^class GraphPlotView(/internal class GraphPlotView(/' ci-project/VeltrixCalculator/app/src/main/kotlin/com/veltrix/calculator/app/GraphPlotView.kt
          grep -q '^internal class GraphPlotView' ci-project/VeltrixCalculator/app/src/main/kotlin/com/veltrix/calculator/app/GraphPlotView.kt

          mkdir -p ci-project/VeltrixCalculator/app/src/androidTest/kotlin/com/veltrix/calculator/app
          cat > ci-project/VeltrixCalculator/app/src/androidTest/kotlin/com/veltrix/calculator/app/FrontendGateTest.kt <<'KOTLIN'
          package com.veltrix.calculator.app
          import android.view.View
          import android.widget.Button
          import android.widget.EditText
          import androidx.test.core.app.ActivityScenario
          import androidx.test.ext.junit.runners.AndroidJUnit4
          import org.junit.Assert.assertTrue
          import org.junit.Test
          import org.junit.runner.RunWith

          @RunWith(AndroidJUnit4::class)
          class FrontendGateTest {
              private fun <T : View> MainActivity.tagged(tag: String): T {
                  @Suppress("UNCHECKED_CAST")
                  return window.decorView.findViewWithTag<View>(tag) as T
              }
              private fun MainActivity.hasText(text: String): Boolean {
                  val found = arrayListOf<View>()
                  window.decorView.findViewsWithText(found, text, View.FIND_VIEWS_WITH_TEXT)
                  return found.isNotEmpty()
              }
              @Test fun heroAndNavigationContractsRemainReachable() {
                  ActivityScenario.launch(MainActivity::class.java).use { scenario -> scenario.onActivity { a ->
                      assertTrue(a.tagged<EditText>("smart-input").isShown)
                      assertTrue(a.tagged<Button>("calculate").isShown)
                      assertTrue(a.tagged<Button>("nav-tools").isShown)
                      assertTrue(a.tagged<Button>("nav-graph").isShown)
                      assertTrue(a.tagged<Button>("nav-history").isShown)
                      assertTrue(a.tagged<Button>("nav-settings").isShown)
                  }}
              }
              @Test fun progressiveDisclosureDestinationsAreReachable() {
                  ActivityScenario.launch(MainActivity::class.java).use { scenario ->
                      scenario.onActivity { it.tagged<Button>("nav-tools").performClick() }
                      scenario.onActivity { a ->
                          assertTrue(a.hasText("Tools & examples")); assertTrue(a.hasText("Complex math"))
                          assertTrue(a.hasText("Matrix operations")); assertTrue(a.hasText("Currency"))
                      }
                      scenario.onActivity { it.tagged<Button>("nav-graph").performClick() }
                      scenario.onActivity { assertTrue(it.hasText("Graph Studio")) }
                      scenario.onActivity { it.tagged<Button>("nav-settings").performClick() }
                      scenario.onActivity { assertTrue(it.hasText("Settings")) }
                  }
              }
          }
          KOTLIN

          cd ci-project/VeltrixCalculator
          find core -type f -print0 | sort -z | xargs -0 sha256sum > ../../core-after.sha256
          cd ../..
          cmp core-before.sha256 core-after.sha256
          (cd ci-project && zip -qr ../VeltrixCalculator-Frontend-Polish-tested-source.zip VeltrixCalculator)
          sha256sum VeltrixCalculator-Frontend-Polish-tested-source.zip | tee source.sha256
          sha256sum frontend-polish.tar.gz | tee frontend-polish.sha256

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK and emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Frozen core regression
        working-directory: ci-project/VeltrixCalculator
        run: gradle --stacktrace :core:test

      - name: Compile frontend and test APKs
        working-directory: ci-project/VeltrixCalculator
        run: gradle --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create deterministic API 35 AVD
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_api35 -k "system-images;android-35;google_apis;x86_64" -f
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx veltrix_api35

      - name: Full Android runtime and frontend gate
        working-directory: ci-project/VeltrixCalculator
        shell: bash
        run: |
          set -euo pipefail
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb get-state | tr -d '\r' | grep -Fx device

          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP_APK" | tee install-app.txt; grep -q Success install-app.txt
          adb install -r -t "$TEST_APK" | tee install-test.txt; grep -q Success install-test.txt

          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee runtime-launch.txt
          grep -q 'Status: ok' runtime-launch.txt
          sleep 2
          adb exec-out screencap -p > screenshot-calculator.png

          adb shell cmd connectivity airplane-mode enable || true
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = "1"
          INSTRUMENTATION=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$INSTRUMENTATION"

          adb shell am instrument -w -e class com.veltrix.calculator.app.RuntimeGateTest "$INSTRUMENTATION" | tee instrumentation-backend-contract.txt
          grep -q 'OK (6 tests)' instrumentation-backend-contract.txt
          ! grep -q 'FAILURES!!!' instrumentation-backend-contract.txt
          adb shell am instrument -w -e class com.veltrix.calculator.app.FrontendGateTest "$INSTRUMENTATION" | tee instrumentation-frontend.txt
          grep -q 'OK (2 tests)' instrumentation-frontend.txt
          ! grep -q 'FAILURES!!!' instrumentation-frontend.txt

          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee runtime-relaunch.txt
          grep -q 'Status: ok' runtime-relaunch.txt
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.RuntimeGateTest#eHistoryVisibleFromPersistentDatabase' "$INSTRUMENTATION" | tee history-after-process-restart.txt
          grep -q 'OK (1 test)' history-after-process-restart.txt

          gradle --stacktrace :app:connectedDebugAndroidTest | tee connected-tests.txt
          grep -q 'BUILD SUCCESSFUL' connected-tests.txt
          adb install -r -t "$APP_APK" | tee reinstall-after-connected.txt; grep -q Success reinstall-after-connected.txt
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee final-relaunch.txt
          grep -q 'Status: ok' final-relaunch.txt
          sleep 1
          adb exec-out screencap -p > screenshot-final.png
          adb emu kill || true

      - name: Build provenance chain
        if: always()
        run: |
          SOURCE_SHA=$(sha256sum VeltrixCalculator-Frontend-Polish-tested-source.zip 2>/dev/null | awk '{print $1}')
          APK=ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
          APK_SHA=$(test -s "$APK" && sha256sum "$APK" | awk '{print $1}' || echo NOT_GENERATED)
          printf 'base_backend_commit=%s\nfrontend_commit=%s\nci_run_id=%s\ntested_source_sha256=%s\ngenerated_apk_sha256=%s\nsealed_frontend_bundle_sha256=%s\n' \
            280086be767d5c4f6aa334f5fdba8ec9bd054282 "$GITHUB_SHA" "$GITHUB_RUN_ID" "$SOURCE_SHA" "$APK_SHA" e19704ed9893fc3aa762ebecb90b0151c01ece878c179d66eb5ce9d339cabff6 | tee provenance.txt
          test ! -s "$APK" || sha256sum "$APK" > apk.sha256

      - name: Upload exact tested source APK and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixCalculator-Frontend-Polish-evidence
          path: |
            VeltrixCalculator-Frontend-Polish-tested-source.zip
            source.sha256
            frontend-polish.sha256
            core-before.sha256
            core-after.sha256
            provenance.txt
            apk.sha256
            ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
            ci-project/VeltrixCalculator/emulator.log
            ci-project/VeltrixCalculator/install-app.txt
            ci-project/VeltrixCalculator/install-test.txt
            ci-project/VeltrixCalculator/runtime-launch.txt
            ci-project/VeltrixCalculator/instrumentation-backend-contract.txt
            ci-project/VeltrixCalculator/instrumentation-frontend.txt
            ci-project/VeltrixCalculator/runtime-relaunch.txt
            ci-project/VeltrixCalculator/history-after-process-restart.txt
            ci-project/VeltrixCalculator/connected-tests.txt
            ci-project/VeltrixCalculator/reinstall-after-connected.txt
            ci-project/VeltrixCalculator/final-relaunch.txt
            ci-project/VeltrixCalculator/screenshot-calculator.png
            ci-project/VeltrixCalculator/screenshot-final.png
            ci-project/VeltrixCalculator/core/build/reports/tests/test/
            ci-project/VeltrixCalculator/app/build/reports/androidTests/
            ci-project/VeltrixCalculator/app/build/outputs/androidTest-results/
