name: Veltrix V4 Preflight and Runner Probe

on:
  push:
    branches:
      - veltrix-calculator-backend-v4-reset
  pull_request:
    branches:
      - main
      - veltrix-calculator-backend-v4-reset
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  preflight:
    name: V4 cheap preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify baseline ancestry
        run: |
          set -euxo pipefail
          BASELINE=544d7e8f8afefcd8a0a61724a4f3c525078181ce
          git cat-file -e "${BASELINE}^{commit}"
          git merge-base --is-ancestor "$BASELINE" "$GITHUB_SHA"
          echo "baseline_ancestry=VERIFIED"
      - name: Prove standard GitHub-hosted runner execution
        run: |
          set -euxo pipefail
          echo "VELTRIX_V4_RUNNER_PROBE_STARTED"
          uname -a
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          command -v java || true
          command -v adb || true
          echo "VELTRIX_V4_RUNNER_PROBE_GREEN"

  route-tail-v3:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'veltrix-v4-route-tail-v3-proof-20260821' }}
    name: V4 final route tail v3
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      SDK: /usr/local/lib/android/sdk
      ADB: /usr/local/lib/android/sdk/platform-tools/adb
      EMULATOR: /usr/local/lib/android/sdk/emulator/emulator
      SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
      AVDMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager
      ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: true
      - name: Execute exact descendant final route tail
        run: bash .ci/v4-route-tail-v3.sh
      - uses: actions/upload-artifact@v4
        with:
          name: veltrix-v4-final-route-tail-v3-${{ env.SOURCE_SHA }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/v4-route-tail/handoff/
      - name: Stop emulator
        if: always()
        run: "$ADB" emu kill || true
