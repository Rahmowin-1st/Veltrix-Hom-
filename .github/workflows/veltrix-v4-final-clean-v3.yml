name: Veltrix V4 Final Clean Proof V3

on:
  push:
    branches:
      - veltrix-calculator-backend-v4-reset
    paths:
      - 'calculator-v4/docs/V4_FINAL_GATE_READY'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SOURCE_SHA: ${{ github.sha }}
  BASELINE_SHA: 544d7e8f8afefcd8a0a61724a4f3c525078181ce
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd

jobs:
  final-clean-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Publish active final-run pointer
        run: |
          set -euxo pipefail
          BR="evidence/v4-final-active-${SOURCE_SHA}-${GITHUB_RUN_ID}"
          git config user.name veltrix-backend-bot
          git config user.email veltrix-backend-bot@users.noreply.github.com
          git switch --detach "$SOURCE_SHA"
          mkdir -p .ci/v4-final-active
          printf 'source_sha=%s\nrun_id=%s\njob=%s\nstatus=STARTED\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB" > ".ci/v4-final-active/${SOURCE_SHA}.txt"
          git add ".ci/v4-final-active/${SOURCE_SHA}.txt"
          git commit -m "evidence(v4): active final run $SOURCE_SHA"
          git push origin "HEAD:refs/heads/$BR"
          git switch --detach "$SOURCE_SHA"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: true

      - name: Execute canonical final proof once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          template = root / '.ci' / 'v4-final-clean-v3-template.yml'
          lines = template.read_text(encoding='utf-8').splitlines()
          env = os.environ.copy()

          def ingest_github_path():
              gp = env.get('GITHUB_PATH')
              if not gp:
                  return
              p = pathlib.Path(gp)
              if not p.exists():
                  return
              added = [x.strip() for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
              if added:
                  current = env.get('PATH', '')
                  env['PATH'] = os.pathsep.join(list(reversed(added)) + [current])

          blocks = []
          i = 0
          while i < len(lines):
              line = lines[i]
              if line.startswith('      - name: '):
                  name = line.split(': ', 1)[1]
                  workdir = None
                  run_block = None
                  j = i + 1
                  while j < len(lines) and not lines[j].startswith('      - '):
                      stripped = lines[j].strip()
                      if stripped.startswith('working-directory:'):
                          workdir = stripped.split(':', 1)[1].strip()
                      if stripped == 'run: |':
                          k = j + 1
                          buf = []
                          while k < len(lines):
                              raw = lines[k]
                              if raw.startswith('      - '):
                                  break
                              if raw and not raw.startswith('          '):
                                  break
                              buf.append(raw[10:] if raw.startswith('          ') else '')
                              k += 1
                          run_block = '\n'.join(buf) + '\n'
                          j = k - 1
                      j += 1
                  if run_block is not None:
                      blocks.append((name, workdir, run_block))
                  i = j
              else:
                  i += 1

          if len(blocks) < 10:
              raise SystemExit(f'parser found too few run blocks: {len(blocks)}')

          navigation_suite = 'run_class com.veltrix.calculator.app.V4NavigationRuntimeTest navigation-runtime.txt'
          navigation_isolated = r'''NAV_METHODS=(
            nav01To05_homeWorkspacePrimaryTabsAndBack
            nav06Nav07Nav14_settingsRememberTabAndWidgetCenterParentsSettings
            nav08Nav09_systemImeShowsAndFirstBackDismissesWithoutLeavingLibrary
            nav10Nav17Nav19_toolStateRestoresAndBackReturnsSameLibraryState
            nav11Nav12Nav18_converterAndGraphRestoreTheirSemanticParents
            nav13_historyReopenBackReturnsHistory
            nav21Nav22_deepLinksBuildCorrectParentChains
            nav15Nav16Nav20Nav23Nav24Nav25_stressIsBoundedAndRootBackFinishes
          )
          : > "$OUT/navigation-runtime.txt"
          for method in "${NAV_METHODS[@]}"; do
            adb shell am force-stop com.veltrix.calculator || true
            adb shell "run-as com.veltrix.calculator rm -f shared_prefs/ui_state.xml" || true
            CASE_OUT="$OUT/navigation-${method}.txt"
            adb shell am instrument -w -e class "com.veltrix.calculator.app.V4NavigationRuntimeTest#${method}" "$I" | tee "$CASE_OUT"
            grep -q 'OK (1 test)' "$CASE_OUT"
            ! grep -q 'FAILURES!!!' "$CASE_OUT"
            cat "$CASE_OUT" >> "$OUT/navigation-runtime.txt"
          done'''

          backend_suite = 'run_class com.veltrix.calculator.app.BackendMasterRuntimeTest backend-runtime.txt'
          backend_isolated = r'''adb shell am force-stop com.veltrix.calculator || true
          adb shell "run-as com.veltrix.calculator rm -f shared_prefs/ui_state.xml" || true
          run_class com.veltrix.calculator.app.BackendMasterRuntimeTest backend-runtime.txt'''

          plain_start = 'adb shell am force-stop com.veltrix.calculator; adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity'
          plain_start_isolated = 'adb shell am force-stop com.veltrix.calculator; adb shell "run-as com.veltrix.calculator rm -f shared_prefs/ui_state.xml" || true; adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity'
          timed_plain_start = 'adb shell am force-stop com.veltrix.calculator; R=$(adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity)'
          timed_plain_start_isolated = 'adb shell am force-stop com.veltrix.calculator; adb shell "run-as com.veltrix.calculator rm -f shared_prefs/ui_state.xml" || true; R=$(adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity)'

          for name, workdir, command in blocks:
              command = command.replace(
                  'adb shell am start -W -a android.intent.action.VIEW -d "$uri" com.veltrix.calculator',
                  'adb shell "am start -W -a android.intent.action.VIEW -d \'$uri\' com.veltrix.calculator"'
              )
              command = command.replace(
                  "adb shell am start -W -a android.intent.action.VIEW -d 'veltrix://home/standard-calculator?expression=6*7' com.veltrix.calculator",
                  "adb shell \"am start -W -a android.intent.action.VIEW -d 'veltrix://home/standard-calculator?expression=6*7' com.veltrix.calculator\""
              )
              command = command.replace(
                  "adb shell am start -W -a android.intent.action.VIEW -d 'veltrix://converter/Length?from=km&to=mi&amount=100' com.veltrix.calculator",
                  "adb shell \"am start -W -a android.intent.action.VIEW -d 'veltrix://converter/Length?from=km&to=mi&amount=100' com.veltrix.calculator\""
              )
              command = command.replace(navigation_suite, navigation_isolated)
              command = command.replace(backend_suite, backend_isolated)
              command = command.replace(plain_start, plain_start_isolated)
              command = command.replace(timed_plain_start, timed_plain_start_isolated)
              command = command.replace(
                  'git archive --format=zip --output="$H/VeltrixCalculator-V4-FINAL-TESTED-SOURCE.zip" "$SOURCE_SHA" calculator-v4 .github/workflows/veltrix-v4-final-clean-v3.yml',
                  'git archive --format=zip --output="$H/VeltrixCalculator-V4-FINAL-TESTED-SOURCE.zip" "$SOURCE_SHA" calculator-v4 .github/workflows/veltrix-v4-final-clean-v3.yml .ci/v4-final-clean-v3-template.yml'
              )
              cwd = root / workdir if workdir else root
              print(f'=== FINAL BLOCK: {name} ===', flush=True)
              subprocess.run(['bash', '-euo', 'pipefail', '-c', command], cwd=cwd, env=env, check=True)
              ingest_github_path()
          PY

      - name: Upload exact final handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-v4-final-handoff-${{ env.SOURCE_SHA }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/veltrix-v4-final/handoff/
