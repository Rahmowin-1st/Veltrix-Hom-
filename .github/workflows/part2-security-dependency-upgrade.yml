name: Part 2 Security Dependency Upgrade

on:
  push:
    branches:
      - veltrix-hom-backend-part2-knowledge-core
    paths:
      - .github/workflows/part2-security-dependency-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade-security-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: veltrix-hom-backend-part2-knowledge-core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Set reviewed security dependency policy
        working-directory: server
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.dependencies.multer = '2.2.0'
          pkg.dependencies['pdf-to-img'] = '6.2.0'
          pkg.overrides = { ...(pkg.overrides ?? {}), 'pdf-to-img': { 'pdfjs-dist': '6.2.108' } }
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          NODE
          npm install --no-audit --no-fund
      - name: Prove resolved security dependency tree
        working-directory: server
        run: npm ls multer pdf-to-img pdfjs-dist
      - name: Enforce production high-severity audit
        working-directory: server
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Unit and regression tests including PDF renderer smoke
        working-directory: server
        run: npm test -- --reporter=verbose
      - name: Build
        working-directory: server
        run: npm run build
      - name: Commit npm-generated package lock
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/package.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit"
            exit 1
          fi
          git commit -m "security(part2): harden multipart and PDF parser dependencies"
          git push origin HEAD:veltrix-hom-backend-part2-knowledge-core
