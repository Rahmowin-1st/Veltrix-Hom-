name: Veltrix Calculator Backend Master FINAL

on:
  push:
    branches: [ veltrix-calculator-backend-master ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact final source and harden live currency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9097404591/zip > parent.zip
          unzip -q parent.zip -d parent
          test -f parent/VeltrixCalculator-BackendMaster-FINAL-tested-source.zip
          echo "44bba38a31ae963e5a0da85ca63de7cab258cc7b86851d144fc9a7fe306345c0  parent/VeltrixCalculator-BackendMaster-FINAL-tested-source.zip" | sha256sum -c -
          mkdir ci-project
          unzip -q parent/VeltrixCalculator-BackendMaster-FINAL-tested-source.zip -d ci-project
          python3 - <<'PY'
          from pathlib import Path
          root=Path('ci-project/VeltrixCalculator')

          p=root/'app/src/main/kotlin/com/veltrix/calculator/app/CurrencyRepository.kt'
          s=p.read_text()
          old='val live = provider.fetch(base,quote); cache.put(live,now); rememberPair(live.base,live.quote)'
          new='val live = fetchWithRetry(base,quote); cache.put(live,now); rememberPair(live.base,live.quote)'
          if old not in s: raise SystemExit('CurrencyRepository live fetch token missing')
          s=s.replace(old,new,1)
          marker='    private fun rememberPair(base:String,quote:String){\n'
          retry='''    private fun fetchWithRetry(base: String, quote: String, attempts: Int = 3): ProviderRate {\n        var lastError: Exception? = null\n        repeat(attempts.coerceIn(1, 5)) { attempt ->\n            try { return provider.fetch(base, quote) } catch (e: Exception) {\n                lastError = e\n                val reason = (e as? CurrencyProviderException)?.reason\n                val retryable = e !is CurrencyProviderException || reason == "NETWORK" || reason == "HTTP_408" || reason == "HTTP_429" || reason?.startsWith("HTTP_5") == true\n                if (!retryable) throw e\n                if (attempt < attempts - 1) {\n                    try { Thread.sleep(500L shl attempt) } catch (_: InterruptedException) {\n                        Thread.currentThread().interrupt()\n                        throw CurrencyProviderException("INTERRUPTED")\n                    }\n                }\n            }\n        }\n        throw CurrencyProviderException((lastError as? CurrencyProviderException)?.reason ?: "NETWORK")\n    }\n\n'''
          if marker not in s: raise SystemExit('CurrencyRepository rememberPair marker missing')
          p.write_text(s.replace(marker,retry+marker,1))

          p=root/'app/src/androidTest/kotlin/com/veltrix/calculator/app/LiveCurrencyRuntimeTest.kt'
          s=p.read_text()
          if 'import android.net.ConnectivityManager' not in s:
              s=s.replace('package com.veltrix.calculator.app\n\n','package com.veltrix.calculator.app\n\nimport android.content.Context\nimport android.net.ConnectivityManager\nimport android.net.NetworkCapabilities\n',1)
          cls='class LiveCurrencyRuntimeTest {\n'
          helper='''class LiveCurrencyRuntimeTest {\n    private fun waitForValidatedNetwork(context: Context, timeoutMs: Long = 30_000L) {\n        val cm = context.getSystemService(ConnectivityManager::class.java)\n        val deadline = System.currentTimeMillis() + timeoutMs\n        while (System.currentTimeMillis() < deadline) {\n            val network = cm.activeNetwork\n            val caps = network?.let { cm.getNetworkCapabilities(it) }\n            if (caps?.hasCapability(NetworkCapabilities.NET_CAPABILITY_VALIDATED) == true) return\n            Thread.sleep(500)\n        }\n        throw AssertionError("Android network did not become validated before live currency probe")\n    }\n\n'''
          if 'waitForValidatedNetwork' not in s:
              if cls not in s: raise SystemExit('LiveCurrencyRuntimeTest class marker missing')
              s=s.replace(cls,helper,1)
          old='        val context=inst.targetContext\n        CurrencyCacheStore(context).clear()\n'
          new='        val context=inst.targetContext\n        waitForValidatedNetwork(context)\n        CurrencyCacheStore(context).clear()\n'
          if old not in s: raise SystemExit('LiveCurrencyRuntimeTest context token missing')
          p.write_text(s.replace(old,new,1))
          PY
          (cd ci-project && zip -qr ../VeltrixCalculator-BackendMaster-COMPLETE-tested-source.zip VeltrixCalculator)
          sha256sum VeltrixCalculator-BackendMaster-COMPLETE-tested-source.zip | tee source.sha256
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/veltrix-master-avd" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Verify public currency provider from runner
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 https://api.frankfurter.dev/v2/rate/USD/EUR | tee frankfurter-runner.json
          python3 - <<'PY'
          import json
          d=json.load(open('frankfurter-runner.json'))
          assert d['base']=='USD' and d['quote']=='EUR' and float(d['rate'])>0 and d['date']
          print('Frankfurter v2 runner probe PASS')
          PY

      - name: Core registry regression
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stacktrace :core:test | tee core-tests.txt
          grep -q 'BUILD SUCCESSFUL' core-tests.txt
          test -s core/build/registry-export.tsv
          TOOLS=$(tail -n +3 core/build/registry-export.tsv | wc -l)
          SUBJECTS=$(tail -n +3 core/build/registry-export.tsv | cut -f3 | sort -u | wc -l)
          printf 'registry_tool_count=%s\nregistry_subject_count=%s\n' "$TOOLS" "$SUBJECTS" | tee registry-count.txt
          test "$TOOLS" -eq 104
          test "$SUBJECTS" -eq 9

      - name: Build app and instrumentation APKs
        working-directory: ci-project/VeltrixCalculator
        run: gradle --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Static Android assertions
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          apkanalyzer manifest print "$APK" | tee manifest.txt
          grep -q 'com.veltrix.calculator' manifest.txt
          grep -qi 'resizeableActivity="true"' manifest.txt
          ! grep -q 'android.permission.SYSTEM_ALERT_WINDOW' manifest.txt

      - name: Boot emulator
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_master_api35 -k "system-images;android-35;google_apis;x86_64" -f
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx veltrix_master_api35
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_master_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          BOOT=$(adb shell getprop sys.boot_completed | tr -d '\r')
          echo "boot_completed=$BOOT" | tee runtime-debug.txt
          test "$BOOT" = "1"
          adb devices -l | tee -a runtime-debug.txt
          adb get-state | tr -d '\r' | grep -Fx device

      - name: Full Android runtime gate
        working-directory: ci-project/VeltrixCalculator
        shell: bash
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP_APK" | tee install-app.txt; grep -q Success install-app.txt
          adb install -r -t "$TEST_APK" | tee install-test.txt; grep -q Success install-test.txt
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee cold-launch.txt
          grep -q 'Status: ok' cold-launch.txt
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.veltrix.calculator.*MainActivity'
          INSTRUMENTATION=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$INSTRUMENTATION"

          adb shell am instrument -w -e liveProbe true -e class com.veltrix.calculator.app.LiveCurrencyRuntimeTest "$INSTRUMENTATION" | tee live-currency.txt
          grep -q 'OK (1 test)' live-currency.txt
          ! grep -q 'FAILURES!!!' live-currency.txt

          adb shell am instrument -w -e class 'com.veltrix.calculator.app.BackendMasterRuntimeTest#dPersistenceSeed' "$INSTRUMENTATION" | tee persistence-seed.txt
          grep -q 'OK (1 test)' persistence-seed.txt
          adb shell am force-stop com.veltrix.calculator
          test -z "$(adb shell pidof com.veltrix.calculator 2>/dev/null || true)"
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee process-relaunch.txt
          grep -q 'Status: ok' process-relaunch.txt
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.BackendMasterRuntimeTest#zPersistenceAfterProcessRestart' "$INSTRUMENTATION" | tee process-persistence.txt
          grep -q 'OK (1 test)' process-persistence.txt

          TASK_ID=$(adb shell dumpsys activity recents | sed -n 's/.*Task{[^#]*#\([0-9][0-9]*\).*com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r' || true)
          echo "task_id=$TASK_ID" | tee multiwindow.txt
          if [ -n "$TASK_ID" ] && adb shell am task resize "$TASK_ID" 0 0 700 900 >> multiwindow.txt 2>&1; then echo 'resize_runtime=VERIFIED' | tee -a multiwindow.txt; else echo 'resize_runtime=NOT_VERIFIED_ENVIRONMENT' | tee -a multiwindow.txt; fi

          adb shell cmd connectivity airplane-mode enable || adb shell settings put global airplane_mode_on 1
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          AIR=$(adb shell settings get global airplane_mode_on | tr -d '\r')
          echo "airplane_mode=$AIR" | tee offline-state.txt
          test "$AIR" = "1"
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.BackendMasterRuntimeTest#gOfflineDeterministicAndGraph' "$INSTRUMENTATION" | tee offline-graph.txt
          grep -q 'OK (1 test)' offline-graph.txt
          adb shell pm path com.veltrix.calculator | tee package-path.txt
          grep -q '^package:' package-path.txt

          adb shell cmd connectivity airplane-mode disable || adb shell settings put global airplane_mode_on 0
          adb shell svc wifi enable || true
          sleep 3
          gradle --stacktrace :app:connectedDebugAndroidTest | tee connected-tests.txt
          grep -q 'BUILD SUCCESSFUL' connected-tests.txt

          adb install -r -t "$APP_APK" | tee reinstall-after-connected.txt
          grep -q Success reinstall-after-connected.txt
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee final-relaunch.txt
          grep -q 'Status: ok' final-relaunch.txt
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.veltrix.calculator.*MainActivity'
          adb emu kill || true

      - name: Provenance
        if: always()
        run: |
          SOURCE_SHA=NOT_GENERATED; APK_SHA=NOT_GENERATED; TOOLS=NOT_GENERATED
          [ -f VeltrixCalculator-BackendMaster-COMPLETE-tested-source.zip ] && SOURCE_SHA=$(sha256sum VeltrixCalculator-BackendMaster-COMPLETE-tested-source.zip | awk '{print $1}')
          APK=ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK" ] && APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          [ -f ci-project/VeltrixCalculator/core/build/registry-export.tsv ] && TOOLS=$(tail -n +3 ci-project/VeltrixCalculator/core/build/registry-export.tsv | wc -l)
          printf 'commit_sha=%s\nbranch=%s\nci_run_id=%s\nparent_source_sha256=%s\ntested_source_sha256=%s\ngenerated_apk_sha256=%s\nregistry_tool_count=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" '44bba38a31ae963e5a0da85ca63de7cab258cc7b86851d144fc9a7fe306345c0' "$SOURCE_SHA" "$APK_SHA" "$TOOLS" | tee provenance.txt
          [ -f "$APK" ] && sha256sum "$APK" > apk.sha256 || true

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixCalculator-BackendMaster-COMPLETE
          if-no-files-found: warn
          path: |
            VeltrixCalculator-BackendMaster-COMPLETE-tested-source.zip
            source.sha256
            provenance.txt
            apk.sha256
            frankfurter-runner.json
            ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
            ci-project/VeltrixCalculator/core/build/registry-export.tsv
            ci-project/VeltrixCalculator/docs/
            ci-project/VeltrixCalculator/core-tests.txt
            ci-project/VeltrixCalculator/registry-count.txt
            ci-project/VeltrixCalculator/manifest.txt
            emulator.log
            runtime-debug.txt
            ci-project/VeltrixCalculator/install-app.txt
            ci-project/VeltrixCalculator/install-test.txt
            ci-project/VeltrixCalculator/cold-launch.txt
            ci-project/VeltrixCalculator/live-currency.txt
            ci-project/VeltrixCalculator/persistence-seed.txt
            ci-project/VeltrixCalculator/process-relaunch.txt
            ci-project/VeltrixCalculator/process-persistence.txt
            ci-project/VeltrixCalculator/multiwindow.txt
            ci-project/VeltrixCalculator/offline-state.txt
            ci-project/VeltrixCalculator/offline-graph.txt
            ci-project/VeltrixCalculator/package-path.txt
            ci-project/VeltrixCalculator/connected-tests.txt
            ci-project/VeltrixCalculator/reinstall-after-connected.txt
            ci-project/VeltrixCalculator/final-relaunch.txt
            ci-project/VeltrixCalculator/core/build/reports/tests/test/
            ci-project/VeltrixCalculator/app/build/reports/androidTests/
            ci-project/VeltrixCalculator/app/build/outputs/androidTest-results/
