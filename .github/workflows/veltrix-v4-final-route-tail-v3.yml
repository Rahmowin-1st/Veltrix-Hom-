name: Veltrix V4 Final Route Tail V3

on:
  pull_request:
    branches:
      - veltrix-calculator-backend-v4-reset

permissions:
  contents: write
  actions: read

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  PROD_BASE: 876da378e80ba79a6db649e5af20e63f10201b04
  BASELINE_SHA: 544d7e8f8afefcd8a0a61724a4f3c525078181ce
  SDK: /usr/local/lib/android/sdk
  ADB: /usr/local/lib/android/sdk/platform-tools/adb
  EMULATOR: /usr/local/lib/android/sdk/emulator/emulator
  SDKMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager
  AVDMANAGER: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/avdmanager
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd

jobs:
  route-tail-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Exact source and production freeze
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" "$SOURCE_SHA"
          git merge-base --is-ancestor "$PROD_BASE" "$SOURCE_SHA"
          CHANGED="$(git diff --name-only "$PROD_BASE" "$SOURCE_SHA")"
          test -z "$(printf '%s\n' "$CHANGED" | grep -Ev '^(\.github/workflows/|\.ci/)' || true)"
          grep -q 'PERSISTED_ROUTE = "v4.persisted.route"' calculator-v4/app/src/main/kotlin/com/veltrix/calculator/app/MainActivity.kt
          mkdir -p "$RUNNER_TEMP/v4-route-tail"
          printf 'source_sha=%s\nprod_base=%s\nrun_id=%s\njob=%s\n' "$SOURCE_SHA" "$PROD_BASE" "$GITHUB_RUN_ID" "$GITHUB_JOB" | tee "$RUNNER_TEMP/v4-route-tail/provenance.txt"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: true

      - name: Exact rebuild tests APKs matrices
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          gradle --stacktrace :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          APP=app/build/outputs/apk/debug/app-debug.apk
          TEST=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          test -s "$APP"; test -s "$TEST"
          test "$(tail -n +3 core/build/registry-export.tsv | wc -l)" -eq 260
          diff -u docs/SUBJECT_COVERAGE_MATRIX.tsv core/build/subject-coverage-matrix.tsv
          diff -u docs/SOLVE_TARGET_MATRIX.tsv core/build/solve-target-matrix.tsv
          sha256sum "$APP" "$TEST" core/build/registry-export.tsv core/build/subject-coverage-matrix.tsv core/build/solve-target-matrix.tsv | tee "$RUNNER_TEMP/v4-route-tail/build-hashes.sha256"

      - name: Boot API35 install exact APKs
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
          test -x "$ADB"; test -x "$EMULATOR"; test -x "$AVDMANAGER"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$AVDMANAGER" create avd -n veltrix_route_tail_v3 -k "system-images;android-35;google_apis;x86_64" -f
          nohup "$EMULATOR" @veltrix_route_tail_v3 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > "$RUNNER_TEMP/v4-route-tail/emulator.log" 2>&1 &
          timeout 180 "$ADB" wait-for-device
          for i in $(seq 1 120); do [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 2; done
          test "$("$ADB" shell getprop sys.boot_completed | tr -d '\r')" = 1
          APP=app/build/outputs/apk/debug/app-debug.apk; TEST=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          "$ADB" install -r -t "$APP" | tee "$RUNNER_TEMP/v4-route-tail/install-app.txt"
          "$ADB" install -r -t "$TEST" | tee "$RUNNER_TEMP/v4-route-tail/install-test.txt"
          "$ADB" shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee "$RUNNER_TEMP/v4-route-tail/cold-launch.txt"
          grep -q 'Status: ok' "$RUNNER_TEMP/v4-route-tail/cold-launch.txt"

      - name: Navigation backend runtime and live currency
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/v4-route-tail"
          I=$("$ADB" shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r'); test -n "$I"
          for cls in V4NavigationRuntimeTest BackendMasterRuntimeTest; do
            "$ADB" shell am instrument -w -e class "com.veltrix.calculator.app.$cls" "$I" | tee "$OUT/$cls.txt"
            grep -q 'OK (' "$OUT/$cls.txt"
          done
          "$ADB" shell am instrument -w -e liveProbe true -e class com.veltrix.calculator.app.LiveCurrencyRuntimeTest "$I" | tee "$OUT/live-currency.txt"
          grep -q 'OK (1 test)' "$OUT/live-currency.txt"

      - name: True process death tool and converter semantic restore
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/v4-route-tail"
          launch_uri(){ local uri="$1"; "$ADB" shell "am start -W -a android.intent.action.VIEW -d '$uri' com.veltrix.calculator"; }
          restore(){
            local name="$1" uri="$2" detail="$3" parent="$4"
            "$ADB" shell am force-stop com.veltrix.calculator
            launch_uri "$uri" | tee "$OUT/$name-launch.txt"; grep -q 'Status: ok' "$OUT/$name-launch.txt"
            sleep 1; "$ADB" shell uiautomator dump "/sdcard/$name-before.xml" >/dev/null; "$ADB" pull "/sdcard/$name-before.xml" "$OUT/$name-before.xml" >/dev/null; grep -q "content-desc=\"$detail\"" "$OUT/$name-before.xml"
            "$ADB" shell input keyevent KEYCODE_HOME; sleep 1
            PID="$("$ADB" shell pidof com.veltrix.calculator 2>/dev/null | tr -d '\r' | awk '{print $1}')"; test -n "$PID"
            "$ADB" shell "run-as com.veltrix.calculator kill -9 $PID"
            for i in $(seq 1 40); do CUR="$("$ADB" shell pidof com.veltrix.calculator 2>/dev/null | tr -d '\r' || true)"; case " $CUR " in *" $PID "*) sleep .25;; *) break;; esac; done
            CUR="$("$ADB" shell pidof com.veltrix.calculator 2>/dev/null | tr -d '\r' || true)"; case " $CUR " in *" $PID "*) exit 1;; esac
            "$ADB" shell am start -W --activity-reorder-to-front -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee "$OUT/$name-restore.txt"; grep -q 'Status: ok' "$OUT/$name-restore.txt"
            sleep 1; "$ADB" shell uiautomator dump "/sdcard/$name-after.xml" >/dev/null; "$ADB" pull "/sdcard/$name-after.xml" "$OUT/$name-after.xml" >/dev/null; grep -q "content-desc=\"$detail\"" "$OUT/$name-after.xml"
            "$ADB" shell input keyevent KEYCODE_BACK; sleep 1; "$ADB" shell uiautomator dump "/sdcard/$name-parent.xml" >/dev/null; "$ADB" pull "/sdcard/$name-parent.xml" "$OUT/$name-parent.xml" >/dev/null; grep -q "content-desc=\"$parent\"" "$OUT/$name-parent.xml"
          }
          restore tool 'veltrix://tool/physics-ohms-law' 'route-tool-physics-ohms-law' 'route-workspace-library'
          restore converter 'veltrix://converter/Length?from=km&to=mi&amount=100' 'route-converter-detail' 'route-workspace-converters'

      - name: Integration performance security
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/v4-route-tail"
          launch_uri(){ local uri="$1"; "$ADB" shell "am start -W -a android.intent.action.VIEW -d '$uri' com.veltrix.calculator"; }
          launch_uri 'veltrix://home/standard-calculator?expression=6*7' > "$OUT/calc-launch.txt"; grep -q 'Status: ok' "$OUT/calc-launch.txt"
          launch_uri 'veltrix://converter/Length?from=km&to=mi&amount=100' > "$OUT/converter-launch.txt"; grep -q 'Status: ok' "$OUT/converter-launch.txt"
          sleep 1; "$ADB" shell uiautomator dump /sdcard/converter.xml >/dev/null; "$ADB" pull /sdcard/converter.xml "$OUT/converter.xml" >/dev/null; grep -q 'content-desc="route-converter-detail"' "$OUT/converter.xml"
          "$ADB" logcat -c; printf 'sample\ttotalTimeMs\n' > "$OUT/startup.tsv"
          for i in $(seq 1 10); do "$ADB" shell am force-stop com.veltrix.calculator; R=$("$ADB" shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity); T=$(printf '%s\n' "$R" | awk -F': ' '/TotalTime:/{print $2}' | tr -d '\r'); test -n "$T"; test "$T" -gt 0; printf '%s\t%s\n' "$i" "$T" >> "$OUT/startup.tsv"; done
          I=$("$ADB" shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          "$ADB" shell am instrument -w -e class 'com.veltrix.calculator.app.V4FinalRuntimeAcceptanceTest#eMeasuredBackendRuntimeOperations' "$I" | tee "$OUT/performance.txt"; grep -q 'OK (1 test)' "$OUT/performance.txt"
          for n in calculator_execute registry_lookup conversion navigation history_load currency_refresh; do grep -q "VELTRIX_PERF name=$n" "$OUT/performance.txt"; done
          "$ADB" logcat -d -v threadtime > "$OUT/logcat.txt"; ! grep -E 'ANR in com\.veltrix\.calculator|FATAL EXCEPTION:.*com\.veltrix\.calculator' "$OUT/logcat.txt"
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          ! grep -R -n -E '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)' app/src/main core/src/main

      - name: Reinstall smoke package artifact
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/v4-route-tail"; H="$OUT/handoff"; mkdir -p "$H/evidence" "$H/docs"
          APP=app/build/outputs/apk/debug/app-debug.apk; TEST=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          "$ADB" uninstall com.veltrix.calculator | tee "$OUT/uninstall.txt"; grep -q Success "$OUT/uninstall.txt"
          "$ADB" install -t "$APP" | tee "$OUT/reinstall.txt"; grep -q Success "$OUT/reinstall.txt"
          "$ADB" shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee "$OUT/relaunch.txt"; grep -q 'Status: ok' "$OUT/relaunch.txt"
          "$ADB" install -r -t "$TEST" >/dev/null
          I=$("$ADB" shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          "$ADB" shell am instrument -w -e class 'com.veltrix.calculator.app.BackendMasterRuntimeTest#aColdLaunchStandardAndScientificProgrammer' "$I" | tee "$OUT/post-reinstall.txt"; grep -q 'OK (1 test)' "$OUT/post-reinstall.txt"
          git archive --format=zip --output="$H/VeltrixCalculator-V4-FINAL-TESTED-SOURCE.zip" "$SOURCE_SHA" calculator-v4
          cp "$APP" "$H/VeltrixCalculator-V4-FINAL.apk"
          cp "$OUT"/*.txt "$OUT"/*.xml "$OUT"/*.tsv "$OUT"/*.sha256 "$H/evidence/" 2>/dev/null || true
          cp docs/{NAVIGATION_ARCHITECTURE.md,LIBRARY_CATALOG_VNEXT.md,SUBJECT_RESEARCH_MAP.md,SUBJECT_COVERAGE_MATRIX.tsv,SOLVE_TARGET_MATRIX.tsv,CONVERTER_CATALOG_VNEXT.md,WIDGET_PRODUCT_SPEC.md,MIGRATION_REPORT.md,TEST_REPORT.md,VERIFIED_CLAIMED_NOT_VERIFIED.md,FRONTEND_HANDOFF_VNEXT.md,AC_NAV_FINAL_LEDGER.tsv} "$H/docs/"
          (cd "$H/evidence" && zip -qr "$H/VeltrixCalculator-V4-FINAL-GREEN-EVIDENCE.zip" .)
          printf 'exact_tested_source_sha=%s\nrun_id=%s\njob=%s\npredecessor_full_v3_run=32448354092\npredecessor_green_gates=V3_steps_1_through_12\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB" > "$H/FINAL_HANDOFF_INDEX.txt"
          (cd "$H" && sha256sum VeltrixCalculator-V4-FINAL.apk VeltrixCalculator-V4-FINAL-TESTED-SOURCE.zip VeltrixCalculator-V4-FINAL-GREEN-EVIDENCE.zip FINAL_HANDOFF_INDEX.txt docs/* > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: veltrix-v4-final-route-tail-v3-${{ env.SOURCE_SHA }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/v4-route-tail/handoff/

      - name: Persist success pointer
        run: |
          set -euxo pipefail
          BR="evidence/v4-route-tail-v3-${SOURCE_SHA}-${GITHUB_RUN_ID}"
          git config user.name veltrix-backend-bot; git config user.email veltrix-backend-bot@users.noreply.github.com
          git switch --detach "$SOURCE_SHA"; mkdir -p .ci/v4-final
          printf 'status=SUCCESS\ntested_source_sha=%s\nrun_id=%s\njob=%s\nartifact_name=veltrix-v4-final-route-tail-v3-%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB" "$SOURCE_SHA" > ".ci/v4-final/${SOURCE_SHA}-route-tail-v3.txt"
          git add ".ci/v4-final/${SOURCE_SHA}-route-tail-v3.txt"; git commit -m "evidence(v4): route tail v3 $SOURCE_SHA"; git push origin "HEAD:refs/heads/$BR"

      - name: Stop emulator
        if: always()
        run: "$ADB" emu kill || true
