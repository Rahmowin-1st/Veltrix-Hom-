name: Veltrix V4 Tail V2 Controller

on:
  pull_request:
    branches:
      - veltrix-calculator-backend-v4-reset

permissions:
  contents: write
  actions: write

jobs:
  dispatch-tail-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Enable once then dispatch exact Tail V2
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_HEAD_SHA"
          FILE=.github/workflows/veltrix-v4-final-tail-proof-v2.yml
          test -s "$FILE"
          if ! grep -q '^  workflow_dispatch:' "$FILE"; then
            python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/veltrix-v4-final-tail-proof-v2.yml')
          s=p.read_text()
          s=s.replace(
              "on:\n  pull_request:\n    branches:\n      - veltrix-calculator-backend-v4-reset\n",
              "on:\n  pull_request:\n    branches:\n      - veltrix-calculator-backend-v4-reset\n  workflow_dispatch:\n    inputs:\n      source_sha:\n        description: Exact proof SHA\n        required: true\n        type: string\n",
              1,
          )
          s=s.replace(
              '  SOURCE_SHA: ${{ github.event.pull_request.head.sha }}',
              '  SOURCE_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha || github.sha }}',
              1,
          )
          p.write_text(s)
          PY
            git diff --check
            git config user.name veltrix-backend-bot
            git config user.email veltrix-backend-bot@users.noreply.github.com
            git add "$FILE"
            git commit -m 'ci(v4): enable explicit tail v2 dispatch'
            git push origin "HEAD:$HEAD_REF"
            echo 'Tail V2 dispatch enabled; synchronize event will dispatch exact new head.'
            exit 0
          fi
          NEW_SHA="$(git rev-parse HEAD)"
          gh workflow run veltrix-v4-final-tail-proof-v2.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF" -f source_sha="$NEW_SHA"
          FOUND=""
          for i in $(seq 1 30); do
            FOUND="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow veltrix-v4-final-tail-proof-v2.yml --branch "$HEAD_REF" --event workflow_dispatch --limit 10 --json databaseId,headSha,status,conclusion --jq '.[] | select(.headSha==env.NEW_SHA) | [.databaseId,.status,(.conclusion // ""),.headSha] | @tsv' | head -1 || true)"
            [ -n "$FOUND" ] && break
            sleep 2
          done
          test -n "$FOUND"
          printf 'TAIL_V2_DISPATCH=%s\n' "$FOUND"
