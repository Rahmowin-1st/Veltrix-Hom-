name: Veltrix Calculator Backend Master Platform Gate

on:
  push:
    branches: [ veltrix-calculator-backend-master ]
  workflow_dispatch:

jobs:
  backend-master-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure deterministic Android environment
        run: |
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/veltrix-backend-master-avd" >> "$GITHUB_ENV"

      - name: Reconstruct accepted I2.1 baseline
        run: |
          set -euo pipefail
          cat veltrix-chunks/chunk_* > base.b64
          base64 -d base.b64 > base-source.zip
          echo "da40c39fd22d19d2686d8702ea36b64ef0f6af87506fd2ea6f51232b1f59e6dd  base-source.zip" | sha256sum -c -
          unzip -t base-source.zip
          mkdir -p ci-project
          unzip -q base-source.zip -d ci-project
          cp ci-overrides/RuntimeGateTest.kt ci-project/VeltrixCalculator/app/src/androidTest/kotlin/com/veltrix/calculator/app/RuntimeGateTest.kt
          cp ci-overrides/gradle.properties ci-project/VeltrixCalculator/gradle.properties
          cp ci-overrides/GateSmokeRegressionTest.kt ci-project/VeltrixCalculator/core/src/test/kotlin/com/veltrix/calculator/core/GateSmokeRegressionTest.kt

      - name: Apply verified Backend Master overlay
        run: |
          set -euo pipefail
          cat \
            backend-master-v2-overrides/chunk_00 \
            backend-master-v2-overrides/chunk_01 \
            backend-master-v2-overrides/chunk_02 \
            backend-master-v2-overrides/chunk_03 \
            backend-master-v2-overrides/chunk_04 \
            backend-master-v2-overrides/chunk_05 \
            backend-master-v2-overrides/chunk_06 \
            backend-master-v2-overrides/chunk_07a \
            backend-master-v2-overrides/chunk_07b \
            backend-master-v2-overrides/chunk_07c \
            backend-master-v2-overrides/chunk_07e0 \
            backend-master-v2-overrides/chunk_07e1 \
            backend-master-v2-overrides/chunk_07e2 \
            backend-master-v2-overrides/chunk_07e3 \
            backend-master-v2-overrides/chunk_07e4 \
            backend-master-v2-overrides/chunk_07e5 \
            backend-master-v2-overrides/chunk_07e6 \
            backend-master-v2-overrides/chunk_07e7 \
            backend-master-v2-overrides/chunk_08 > overrides.b64
          test "$(wc -c < overrides.b64)" -eq 129376
          base64 -d overrides.b64 > backend-master-overrides.zip
          echo "95871f0fd056d877a29fa8c94ec28cf3761656c80fe7b3b5713bd1308c95db54  backend-master-overrides.zip" | sha256sum -c -
          unzip -t backend-master-overrides.zip
          unzip -qo backend-master-overrides.zip -d ci-project
          python3 - <<'PY'
          from pathlib import Path
          p = Path('ci-project/VeltrixCalculator/core/src/test/kotlin/com/veltrix/calculator/core/PlatformFoundationTest.kt')
          s = p.read_text()
          old = 'assertTrue(MainBrainSnapshot::class.members.none { it.name.equals("continue", ignoreCase = true) })'
          new = 'assertFalse(MainBrainSnapshot().toString().contains("Continue", ignoreCase = true))'
          if old not in s:
              raise SystemExit('expected reflection assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Seal exact source under test
        run: |
          set -euo pipefail
          (cd ci-project && zip -qr ../VeltrixCalculator-BackendMaster-tested-source.zip VeltrixCalculator)
          sha256sum VeltrixCalculator-BackendMaster-tested-source.zip | tee source.sha256

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK and emulator image
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Core and platform regression
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stacktrace :core:test | tee core-tests.txt
          grep -q 'BUILD SUCCESSFUL' core-tests.txt
          test -s core/build/registry-export.tsv
          TOOL_COUNT=$(tail -n +2 core/build/registry-export.tsv | wc -l)
          echo "registry_tool_count=$TOOL_COUNT" | tee registry-count.txt
          test "$TOOL_COUNT" -ge 100
          SUBJECT_COUNT=$(tail -n +2 core/build/registry-export.tsv | cut -f4 | sort -u | wc -l)
          echo "registry_subject_count=$SUBJECT_COUNT" | tee -a registry-count.txt
          test "$SUBJECT_COUNT" -ge 9

      - name: Build app and instrumentation APKs
        working-directory: ci-project/VeltrixCalculator
        run: gradle --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Static package and permission gate
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APP_APK"
          apkanalyzer manifest print "$APP_APK" | tee manifest.txt
          grep -q 'com.veltrix.calculator' manifest.txt
          grep -qi 'resizeableActivity="true"' manifest.txt
          if grep -q 'android.permission.SYSTEM_ALERT_WINDOW' manifest.txt; then
            echo 'Overlay permission is forbidden' >&2
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create deterministic AVD
        run: |
          set -euo pipefail
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_backend_master_api35 -k "system-images;android-35;google_apis;x86_64" -f
          avdmanager list avd | tee avd-list.txt
          "$ANDROID_HOME/emulator/emulator" -list-avds | tee emulator-avds.txt
          grep -Fx veltrix_backend_master_api35 emulator-avds.txt

      - name: Full Backend Master Android runtime gate
        working-directory: ci-project/VeltrixCalculator
        shell: bash
        run: |
          set -euo pipefail
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_backend_master_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > emulator.log 2>&1 &
          echo "emulator_pid=$!" | tee runtime-debug.txt

          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            BOOT=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            [ "$BOOT" = "1" ] && break
            sleep 2
          done
          BOOT=$(adb shell getprop sys.boot_completed | tr -d '\r')
          echo "boot_completed=$BOOT" | tee -a runtime-debug.txt
          test "$BOOT" = "1"
          adb devices -l | tee -a runtime-debug.txt
          adb get-state | tr -d '\r' | grep -Fx device

          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          test -s "$APP_APK"
          test -s "$TEST_APK"
          adb install -r -t "$APP_APK" | tee install-app.txt
          grep -q Success install-app.txt
          adb install -r -t "$TEST_APK" | tee install-test.txt
          grep -q Success install-test.txt

          adb shell am force-stop com.veltrix.calculator
          test -z "$(adb shell pidof com.veltrix.calculator 2>/dev/null || true)"
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee cold-launch.txt
          grep -q 'Status: ok' cold-launch.txt
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.veltrix.calculator.*MainActivity'

          INSTRUMENTATION=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          echo "instrumentation=$INSTRUMENTATION" | tee -a runtime-debug.txt
          test -n "$INSTRUMENTATION"

          adb shell am instrument -w -e liveProbe true -e class com.veltrix.calculator.app.LiveCurrencyRuntimeTest "$INSTRUMENTATION" | tee live-currency.txt
          grep -q 'OK (1 test)' live-currency.txt
          ! grep -q 'FAILURES!!!' live-currency.txt

          run_one() {
            local method="$1"
            local file="$2"
            adb shell am instrument -w -e class "com.veltrix.calculator.app.BackendMasterRuntimeTest#${method}" "$INSTRUMENTATION" | tee "$file"
            grep -q 'OK (1 test)' "$file"
            ! grep -q 'FAILURES!!!' "$file"
          }

          run_one aColdLaunchStandardAndScientificProgrammer runtime-calculator-modes.txt
          run_one bRegistrySearchAndMajorSubjects runtime-library-search.txt
          run_one cCurrencyProviderCacheFailureOfflineArchitecture runtime-currency-cache-failure.txt
          run_one dPersistenceSeed runtime-persistence-seed.txt
          run_one eOcrBundledIntegrationAndTextCounts runtime-ocr-text.txt
          run_one fActivityRecreationPreservesDraft runtime-recreation.txt
          run_one hStandaloneWidgetRuntimePaths runtime-widgets.txt

          adb shell am force-stop com.veltrix.calculator
          test -z "$(adb shell pidof com.veltrix.calculator 2>/dev/null || true)"
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee process-relaunch.txt
          grep -q 'Status: ok' process-relaunch.txt
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.veltrix.calculator.*MainActivity'
          run_one zPersistenceAfterProcessRestart runtime-process-persistence.txt

          TASK_ID=$(adb shell dumpsys activity recents | sed -n 's/.*Task{[^#]*#\([0-9][0-9]*\).*com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r' || true)
          echo "task_id=$TASK_ID" | tee multiwindow.txt
          if [ -n "$TASK_ID" ]; then
            if adb shell am task resize "$TASK_ID" 0 0 700 900 >> multiwindow.txt 2>&1; then
              echo 'resize_runtime=VERIFIED' | tee -a multiwindow.txt
              adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.veltrix.calculator.*MainActivity'
            else
              echo 'resize_runtime=NOT_VERIFIED_environment_command_unsupported' | tee -a multiwindow.txt
            fi
          else
            echo 'resize_runtime=NOT_VERIFIED_task_id_unavailable' | tee -a multiwindow.txt
          fi

          adb shell cmd connectivity airplane-mode enable || adb shell settings put global airplane_mode_on 1
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          AIRPLANE=$(adb shell settings get global airplane_mode_on | tr -d '\r')
          echo "airplane_mode=$AIRPLANE" | tee offline-state.txt
          test "$AIRPLANE" = "1"
          run_one gOfflineDeterministicAndGraph runtime-offline-graph.txt

          adb shell pm path com.veltrix.calculator | tee package-path.txt
          grep -q '^package:' package-path.txt

          adb shell cmd connectivity airplane-mode disable || adb shell settings put global airplane_mode_on 0
          adb shell svc wifi enable || true
          sleep 3

          gradle --stacktrace :app:connectedDebugAndroidTest | tee connected-tests.txt
          grep -q 'BUILD SUCCESSFUL' connected-tests.txt

          adb install -r -t "$APP_APK" | tee reinstall-after-connected.txt
          grep -q Success reinstall-after-connected.txt
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee final-relaunch.txt
          grep -q 'Status: ok' final-relaunch.txt
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.veltrix.calculator.*MainActivity'

          adb emu kill || true

      - name: Build provenance chain
        if: always()
        run: |
          SOURCE_SHA=NOT_GENERATED
          APK_SHA=NOT_GENERATED
          TOOL_COUNT=NOT_GENERATED
          [ -f VeltrixCalculator-BackendMaster-tested-source.zip ] && SOURCE_SHA=$(sha256sum VeltrixCalculator-BackendMaster-tested-source.zip | awk '{print $1}')
          APK_PATH=ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
          [ -f "$APK_PATH" ] && APK_SHA=$(sha256sum "$APK_PATH" | awk '{print $1}')
          [ -f ci-project/VeltrixCalculator/core/build/registry-export.tsv ] && TOOL_COUNT=$(tail -n +2 ci-project/VeltrixCalculator/core/build/registry-export.tsv | wc -l)
          {
            echo "commit_sha=${GITHUB_SHA}"
            echo "branch=${GITHUB_REF_NAME}"
            echo "ci_run_id=${GITHUB_RUN_ID}"
            echo "tested_source_sha256=${SOURCE_SHA}"
            echo "generated_apk_sha256=${APK_SHA}"
            echo "registry_tool_count=${TOOL_COUNT}"
            echo "override_sha256=95871f0fd056d877a29fa8c94ec28cf3761656c80fe7b3b5713bd1308c95db54"
          } | tee provenance.txt
          [ -f "$APK_PATH" ] && sha256sum "$APK_PATH" > apk.sha256 || true

      - name: Upload exact tested source, APK, docs and evidence
        id: evidence_upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixCalculator-BackendMaster-evidence
          if-no-files-found: warn
          path: |
            VeltrixCalculator-BackendMaster-tested-source.zip
            source.sha256
            provenance.txt
            apk.sha256
            ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
            ci-project/VeltrixCalculator/core/build/registry-export.tsv
            ci-project/VeltrixCalculator/docs/
            ci-project/VeltrixCalculator/core-tests.txt
            ci-project/VeltrixCalculator/registry-count.txt
            ci-project/VeltrixCalculator/manifest.txt
            ci-project/VeltrixCalculator/emulator.log
            ci-project/VeltrixCalculator/runtime-debug.txt
            ci-project/VeltrixCalculator/install-app.txt
            ci-project/VeltrixCalculator/install-test.txt
            ci-project/VeltrixCalculator/cold-launch.txt
            ci-project/VeltrixCalculator/live-currency.txt
            ci-project/VeltrixCalculator/runtime-calculator-modes.txt
            ci-project/VeltrixCalculator/runtime-library-search.txt
            ci-project/VeltrixCalculator/runtime-currency-cache-failure.txt
            ci-project/VeltrixCalculator/runtime-persistence-seed.txt
            ci-project/VeltrixCalculator/runtime-ocr-text.txt
            ci-project/VeltrixCalculator/runtime-recreation.txt
            ci-project/VeltrixCalculator/runtime-widgets.txt
            ci-project/VeltrixCalculator/runtime-process-persistence.txt
            ci-project/VeltrixCalculator/multiwindow.txt
            ci-project/VeltrixCalculator/offline-state.txt
            ci-project/VeltrixCalculator/runtime-offline-graph.txt
            ci-project/VeltrixCalculator/package-path.txt
            ci-project/VeltrixCalculator/connected-tests.txt
            ci-project/VeltrixCalculator/reinstall-after-connected.txt
            ci-project/VeltrixCalculator/final-relaunch.txt
            ci-project/VeltrixCalculator/core/build/reports/tests/test/
            ci-project/VeltrixCalculator/app/build/reports/androidTests/
            ci-project/VeltrixCalculator/app/build/outputs/androidTest-results/
