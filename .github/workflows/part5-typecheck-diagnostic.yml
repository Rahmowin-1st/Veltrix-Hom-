name: Part5 Typecheck Diagnostic
on:
  push:
    branches: [veltrix-hom-backend-part5-typecheck-diagnostic]
permissions:
  contents: read
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Capture compiler output
        id: tc
        shell: bash
        run: |
          set +e
          npm run typecheck > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: part5-typecheck-diagnostic-${{ github.sha }}
          path: server/typecheck.log
          if-no-files-found: error
      - name: Preserve failure truth
        shell: bash
        run: test "${{ steps.tc.outputs.exit_code }}" = "0"
