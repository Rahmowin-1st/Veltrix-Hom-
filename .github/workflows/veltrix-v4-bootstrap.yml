name: Veltrix V4 Durable Controller

on:
  push:
    branches:
      - veltrix-calculator-backend-v4-reset
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SOURCE_SHA: ${{ github.sha }}
  BASELINE_SHA: 544d7e8f8afefcd8a0a61724a4f3c525078181ce

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Exact source provenance
        run: |
          set -euxo pipefail
          echo "SOURCE_UNDER_TEST=$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" "$SOURCE_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false
      - name: Core compile and unit/regression
        id: core
        working-directory: calculator-v4
        shell: bash
        run: |
          set +e
          gradle --stacktrace :core:test 2>&1 | tee core-test.log
          rc=${PIPESTATUS[0]}
          exit "$rc"
      - name: Persist exact core failure log
        if: failure() && steps.core.outcome == 'failure'
        shell: bash
        run: |
          set -euxo pipefail
          cp calculator-v4/core-test.log .ci-v4-core-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci-v4-core-failure.log
          git commit -m "ci(v4): persist core failure log for diagnosis"
          git push origin HEAD:veltrix-calculator-backend-v4-reset
      - name: Android assemble debug
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -n "$SDK" ]; then
            SM="$(command -v sdkmanager || true)"
            [ -n "$SM" ] || SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            # GitHub-hosted Android runners already have accepted SDK licenses.
            # Do not pipe `yes` under `pipefail`: sdkmanager can exit cleanly
            # after closing stdin, which makes `yes` report SIGPIPE and turns a
            # successful install into a false RED workflow result.
            "$SM" "platforms;android-36" "build-tools;35.0.0" "platform-tools" >/dev/null
          fi
          gradle --stacktrace :app:assembleDebug
