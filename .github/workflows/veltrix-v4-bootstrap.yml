name: Veltrix V4 Durable Controller

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_SHA: ${{ github.sha }}
  BASELINE_SHA: 544d7e8f8afefcd8a0a61724a4f3c525078181ce

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Exact source provenance
        run: |
          set -euxo pipefail
          echo "SOURCE_UNDER_TEST=$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" "$SOURCE_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Core compile and unit/regression
        working-directory: calculator-v4
        shell: bash
        run: |
          set +e
          gradle --stacktrace :core:test 2>&1 | tee core-test.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "### CORE_TEST_FAILURE" >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 core-test.log >> "$GITHUB_STEP_SUMMARY"
            grep -E '(^e:| error: |FAILURE:|What went wrong|Unresolved reference|Cannot infer|Type mismatch)' core-test.log | head -n 20 | while IFS= read -r line; do
              printf '::error::%s\n' "$line"
            done
          fi
          exit "$rc"
      - name: Android assemble debug
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -n "$SDK" ]; then
            SM="$(command -v sdkmanager || true)"
            [ -n "$SM" ] || SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
            yes | "$SM" "platforms;android-36" "build-tools;35.0.0" "platform-tools" >/dev/null
          fi
          gradle --stacktrace :app:assembleDebug
