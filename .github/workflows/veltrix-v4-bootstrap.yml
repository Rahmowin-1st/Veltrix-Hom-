name: Veltrix V4 Durable Controller

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode
        required: true
        default: validate
        type: choice
        options: [validate, reconstruct]
      target_sha:
        description: Exact V4 product source SHA to validate
        required: false
        default: 64f50cb59277b3395dce7a5faec4d2b699cc7f1c
        type: string

permissions:
  contents: write
  actions: read

env:
  VERIFIED_BASELINE_SHA: 544d7e8f8afefcd8a0a61724a4f3c525078181ce
  DEFAULT_V4_SOURCE_SHA: 64f50cb59277b3395dce7a5faec4d2b699cc7f1c

jobs:
  reconstruct:
    if: ${{ inputs.mode == 'reconstruct' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Verify baseline ancestry
        run: git merge-base --is-ancestor "$VERIFIED_BASELINE_SHA" HEAD
      - name: Preflight text-safe V4 payload
        run: |
          set -euxo pipefail
          PAYLOAD=v4-bootstrap/V4Catalog.kt
          test -f "$PAYLOAD"
          test "$(wc -c < "$PAYLOAD")" -eq 84061
          test "$(git hash-object "$PAYLOAD")" = 99c1cf4123cd091e2aeffbbd87f2d8d198348089
          grep -q '^package com.veltrix.calculator.core' "$PAYLOAD"
          grep -q 'EXPECTED_ADDITIONS = 93' "$PAYLOAD"
      - name: Download verified Backend 1.1 tested source artifact
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euxo pipefail
          rm -rf /tmp/v11 /tmp/v11-artifact calculator-v4
          mkdir -p /tmp/v11 /tmp/v11-artifact
          API="repos/${GITHUB_REPOSITORY}/actions/runs/31494970586/artifacts"
          ARTIFACT_ID="$(gh api "$API" --jq '.artifacts[] | select(.name=="VeltrixCalculator-Backend-1.1-FINAL-V5" and .expired==false) | .id' | head -1)"
          test -n "$ARTIFACT_ID"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/v11-artifact/artifact.zip
          unzip -q /tmp/v11-artifact/artifact.zip -d /tmp/v11-artifact/files
          SOURCE_ZIP="$(find /tmp/v11-artifact/files -type f -name 'VeltrixCalculator-Backend-1.1-FINAL-TESTED-SOURCE.zip' -print -quit)"
          test -n "$SOURCE_ZIP"
          echo "4bdd0bdbc493c506c94c11a65f5e47e4637f1587ffe5523c6c50428f9621e0b9  $SOURCE_ZIP" | sha256sum -c -
          unzip -q "$SOURCE_ZIP" -d /tmp/v11
          SOURCE_ROOT="$(find /tmp/v11 -type f -name settings.gradle.kts -printf '%h\n' | head -1)"
          cp -a "$SOURCE_ROOT" calculator-v4
      - name: Apply V4 catalog payload and commit source tree
        run: |
          set -euxo pipefail
          install -D -m 0644 v4-bootstrap/V4Catalog.kt calculator-v4/core/src/main/kotlin/com/veltrix/calculator/core/V4Catalog.kt
          git config user.name veltrix-ci
          git config user.email actions@users.noreply.github.com
          git add calculator-v4
          git diff --cached --quiet && exit 0
          git commit -m 'feat(v4): reconstruct calculator backend source from verified 1.1 baseline'
          git push origin HEAD:veltrix-calculator-backend-v4-reset

  core_validate:
    if: ${{ inputs.mode == 'validate' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions: { contents: read }
    steps:
      - name: Checkout exact V4 source-under-test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || env.DEFAULT_V4_SOURCE_SHA }}
          fetch-depth: 0
      - name: Fail-fast exact-source provenance
        run: |
          set -euxo pipefail
          TARGET="${{ inputs.target_sha || env.DEFAULT_V4_SOURCE_SHA }}"
          echo "SOURCE_UNDER_TEST=$TARGET"
          test "$(git rev-parse HEAD)" = "$TARGET"
          git merge-base --is-ancestor "$VERIFIED_BASELINE_SHA" "$TARGET"
          test -f calculator-v4/settings.gradle.kts
          test -f calculator-v4/core/src/main/kotlin/com/veltrix/calculator/core/V4Catalog.kt
          grep -q 'EXPECTED_ADDITIONS = 93' calculator-v4/core/src/main/kotlin/com/veltrix/calculator/core/V4Catalog.kt
          grep -q '^android.useAndroidX=true' calculator-v4/gradle.properties
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Core compile unit registry regression gates
        working-directory: calculator-v4
        run: gradle --stacktrace :core:test

  android_build:
    if: ${{ inputs.mode == 'validate' }}
    needs: core_validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha || env.DEFAULT_V4_SOURCE_SHA }}
          fetch-depth: 0
      - name: Assert exact source before Android command
        run: |
          set -euxo pipefail
          TARGET="${{ inputs.target_sha || env.DEFAULT_V4_SOURCE_SHA }}"
          echo "SOURCE_UNDER_TEST=$TARGET"
          test "$(git rev-parse HEAD)" = "$TARGET"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Resolve Android SDK
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: |
          set -euxo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"; fi
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools" >/dev/null
      - name: Android debug build
        working-directory: calculator-v4
        run: gradle --stacktrace :app:assembleDebug
