name: Veltrix V4 Durable Controller

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_SHA: 64f50cb59277b3395dce7a5faec4d2b699cc7f1c
  BASELINE_SHA: 544d7e8f8afefcd8a0a61724a4f3c525078181ce

jobs:
  diagnose_core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Assert exact provenance
        run: |
          set -euxo pipefail
          echo "SOURCE_UNDER_TEST=$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" "$SOURCE_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile core and capture exact log
        id: compile
        working-directory: calculator-v4
        shell: bash
        run: |
          set +e
          gradle --stacktrace :core:compileKotlin > /tmp/v4-core-compile.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Emit exact compiler diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "Compiler exit=${{ steps.compile.outputs.exit_code }}"
          grep -E '(^e: |error: |Unresolved reference|Cannot access|Type mismatch|No value passed|Too many arguments|Conflicting overloads|Redeclaration|Compilation error)' /tmp/v4-core-compile.log | tail -80 | while IFS= read -r line; do
            line=${line//'%'/'%25'}
            line=${line//$'\r'/'%0D'}
            line=${line//$'\n'/'%0A'}
            echo "::error title=V4 compiler::$line"
          done || true
          tail -120 /tmp/v4-core-compile.log
      - name: Fail on compiler error
        if: ${{ steps.compile.outputs.exit_code != '0' }}
        run: exit 1
