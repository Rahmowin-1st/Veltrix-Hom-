name: Veltrix V4 Durable Controller

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SOURCE_SHA: 64f50cb59277b3395dce7a5faec4d2b699cc7f1c
  BASELINE_SHA: 544d7e8f8afefcd8a0a61724a4f3c525078181ce

jobs:
  diagnose_core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Assert exact provenance
        run: |
          set -euxo pipefail
          echo "SOURCE_UNDER_TEST=$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" "$SOURCE_SHA"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Compile core and capture exact log
        id: compile
        working-directory: calculator-v4
        shell: bash
        run: |
          set +e
          gradle --stacktrace :core:compileKotlin > /tmp/v4-core-compile.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          tail -200 /tmp/v4-core-compile.log
          exit 0
      - name: Persist diagnostic log to V4 branch
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin veltrix-calculator-backend-v4-reset
          git checkout -B ci-diagnostics origin/veltrix-calculator-backend-v4-reset
          mkdir -p .ci
          cp /tmp/v4-core-compile.log .ci/v4-core-compile.log
          printf '%s\n' "source=$SOURCE_SHA" "run=${{ github.run_id }}" "exit_code=${{ steps.compile.outputs.exit_code }}" > .ci/v4-core-compile.meta
          git config user.name veltrix-ci
          git config user.email actions@users.noreply.github.com
          git add .ci/v4-core-compile.log .ci/v4-core-compile.meta
          git commit -m 'ci(v4): persist exact core compile diagnostics' || true
          git push origin HEAD:veltrix-calculator-backend-v4-reset
      - name: Fail on compiler error
        if: ${{ steps.compile.outputs.exit_code != '0' }}
        run: exit 1
