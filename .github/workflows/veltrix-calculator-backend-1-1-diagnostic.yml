name: Veltrix Calculator Backend 1.1 Diagnostic

on:
  push:
    branches: [ veltrix-calculator-backend-1.1 ]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat ci/iteration11-v3/part-00 ci/iteration11-v3/part-01 ci/iteration11-v3/part-02 ci/iteration11-v3/part-03 > patch.b64
          test "$(wc -c < patch.b64)" -eq 56440
          base64 -d patch.b64 > patch.zip
          echo "ad9648682e0f3aa4b2eeaa013f72b2cb20f51d2aec56638186234b34090d7a51  patch.zip" | sha256sum -c -
          echo "00c3b17e790b3af0a75ef4b4e940cf67d79fd8515a116b0aa59b2a9ee4ffedf7  ci/iteration11-fixes/android-compile-fix.patch" | sha256sum -c -
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9097731825/zip > parent.zip
          unzip -q parent.zip -d parent
          mkdir ci-project
          unzip -q parent/VeltrixCalculator-BackendMaster-COMPLETE-tested-source.zip -d ci-project
          unzip -qo patch.zip -d ci-project/VeltrixCalculator
          (cd ci-project/VeltrixCalculator && patch -p0 < ../../ci/iteration11-fixes/android-compile-fix.patch)
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Capture Android build
        working-directory: ci-project/VeltrixCalculator
        shell: bash
        run: |
          set +e
          gradle --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest 2>&1 | tee build-diagnostic.txt
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" | tee build-exit.txt
          exit $code
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixCalculator-Backend-1.1-build-diagnostic
          path: |
            ci-project/VeltrixCalculator/build-diagnostic.txt
            ci-project/VeltrixCalculator/build-exit.txt
            ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
