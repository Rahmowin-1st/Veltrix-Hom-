name: Veltrix V4 Final Clean Proof

on:
  push:
    branches:
      - veltrix-calculator-backend-v4-reset
    paths:
      - 'calculator-v4/docs/V4_FINAL_GATE_READY'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  SOURCE_SHA: ${{ github.sha }}
  BASELINE_SHA: 544d7e8f8afefcd8a0a61724a4f3c525078181ce
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd

jobs:
  final-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Exact source and acceptance preflight
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" "$SOURCE_SHA"
          test -f calculator-v4/docs/V4_FINAL_GATE_READY
          for file in \
            CURRICULUM_SOURCE_MAP.md PHYSICS_GRADE_8_FULL_MAP.tsv PHYSICS_GRADE_9_FULL_MAP.tsv \
            PHYSICS_GRADE_10_FULL_MAP.tsv PHYSICS_GRADE_11_FULL_MAP.tsv PHYSICS_ADVANCED_MAP.tsv \
            NAVIGATION_ARCHITECTURE.md LIBRARY_CATALOG_VNEXT.md SUBJECT_RESEARCH_MAP.md \
            SUBJECT_COVERAGE_MATRIX.tsv SOLVE_TARGET_MATRIX.tsv CONVERTER_CATALOG_VNEXT.md \
            WIDGET_PRODUCT_SPEC.md MIGRATION_REPORT.md TEST_REPORT.md \
            VERIFIED_CLAIMED_NOT_VERIFIED.md FRONTEND_HANDOFF_VNEXT.md; do
            test -s "calculator-v4/docs/$file"
          done
          ! grep -R -n -E 'class[[:space:]]+(LiquidGlass|MainBrain|ControlSpace)|object[[:space:]]+(LiquidGlass|MainBrain|ControlSpace)' calculator-v4/app/src/main calculator-v4/core/src/main
          printf 'repo=Rahmowin-1st/Veltrix-Hom-\nbranch=veltrix-calculator-backend-v4-reset\nsource_sha=%s\nbaseline_sha=%s\nrun_id=%s\njob=%s\n' "$SOURCE_SHA" "$BASELINE_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB" | tee final-provenance.txt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: true

      - name: Clean deterministic core and Android build
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          gradle --stacktrace clean :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          test -s "$APP_APK"
          test -s "$TEST_APK"
          test -s core/build/registry-export.tsv
          test -s core/build/subject-coverage-matrix.tsv
          test -s core/build/solve-target-matrix.tsv
          test "$(tail -n +3 core/build/registry-export.tsv | wc -l)" -eq 260
          sha256sum "$APP_APK" "$TEST_APK" core/build/registry-export.tsv core/build/subject-coverage-matrix.tsv core/build/solve-target-matrix.tsv | tee ../final-build-hashes.sha256
          cp core/build/registry-export.tsv ../final-registry-export.tsv
          cp core/build/subject-coverage-matrix.tsv ../final-generated-subject-coverage-matrix.tsv
          cp core/build/solve-target-matrix.tsv ../final-generated-solve-target-matrix.tsv
          diff -u docs/SUBJECT_COVERAGE_MATRIX.tsv ../final-generated-subject-coverage-matrix.tsv
          diff -u docs/SOLVE_TARGET_MATRIX.tsv ../final-generated-solve-target-matrix.tsv

      - name: Install exact Android SDK runtime
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SM="$(command -v sdkmanager || true)"
          [ -n "$SM" ] || SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          "$SM" "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
          for directory in "$SDK/platform-tools" "$SDK/emulator" "$(dirname "$SM")" "$SDK/build-tools/35.0.0"; do
            test -d "$directory"
            printf '%s\n' "$directory" >> "$GITHUB_PATH"
          done
          "$SM" --list_installed > final-sdk-installed.txt

      - name: Boot clean API 35 emulator
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_v4_final_api35 -k "system-images;android-35;google_apis;x86_64" -f
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_v4_final_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > final-emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb devices -l | tee final-device.txt
          adb shell settings put secure show_ime_with_hard_keyboard 1
          adb shell wm dismiss-keyguard || true

      - name: Install and cold-launch exact APK
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP_APK" | tee ../final-install-app.txt
          adb install -r -t "$TEST_APK" | tee ../final-install-test.txt
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee ../final-cold-launch.txt
          grep -q 'Status: ok' ../final-cold-launch.txt
          sleep 1
          adb shell uiautomator dump /sdcard/final-home.xml
          adb pull /sdcard/final-home.xml ../final-home.xml
          grep -q 'content-desc="route-home"' ../final-home.xml

      - name: NAV-01 through NAV-25 and system IME runtime
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$I"
          adb shell am instrument -w -e class com.veltrix.calculator.app.V4NavigationRuntimeTest "$I" | tee ../final-navigation-runtime.txt
          grep -q 'OK (' ../final-navigation-runtime.txt
          ! grep -q 'FAILURES!!!' ../final-navigation-runtime.txt

      - name: Four widget families, five tiers and multi-instance runtime
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          adb shell am instrument -w -e class com.veltrix.calculator.app.V4WidgetRuntimeTest "$I" | tee ../final-widget-runtime.txt
          grep -q 'OK (12 tests)' ../final-widget-runtime.txt
          ! grep -q 'FAILURES!!!' ../final-widget-runtime.txt
          adb shell dumpsys appwidget > ../final-appwidget.txt
          for provider in MiniCalculatorWidgetProvider QuickConverterWidgetProvider CurrencyConverterWidgetProvider CurrencyRateBoardWidgetProvider; do
            grep -q "$provider" ../final-appwidget.txt
          done

      - name: Full backend runtime and currency resilience
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          adb shell am instrument -w -e class com.veltrix.calculator.app.BackendMasterRuntimeTest "$I" | tee ../final-backend-runtime.txt
          grep -q 'OK (' ../final-backend-runtime.txt
          adb shell am instrument -w -e class com.veltrix.calculator.app.Iteration11CurrencyRuntimeTest "$I" | tee ../final-currency-runtime.txt
          grep -q 'OK (2 tests)' ../final-currency-runtime.txt

      - name: Real process-death restoration
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.BackendMasterRuntimeTest#dPersistenceSeed' "$I" | tee ../final-persist-seed.txt
          grep -q 'OK (1 test)' ../final-persist-seed.txt
          adb shell am force-stop com.veltrix.calculator
          test -z "$(adb shell pidof com.veltrix.calculator 2>/dev/null | tr -d '\r')"
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.BackendMasterRuntimeTest#zPersistenceAfterProcessRestart' "$I" | tee ../final-persist-after.txt
          grep -q 'OK (1 test)' ../final-persist-after.txt
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.V4WidgetRuntimeTest#kPersistenceSeedForRealProcessRestart' "$I" | tee ../final-widget-persist-seed.txt
          grep -q 'OK (1 test)' ../final-widget-persist-seed.txt
          adb shell am force-stop com.veltrix.calculator
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.V4WidgetRuntimeTest#yPersistenceAfterRealProcessRestart' "$I" | tee ../final-widget-persist-after.txt
          grep -q 'OK (1 test)' ../final-widget-persist-after.txt

      - name: Real tool and converter process-death routes
        run: |
          set -euxo pipefail
          restore_after_kill() {
            local name="$1" uri="$2" detail="$3" parent="$4"
            adb shell am force-stop com.veltrix.calculator
            adb shell am start -W -a android.intent.action.VIEW -d "'$uri'" com.veltrix.calculator | tee "final-process-${name}-launch.txt"
            grep -q 'Status: ok' "final-process-${name}-launch.txt"
            sleep 1
            adb shell uiautomator dump "/sdcard/${name}-before.xml"
            adb pull "/sdcard/${name}-before.xml" "final-${name}-before.xml"
            grep -q "content-desc=\"${detail}\"" "final-${name}-before.xml"
            adb shell input keyevent KEYCODE_HOME
            adb shell am kill com.veltrix.calculator
            for i in $(seq 1 40); do [ -z "$(adb shell pidof com.veltrix.calculator 2>/dev/null | tr -d '\r')" ] && break; sleep 0.25; done
            test -z "$(adb shell pidof com.veltrix.calculator 2>/dev/null | tr -d '\r')"
            adb shell am start -W --activity-reorder-to-front -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee "final-process-${name}-restore.txt"
            sleep 1
            adb shell uiautomator dump "/sdcard/${name}-after.xml"
            adb pull "/sdcard/${name}-after.xml" "final-${name}-after.xml"
            grep -q "content-desc=\"${detail}\"" "final-${name}-after.xml"
            adb shell input keyevent KEYCODE_BACK
            sleep 1
            adb shell uiautomator dump "/sdcard/${name}-parent.xml"
            adb pull "/sdcard/${name}-parent.xml" "final-${name}-parent.xml"
            grep -q "content-desc=\"${parent}\"" "final-${name}-parent.xml"
          }
          restore_after_kill tool 'veltrix://tool/physics-ohms-law' 'route-tool-physics-ohms-law' 'route-workspace-library'
          restore_after_kill converter 'veltrix://converter/Length' 'route-converter-detail' 'route-workspace-converters'

      - name: Measured cold-launch performance and no-freeze smoke
        run: |
          set -euxo pipefail
          adb logcat -c
          : > final-startup-samples.tsv
          printf 'sample\ttotalTimeMs\n' >> final-startup-samples.tsv
          for i in $(seq 1 10); do
            adb shell am force-stop com.veltrix.calculator
            OUT=$(adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity)
            TIME=$(printf '%s\n' "$OUT" | awk -F': ' '/TotalTime:/{print $2}' | tr -d '\r')
            test -n "$TIME"
            test "$TIME" -gt 0
            printf '%s\t%s\n' "$i" "$TIME" >> final-startup-samples.tsv
          done
          awk 'NR>1{sum+=$2; if(min==0||$2<min)min=$2; if($2>max)max=$2} END{printf "samples=%d\nmin_ms=%d\navg_ms=%.1f\nmax_ms=%d\n",NR-1,min,sum/(NR-1),max}' final-startup-samples.tsv | tee final-performance-summary.txt
          adb logcat -d -v threadtime > final-performance-logcat.txt
          ! grep -E 'ANR in com\.veltrix\.calculator|FATAL EXCEPTION:.*com\.veltrix\.calculator' final-performance-logcat.txt

      - name: Final uninstall reinstall relaunch proof
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          adb uninstall com.veltrix.calculator | tee ../final-uninstall.txt
          grep -q 'Success' ../final-uninstall.txt
          adb install -t "$APP_APK" | tee ../final-reinstall.txt
          grep -q 'Success' ../final-reinstall.txt
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee ../final-relaunch.txt
          grep -q 'Status: ok' ../final-relaunch.txt
          sleep 1
          adb shell uiautomator dump /sdcard/final-relaunch.xml
          adb pull /sdcard/final-relaunch.xml ../final-relaunch.xml
          grep -q 'content-desc="route-home"' ../final-relaunch.xml

      - name: Package exact source APK evidence and handoff
        run: |
          set -euxo pipefail
          mkdir -p final-handoff/evidence final-handoff/docs
          git archive --format=zip --output=final-handoff/VeltrixCalculator-V4-FINAL-TESTED-SOURCE.zip "$SOURCE_SHA" calculator-v4 .github/workflows/veltrix-v4-final-clean.yml
          cp calculator-v4/app/build/outputs/apk/debug/app-debug.apk final-handoff/VeltrixCalculator-V4-FINAL.apk
          cp final-provenance.txt final-build-hashes.sha256 final-registry-export.tsv final-generated-subject-coverage-matrix.tsv final-generated-solve-target-matrix.tsv final-handoff/evidence/
          cp final-*.txt final-*.xml final-*.tsv final-handoff/evidence/ 2>/dev/null || true
          cp calculator-v4/docs/{NAVIGATION_ARCHITECTURE.md,LIBRARY_CATALOG_VNEXT.md,SUBJECT_RESEARCH_MAP.md,SUBJECT_COVERAGE_MATRIX.tsv,SOLVE_TARGET_MATRIX.tsv,CONVERTER_CATALOG_VNEXT.md,WIDGET_PRODUCT_SPEC.md,MIGRATION_REPORT.md,TEST_REPORT.md,VERIFIED_CLAIMED_NOT_VERIFIED.md,FRONTEND_HANDOFF_VNEXT.md,CURRICULUM_SOURCE_MAP.md,PHYSICS_GRADE_8_FULL_MAP.tsv,PHYSICS_GRADE_9_FULL_MAP.tsv,PHYSICS_GRADE_10_FULL_MAP.tsv,PHYSICS_GRADE_11_FULL_MAP.tsv,PHYSICS_ADVANCED_MAP.tsv} final-handoff/docs/
          (cd final-handoff/evidence && zip -qr ../VeltrixCalculator-V4-FINAL-GREEN-EVIDENCE.zip .)
          cat > final-handoff/FINAL_HANDOFF_INDEX.md <<EOF
          # Veltrix Calculator Backend V4 — Final Handoff Index
          repo=Rahmowin-1st/Veltrix-Hom-
          branch=veltrix-calculator-backend-v4-reset
          exact_final_commit=$SOURCE_SHA
          ci_run_id=$GITHUB_RUN_ID
          job=$GITHUB_JOB
          artifact_name=veltrix-v4-final-handoff-$SOURCE_SHA
          registry_tools=260
          final_gate=GREEN_IF_THIS_ARTIFACT_EXISTS
          EOF
          (cd final-handoff && sha256sum VeltrixCalculator-V4-FINAL.apk VeltrixCalculator-V4-FINAL-TESTED-SOURCE.zip VeltrixCalculator-V4-FINAL-GREEN-EVIDENCE.zip docs/* > SHA256SUMS.txt)
          sha256sum -c final-handoff/SHA256SUMS.txt
          test -s final-handoff/VeltrixCalculator-V4-FINAL.apk
          test -s final-handoff/VeltrixCalculator-V4-FINAL-TESTED-SOURCE.zip
          test -s final-handoff/VeltrixCalculator-V4-FINAL-GREEN-EVIDENCE.zip
          git status --porcelain | tee final-worktree.txt
          test ! -s final-worktree.txt

      - name: Upload exact final handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-v4-final-handoff-${{ env.SOURCE_SHA }}
          retention-days: 90
          if-no-files-found: error
          path: final-handoff/

      - name: Stop emulator
        if: always()
        run: adb emu kill || true
