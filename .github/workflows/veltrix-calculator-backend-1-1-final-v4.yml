name: Veltrix Calculator Backend 1.1 FINAL V4

on:
  push:
    branches: [ veltrix-calculator-backend-1.1 ]
    paths:
      - '.github/workflows/veltrix-calculator-backend-1-1-final-v4.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact V3-tested source and deterministic previous-regression fix
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9101938708/zip > v3-artifact.zip
          unzip -q v3-artifact.zip -d v3-artifact
          test -f v3-artifact/VeltrixCalculator-Backend-1.1-TESTED-SOURCE.zip
          echo "89f878b5fe717580cfeeca01b027f1d2e99668e3d7f9353078c47f4b865eb95b  v3-artifact/VeltrixCalculator-Backend-1.1-TESTED-SOURCE.zip" | sha256sum -c -
          mkdir ci-project
          unzip -q v3-artifact/VeltrixCalculator-Backend-1.1-TESTED-SOURCE.zip -d ci-project
          test -d ci-project/VeltrixCalculator
          echo "63bb66db00c869c6f9b6594752f7d72f653c3bca920821a8677e19f930278aaf  ci/iteration11-fixes/backend-master-order-fix.patch" | sha256sum -c -
          (cd ci-project/VeltrixCalculator && patch --dry-run -p0 < ../../ci/iteration11-fixes/backend-master-order-fix.patch)
          (cd ci-project/VeltrixCalculator && patch -p0 < ../../ci/iteration11-fixes/backend-master-order-fix.patch)
          grep -q '@FixMethodOrder(MethodSorters.NAME_ASCENDING)' ci-project/VeltrixCalculator/app/src/androidTest/kotlin/com/veltrix/calculator/app/BackendMasterRuntimeTest.kt
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/veltrix-i11-avd" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Install Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64"

      - name: Real currency provider live probe
        run: |
          set -euo pipefail
          curl -fsS --retry 3 --retry-all-errors --connect-timeout 5 --max-time 20 https://api.frankfurter.dev/v2/rate/USD/EUR | tee frankfurter-runner.json
          python3 - <<'PY'
          import json
          d=json.load(open('frankfurter-runner.json'))
          assert d['base']=='USD' and d['quote']=='EUR'
          assert float(d['rate']) > 0 and d['date']
          print('live-provider=PASS')
          PY

      - name: Core unit tests and canonical registry regression
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stacktrace :core:test | tee core-tests.txt
          grep -q 'BUILD SUCCESSFUL' core-tests.txt
          test -s core/build/registry-export.tsv
          TOOLS=$(tail -n +3 core/build/registry-export.tsv | wc -l)
          SUBJECTS=$(tail -n +3 core/build/registry-export.tsv | cut -f3 | sort -u | wc -l)
          printf 'registry_tool_count=%s\nregistry_subject_count=%s\n' "$TOOLS" "$SUBJECTS" | tee registry-count.txt
          test "$TOOLS" -eq 104
          test "$SUBJECTS" -eq 9

      - name: Compile app APK and Android instrumentation APK
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest | tee android-compile.txt
          grep -q 'BUILD SUCCESSFUL' android-compile.txt
          test -s app/build/outputs/apk/debug/app-debug.apk
          find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f -size +0c | grep -q .

      - name: Static Android contracts
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          apkanalyzer manifest print "$APK" | tee manifest.txt
          grep -q 'com.veltrix.calculator' manifest.txt
          grep -qi 'resizeableActivity="true"' manifest.txt
          grep -q 'VeltrixToolWidgetProvider' manifest.txt
          grep -q 'WidgetConfigActivity' manifest.txt
          ! grep -q 'android.permission.SYSTEM_ALERT_WINDOW' manifest.txt

      - name: Boot Android emulator and verify ADB
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_i11_api35 -k "system-images;android-35;google_apis;x86_64" -f
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_i11_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > emulator.log 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break
            sleep 2
          done
          BOOT=$(adb shell getprop sys.boot_completed | tr -d '\r')
          printf 'boot_completed=%s\n' "$BOOT" | tee runtime-debug.txt
          test "$BOOT" = "1"
          adb devices -l | tee -a runtime-debug.txt
          adb get-state | tr -d '\r' | grep -Fx device

      - name: APK install and cold launch
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP_APK" | tee install-app.txt
          grep -q Success install-app.txt
          adb install -r -t "$TEST_APK" | tee install-test.txt
          grep -q Success install-test.txt
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee cold-launch.txt
          grep -q 'Status: ok' cold-launch.txt

      - name: Standalone widget interaction runtime 11 of 11
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          test -n "$I"
          adb shell am force-stop com.veltrix.calculator
          adb shell am instrument -w -e class com.veltrix.calculator.app.Iteration11WidgetRuntimeTest "$I" | tee widget-interaction.txt
          grep -q 'OK (11 tests)' widget-interaction.txt
          ! grep -q 'FAILURES!!!' widget-interaction.txt

      - name: Currency freshness runtime cache stale retry active and live
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          adb shell am instrument -w -e class com.veltrix.calculator.app.Iteration11CurrencyRuntimeTest "$I" | tee currency-runtime.txt
          grep -q 'OK (2 tests)' currency-runtime.txt
          ! grep -q 'FAILURES!!!' currency-runtime.txt
          adb shell am instrument -w -e liveProbe true -e class com.veltrix.calculator.app.LiveCurrencyRuntimeTest "$I" | tee live-currency.txt
          grep -q 'OK (1 test)' live-currency.txt
          ! grep -q 'FAILURES!!!' live-currency.txt

      - name: Widget state real process death and restart
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#iPersistenceSeedForRealProcessRestart' "$I" | tee widget-persist-seed.txt
          grep -q 'OK (1 test)' widget-persist-seed.txt
          adb shell am force-stop com.veltrix.calculator
          test -z "$(adb shell pidof com.veltrix.calculator 2>/dev/null || true)"
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.Iteration11WidgetRuntimeTest#yPersistenceAfterRealProcessRestart' "$I" | tee widget-persist-after.txt
          grep -q 'OK (1 test)' widget-persist-after.txt

      - name: Backend Master history adaptive and config real process restart
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.BackendMasterRuntimeTest#dPersistenceSeed' "$I" | tee backend-persist-seed.txt
          grep -q 'OK (1 test)' backend-persist-seed.txt
          adb shell am force-stop com.veltrix.calculator
          test -z "$(adb shell pidof com.veltrix.calculator 2>/dev/null || true)"
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.BackendMasterRuntimeTest#zPersistenceAfterProcessRestart' "$I" | tee backend-persist-after.txt
          grep -q 'OK (1 test)' backend-persist-after.txt
          ! grep -q 'FAILURES!!!' backend-persist-after.txt

      - name: Native multi-window resize runtime
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee multiwindow-launch.txt
          TASK_ID=$(adb shell dumpsys activity recents | sed -n 's/.*Task{[^#]*#\([0-9][0-9]*\).*com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r' || true)
          printf 'task_id=%s\n' "$TASK_ID" | tee multiwindow.txt
          test -n "$TASK_ID"
          adb shell am task resize "$TASK_ID" 0 0 700 900 | tee -a multiwindow.txt
          adb shell dumpsys activity activities | grep -q 'com.veltrix.calculator.*MainActivity'
          echo 'resize_runtime=VERIFIED' | tee -a multiwindow.txt

      - name: Offline deterministic calculations and graph
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          adb shell cmd connectivity airplane-mode enable || adb shell settings put global airplane_mode_on 1
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          AIR=$(adb shell settings get global airplane_mode_on | tr -d '\r')
          printf 'airplane_mode=%s\n' "$AIR" | tee offline-state.txt
          test "$AIR" = "1"
          adb shell am instrument -w -e class 'com.veltrix.calculator.app.BackendMasterRuntimeTest#gOfflineDeterministicAndGraph' "$I" | tee offline-graph.txt
          grep -q 'OK (1 test)' offline-graph.txt
          adb shell pm path com.veltrix.calculator | tee package-path.txt
          grep -q '^package:' package-path.txt
          adb shell cmd connectivity airplane-mode disable || adb shell settings put global airplane_mode_on 0
          adb shell svc wifi enable || true
          sleep 5

      - name: Full previous plus Iteration 1.1 connected regression
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          gradle --stacktrace :app:connectedDebugAndroidTest | tee connected-tests.txt
          grep -q 'BUILD SUCCESSFUL' connected-tests.txt
          ! grep -q 'FAILURES!!!' connected-tests.txt

      - name: Reinstall and final relaunch
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          adb install -r -t "$APK" | tee reinstall.txt
          grep -q Success reinstall.txt
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee final-relaunch.txt
          grep -q 'Status: ok' final-relaunch.txt
          adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.veltrix.calculator.*MainActivity'

      - name: Finalize test report and exact tested source
        working-directory: ci-project/VeltrixCalculator
        run: |
          set -euo pipefail
          cat >> docs/TEST_REPORT.md <<EOF

          ## Backend Iteration 1.1 Final Android Gate
          - CI run: ${GITHUB_RUN_ID}
          - Commit: ${GITHUB_SHA}
          - Branch: ${GITHUB_REF_NAME}
          - Core unit tests: PASS
          - Canonical registry: 104 tools / 9 subjects PASS
          - Android app + instrumentation compile: PASS
          - Emulator boot + ADB: PASS
          - APK install + cold launch: PASS
          - Standalone widget interaction: 11/11 PASS
          - Currency cache/stale/retry/active refresh: PASS
          - Real Frankfurter provider probe: PASS
          - Widget real process-death persistence: PASS
          - Backend Master history/adaptive/config process restart: PASS
          - Offline deterministic + graph: PASS
          - Native multi-window resize: PASS
          - Full connected regression: PASS
          - Reinstall + final relaunch: PASS
          - Physical OEM floating-window behavior: NOT VERIFIED
          - Physical camera quality: NOT VERIFIED
          - Play Store release signing: NOT VERIFIED
          EOF
          sed -i 's/^          //' docs/TEST_REPORT.md
          cat > docs/FINAL_GATE_1_1.md <<EOF
          # Veltrix Calculator Backend 1.1 Final Gate

          VERIFIED by GitHub Actions run ${GITHUB_RUN_ID} on commit ${GITHUB_SHA}.
          Both Backend Iteration 1.1 blockers and the full previous Android regression passed on the Android emulator gate.
          Physical OEM floating-window behavior, physical camera quality, and Play Store release signing remain NOT VERIFIED for the stated physical/release reasons.
          EOF
          sed -i 's/^          //' docs/FINAL_GATE_1_1.md
          cd ..
          zip -qr ../../VeltrixCalculator-Backend-1.1-FINAL-TESTED-SOURCE.zip VeltrixCalculator
          cd ..
          sha256sum VeltrixCalculator-Backend-1.1-FINAL-TESTED-SOURCE.zip | tee tested-source.sha256

      - name: Package APK checksums evidence and provenance
        if: always()
        run: |
          set -euo pipefail
          mkdir -p evidence
          cp -f frankfurter-runner.json emulator.log runtime-debug.txt tested-source.sha256 evidence/ 2>/dev/null || true
          cp -f ci/iteration11-fixes/backend-master-order-fix.patch evidence/ 2>/dev/null || true
          cp -f ci-project/VeltrixCalculator/{core-tests.txt,registry-count.txt,android-compile.txt,manifest.txt,install-app.txt,install-test.txt,cold-launch.txt,widget-interaction.txt,currency-runtime.txt,live-currency.txt,widget-persist-seed.txt,widget-persist-after.txt,backend-persist-seed.txt,backend-persist-after.txt,multiwindow-launch.txt,multiwindow.txt,offline-state.txt,offline-graph.txt,package-path.txt,connected-tests.txt,reinstall.txt,final-relaunch.txt} evidence/ 2>/dev/null || true
          cp -rf ci-project/VeltrixCalculator/docs evidence/docs 2>/dev/null || true
          APK=ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
          SOURCE_SHA=NOT_GENERATED; APK_SHA=NOT_GENERATED; TOOLS=NOT_GENERATED; SUBJECTS=NOT_GENERATED
          [ -f VeltrixCalculator-Backend-1.1-FINAL-TESTED-SOURCE.zip ] && SOURCE_SHA=$(sha256sum VeltrixCalculator-Backend-1.1-FINAL-TESTED-SOURCE.zip | awk '{print $1}')
          [ -f "$APK" ] && APK_SHA=$(sha256sum "$APK" | awk '{print $1}')
          [ -f ci-project/VeltrixCalculator/core/build/registry-export.tsv ] && TOOLS=$(tail -n +3 ci-project/VeltrixCalculator/core/build/registry-export.tsv | wc -l)
          [ -f ci-project/VeltrixCalculator/core/build/registry-export.tsv ] && SUBJECTS=$(tail -n +3 ci-project/VeltrixCalculator/core/build/registry-export.tsv | cut -f3 | sort -u | wc -l)
          printf 'commit_sha=%s\nbranch=%s\nci_run_id=%s\nv3_parent_source_sha256=%s\nbackend_master_order_fix_sha256=%s\nfinal_tested_source_sha256=%s\nruntime_apk_sha256=%s\nregistry_tool_count=%s\nregistry_subject_count=%s\n' "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" '89f878b5fe717580cfeeca01b027f1d2e99668e3d7f9353078c47f4b865eb95b' '63bb66db00c869c6f9b6594752f7d72f653c3bca920821a8677e19f930278aaf' "$SOURCE_SHA" "$APK_SHA" "$TOOLS" "$SUBJECTS" | tee provenance.txt
          [ -f "$APK" ] && sha256sum "$APK" > apk.sha256 || true
          cp -f provenance.txt apk.sha256 tested-source.sha256 evidence/ 2>/dev/null || true
          (cd evidence && zip -qr ../VeltrixCalculator-Backend-1.1-FINAL-EVIDENCE.zip .)

      - name: Stop emulator
        if: always()
        run: adb emu kill || true

      - name: Upload Backend 1.1 final artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VeltrixCalculator-Backend-1.1-FINAL-V4
          if-no-files-found: error
          path: |
            VeltrixCalculator-Backend-1.1-FINAL-TESTED-SOURCE.zip
            VeltrixCalculator-Backend-1.1-FINAL-EVIDENCE.zip
            tested-source.sha256
            apk.sha256
            provenance.txt
            ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
            ci-project/VeltrixCalculator/core/build/registry-export.tsv
            ci-project/VeltrixCalculator/docs/
