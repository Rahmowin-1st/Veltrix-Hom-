name: Veltrix Calculator I2 Gate
on:
  push:
    branches: [ veltrix-calculator-i2 ]
  workflow_dispatch:
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source archive
        run: |
          cat veltrix-chunks/chunk_* > source.b64
          base64 -d source.b64 > veltrix-source.zip
          echo "da40c39fd22d19d2686d8702ea36b64ef0f6af87506fd2ea6f51232b1f59e6dd  veltrix-source.zip" | sha256sum -c -
          unzip -t veltrix-source.zip
          unzip -q veltrix-source.zip -d ci-project
          cp ci-overrides/RuntimeGateTest.kt ci-project/VeltrixCalculator/app/src/androidTest/kotlin/com/veltrix/calculator/app/RuntimeGateTest.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Core regression
        working-directory: ci-project/VeltrixCalculator
        run: gradle --stacktrace :core:test
      - name: Build APK
        working-directory: ci-project/VeltrixCalculator
        run: gradle --stacktrace :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Runtime gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            cd ci-project/VeltrixCalculator
            set -euxo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.veltrix.calculator
            adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee runtime-launch.txt
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -5 | tee -a runtime-launch.txt
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            gradle --stacktrace :app:connectedDebugAndroidTest
            adb shell pm path com.veltrix.calculator | tee -a runtime-launch.txt
            adb shell am force-stop com.veltrix.calculator
            adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee -a runtime-launch.txt
      - name: Checksum
        if: always()
        working-directory: ci-project/VeltrixCalculator
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VeltrixCalculator-I2-evidence
          path: |
            ci-project/VeltrixCalculator/app/build/outputs/apk/debug/app-debug.apk
            ci-project/VeltrixCalculator/app-debug.apk.sha256
            ci-project/VeltrixCalculator/runtime-launch.txt
            ci-project/VeltrixCalculator/core/build/reports/tests/test/
            ci-project/VeltrixCalculator/app/build/reports/androidTests/
            ci-project/VeltrixCalculator/app/build/outputs/androidTest-results/
