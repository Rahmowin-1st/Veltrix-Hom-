name: Veltrix Calculator Android Gate
on:
  workflow_dispatch:
  push:
    branches: [ main, veltrix-calculator-i2 ]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools" >/dev/null
      - name: Core regression suite
        run: gradle --stacktrace :core:test
      - name: Build installable debug APK
        run: gradle --stacktrace :app:assembleDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android runtime gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            set -euxo pipefail
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.veltrix.calculator
            adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee runtime-launch.txt
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -5 | tee -a runtime-launch.txt
            adb shell svc wifi disable || true
            adb shell svc data disable || true
            gradle --stacktrace :app:connectedDebugAndroidTest
            adb shell pm path com.veltrix.calculator | tee -a runtime-launch.txt
            adb shell am force-stop com.veltrix.calculator
            adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee -a runtime-launch.txt
      - name: Checksums
        if: always()
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app-debug.apk.sha256 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VeltrixCalculator-I2-evidence
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app-debug.apk.sha256
            runtime-launch.txt
            core/build/reports/tests/test/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
