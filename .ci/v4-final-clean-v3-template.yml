name: Veltrix V4 Final Clean Proof V3

on:
  push:
    branches:
      - veltrix-calculator-backend-v4-reset
    paths:
      - 'calculator-v4/docs/V4_FINAL_GATE_READY'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

env:
  SOURCE_SHA: ${{ github.sha }}
  BASELINE_SHA: 544d7e8f8afefcd8a0a61724a4f3c525078181ce
  ANDROID_AVD_HOME: ${{ github.workspace }}/.android/avd

jobs:
  final-clean-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Exact source and acceptance preflight
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$BASELINE_SHA" "$SOURCE_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          for file in NAVIGATION_ARCHITECTURE.md LIBRARY_CATALOG_VNEXT.md SUBJECT_RESEARCH_MAP.md SUBJECT_COVERAGE_MATRIX.tsv SOLVE_TARGET_MATRIX.tsv CONVERTER_CATALOG_VNEXT.md WIDGET_PRODUCT_SPEC.md MIGRATION_REPORT.md TEST_REPORT.md VERIFIED_CLAIMED_NOT_VERIFIED.md FRONTEND_HANDOFF_VNEXT.md CURRICULUM_SOURCE_MAP.md PHYSICS_GRADE_8_FULL_MAP.tsv PHYSICS_GRADE_9_FULL_MAP.tsv PHYSICS_GRADE_10_FULL_MAP.tsv PHYSICS_GRADE_11_FULL_MAP.tsv PHYSICS_ADVANCED_MAP.tsv AC_NAV_FINAL_LEDGER.tsv V4_FINAL_GATE_READY; do
            test -s "calculator-v4/docs/$file"
          done
          test "$(tail -n +2 calculator-v4/docs/AC_NAV_FINAL_LEDGER.tsv | wc -l)" -eq 135
          ! grep -R -n -E 'class[[:space:]]+(LiquidGlass|MainBrain|ControlSpace)|object[[:space:]]+(LiquidGlass|MainBrain|ControlSpace)' calculator-v4/app/src/main calculator-v4/core/src/main
          mkdir -p "$RUNNER_TEMP/veltrix-v4-final"
          printf 'repo=Rahmowin-1st/Veltrix-Hom-\nbranch=veltrix-calculator-backend-v4-reset\nsource_sha=%s\nbaseline_sha=%s\nrun_id=%s\njob=%s\nworkflow=V3\n' "$SOURCE_SHA" "$BASELINE_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB" | tee "$RUNNER_TEMP/veltrix-v4-final/provenance.txt"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: true

      - name: Clean core tests Android build and deterministic matrices
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          gradle --stacktrace clean :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          test -s "$APP_APK"; test -s "$TEST_APK"
          test "$(tail -n +3 core/build/registry-export.tsv | wc -l)" -eq 260
          diff -u docs/SUBJECT_COVERAGE_MATRIX.tsv core/build/subject-coverage-matrix.tsv
          diff -u docs/SOLVE_TARGET_MATRIX.tsv core/build/solve-target-matrix.tsv
          sha256sum "$APP_APK" "$TEST_APK" core/build/registry-export.tsv core/build/subject-coverage-matrix.tsv core/build/solve-target-matrix.tsv | tee "$RUNNER_TEMP/veltrix-v4-final/build-hashes.sha256"
          cp core/build/registry-export.tsv "$RUNNER_TEMP/veltrix-v4-final/registry-export.tsv"
          cp core/build/subject-coverage-matrix.tsv "$RUNNER_TEMP/veltrix-v4-final/generated-subject-coverage.tsv"
          cp core/build/solve-target-matrix.tsv "$RUNNER_TEMP/veltrix-v4-final/generated-solve-target.tsv"

      - name: Install Android SDK 36 and API 35 runtime
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SM="$(command -v sdkmanager || true)"; [ -n "$SM" ] || SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          "$SM" "platforms;android-36" "build-tools;35.0.0" "platform-tools" "emulator" "system-images;android-35;google_apis;x86_64" >/dev/null
          for d in "$SDK/platform-tools" "$SDK/emulator" "$(dirname "$SM")" "$SDK/build-tools/35.0.0"; do test -d "$d"; printf '%s\n' "$d" >> "$GITHUB_PATH"; done
          "$SM" --list_installed > "$RUNNER_TEMP/veltrix-v4-final/sdk-installed.txt"

      - name: Boot clean API 35 emulator
        run: |
          set -euxo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules; sudo udevadm trigger --name-match=kvm
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n veltrix_v4_final_api35 -k "system-images;android-35;google_apis;x86_64" -f
          nohup "$ANDROID_HOME/emulator/emulator" @veltrix_v4_final_api35 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-metrics -accel on > "$RUNNER_TEMP/veltrix-v4-final/emulator.log" 2>&1 &
          timeout 180 adb wait-for-device
          for i in $(seq 1 120); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break; sleep 2; done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          adb devices -l | tee "$RUNNER_TEMP/veltrix-v4-final/device.txt"
          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 0 || true
          adb shell wm dismiss-keyguard || true

      - name: Install exact APKs and cold launch
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          APP_APK=app/build/outputs/apk/debug/app-debug.apk
          TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb install -r -t "$APP_APK" | tee "$RUNNER_TEMP/veltrix-v4-final/install-app.txt"
          adb install -r -t "$TEST_APK" | tee "$RUNNER_TEMP/veltrix-v4-final/install-test.txt"
          adb shell am force-stop com.veltrix.calculator
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee "$RUNNER_TEMP/veltrix-v4-final/cold-launch.txt"
          grep -q 'Status: ok' "$RUNNER_TEMP/veltrix-v4-final/cold-launch.txt"
          sleep 1; adb shell uiautomator dump /sdcard/final-home.xml >/dev/null; adb pull /sdcard/final-home.xml "$RUNNER_TEMP/veltrix-v4-final/home.xml" >/dev/null
          grep -q 'content-desc="route-home"' "$RUNNER_TEMP/veltrix-v4-final/home.xml"

      - name: Core Android runtime suites and live currency
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/veltrix-v4-final"
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r'); test -n "$I"
          run_class(){ adb shell am instrument -w -e class "$1" "$I" | tee "$OUT/$2"; grep -q 'OK (' "$OUT/$2"; ! grep -q 'FAILURES!!!' "$OUT/$2"; }
          run_class com.veltrix.calculator.app.V4NavigationRuntimeTest navigation-runtime.txt
          run_class com.veltrix.calculator.app.V4WidgetRuntimeTest widget-runtime.txt
          run_class com.veltrix.calculator.app.BackendMasterRuntimeTest backend-runtime.txt
          run_class com.veltrix.calculator.app.Iteration11CurrencyRuntimeTest currency-runtime.txt
          adb shell am instrument -w -e liveProbe true -e class com.veltrix.calculator.app.LiveCurrencyRuntimeTest "$I" | tee "$OUT/live-currency-online.txt"
          grep -q 'OK (1 test)' "$OUT/live-currency-online.txt"

      - name: Real launcher pin five widgets and provider binding
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/veltrix-v4-final"
          dump_ui(){ adb shell uiautomator dump /sdcard/current.xml >/dev/null; adb pull /sdcard/current.xml "$OUT/$1.xml" >/dev/null; cp "$OUT/$1.xml" "$OUT/current.xml"; }
          tap_exact(){ dump_ui tap-source; read X Y < <(python3 - "$OUT/current.xml" "$1" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          r=ET.parse(sys.argv[1]).getroot(); w=sys.argv[2]
          for n in r.iter('node'):
              if n.attrib.get('content-desc')==w or n.attrib.get('text')==w:
                  m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      a,b,c,d=map(int,m.groups()); print((a+c)//2,(b+d)//2); raise SystemExit
          raise SystemExit(2)
          PY
          ); adb shell input tap "$X" "$Y"; sleep 1; }
          tap_add(){ dump_ui pin-dialog; read X Y < <(python3 - "$OUT/current.xml" <<'PY'
          import re,sys,xml.etree.ElementTree as ET
          r=ET.parse(sys.argv[1]).getroot(); c=[]
          for n in r.iter('node'):
              t=(n.attrib.get('text') or n.attrib.get('content-desc') or '').strip().lower()
              if t in {'add','add automatically','add to home screen'} or t.startswith('add '):
                  m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',n.attrib.get('bounds',''))
                  if m:
                      a,b,x,y=map(int,m.groups()); c.append(((a+x)//2,(b+y)//2))
          if not c: raise SystemExit(2)
          print(*c[-1])
          PY
          ); adb shell input tap "$X" "$Y"; sleep 2; }
          open_center(){ adb shell am force-stop com.veltrix.calculator; adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity >/dev/null; sleep 1; tap_exact home-menu; tap_exact nav-settings; tap_exact settings-widgets; }
          add_widget(){ local wire="$1" label="$2" provider="$3" seq="$4"; open_center; dump_ui "widget-center-$seq"; if ! grep -q "widget-add-$wire" "$OUT/widget-center-$seq.xml"; then adb shell input swipe 160 560 160 220 300; sleep 1; dump_ui "widget-center-$seq-scrolled"; cp "$OUT/widget-center-$seq-scrolled.xml" "$OUT/widget-center-$seq.xml"; fi; grep -q "widget-add-$wire" "$OUT/widget-center-$seq.xml"; tap_exact "widget-add-$wire"; dump_ui "pin-$seq"; grep -q "$label" "$OUT/pin-$seq.xml"; tap_add; dump_ui "post-pin-$seq"; if grep -q 'text="Save Widget"' "$OUT/post-pin-$seq.xml"; then tap_exact 'Save Widget'; dump_ui "post-config-$seq"; fi; adb shell input keyevent KEYCODE_HOME; sleep 1; adb shell dumpsys appwidget > "$OUT/appwidget-$seq.txt"; grep -q "$provider" "$OUT/appwidget-$seq.txt"; }
          add_widget mini-calculator 'Veltrix Mini Calculator' MiniCalculatorWidgetProvider mini1
          add_widget mini-calculator 'Veltrix Mini Calculator' MiniCalculatorWidgetProvider mini2
          add_widget quick-converter 'Veltrix Quick Converter' QuickConverterWidgetProvider quick
          add_widget currency-converter 'Veltrix Currency Converter' CurrencyConverterWidgetProvider currency
          add_widget currency-rate-board 'Veltrix Currency Rate Board' CurrencyRateBoardWidgetProvider board
          adb shell dumpsys appwidget > "$OUT/appwidget-final.txt"
          for p in MiniCalculatorWidgetProvider QuickConverterWidgetProvider CurrencyConverterWidgetProvider CurrencyRateBoardWidgetProvider; do grep -q "$p" "$OUT/appwidget-final.txt"; done

      - name: Widget resize multi-instance persistence offline reconnect
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/veltrix-v4-final"; I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r')
          run_method(){ adb shell am instrument -w -e class "com.veltrix.calculator.app.V4FinalRuntimeAcceptanceTest#$1" "$I" | tee "$OUT/$2"; grep -q 'OK (1 test)' "$OUT/$2"; }
          run_method aRealLauncherBoundProvidersResizeAndMultiInstance real-widget-bound-resize.txt
          run_method bSeedRealLauncherProcessDeathState real-widget-persist-seed.txt
          adb shell am force-stop com.veltrix.calculator; test -z "$(adb shell pidof com.veltrix.calculator 2>/dev/null | tr -d '\r' || true)"
          run_method cVerifyRealLauncherProcessDeathState real-widget-persist-after.txt
          run_method dOfflineDeterministicAndCachedCurrencyTruth offline-cache-truth.txt
          adb shell am instrument -w -e liveProbe true -e class com.veltrix.calculator.app.LiveCurrencyRuntimeTest "$I" | tee "$OUT/reconnect-live-currency.txt"
          grep -q 'OK (1 test)' "$OUT/reconnect-live-currency.txt"

      - name: Deep links restore semantic parents after true process death
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/veltrix-v4-final"
          restore(){ local name="$1" uri="$2" detail="$3" parent="$4"; adb shell am force-stop com.veltrix.calculator; adb shell am start -W -a android.intent.action.VIEW -d "$uri" com.veltrix.calculator | tee "$OUT/process-$name-launch.txt"; grep -q 'Status: ok' "$OUT/process-$name-launch.txt"; sleep 1; adb shell uiautomator dump "/sdcard/$name-before.xml" >/dev/null; adb pull "/sdcard/$name-before.xml" "$OUT/$name-before.xml" >/dev/null; grep -q "content-desc=\"$detail\"" "$OUT/$name-before.xml"; adb shell input keyevent KEYCODE_HOME; sleep 1; PID="$(adb shell pidof com.veltrix.calculator 2>/dev/null | tr -d '\r' | awk '{print $1}')"; test -n "$PID"; printf 'case=%s\npre_pid=%s\n' "$name" "$PID" | tee "$OUT/process-$name-kill.txt"; adb shell "run-as com.veltrix.calculator kill -9 $PID"; for i in $(seq 1 40); do CURRENT="$(adb shell pidof com.veltrix.calculator 2>/dev/null | tr -d '\r' || true)"; case " $CURRENT " in *" $PID "*) sleep 0.25;; *) break;; esac; done; CURRENT="$(adb shell pidof com.veltrix.calculator 2>/dev/null | tr -d '\r' || true)"; printf 'post_pid_list=%s\n' "$CURRENT" | tee -a "$OUT/process-$name-kill.txt"; case " $CURRENT " in *" $PID "*) exit 1;; esac; adb shell am start -W --activity-reorder-to-front -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee "$OUT/process-$name-restore.txt"; grep -q 'Status: ok' "$OUT/process-$name-restore.txt"; sleep 1; adb shell uiautomator dump "/sdcard/$name-after.xml" >/dev/null; adb pull "/sdcard/$name-after.xml" "$OUT/$name-after.xml" >/dev/null; grep -q "content-desc=\"$detail\"" "$OUT/$name-after.xml"; adb shell input keyevent KEYCODE_BACK; sleep 1; adb shell uiautomator dump "/sdcard/$name-parent.xml" >/dev/null; adb pull "/sdcard/$name-parent.xml" "$OUT/$name-parent.xml" >/dev/null; grep -q "content-desc=\"$parent\"" "$OUT/$name-parent.xml"; }
          restore tool 'veltrix://tool/physics-ohms-law' 'route-tool-physics-ohms-law' 'route-workspace-library'
          restore converter 'veltrix://converter/Length?from=km&to=mi&amount=100' 'route-converter-detail' 'route-workspace-converters'

      - name: Calculator converter integration performance no-freeze security
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/veltrix-v4-final"
          adb shell am force-stop com.veltrix.calculator; adb shell am start -W -a android.intent.action.VIEW -d 'veltrix://home/standard-calculator?expression=6*7' com.veltrix.calculator >/dev/null; sleep 1; adb shell uiautomator dump /sdcard/calc.xml >/dev/null; adb pull /sdcard/calc.xml "$OUT/calculator-before-converter.xml" >/dev/null; grep -q 'content-desc="route-home"' "$OUT/calculator-before-converter.xml"
          adb shell am start -W -a android.intent.action.VIEW -d 'veltrix://converter/Length?from=km&to=mi&amount=100' com.veltrix.calculator >/dev/null; sleep 1; adb shell uiautomator dump /sdcard/converter.xml >/dev/null; adb pull /sdcard/converter.xml "$OUT/converter-after-calculator.xml" >/dev/null; grep -q 'content-desc="route-converter-detail"' "$OUT/converter-after-calculator.xml"; grep -q 'content-desc="converter-amount"' "$OUT/converter-after-calculator.xml"
          adb logcat -c; printf 'sample\ttotalTimeMs\n' > "$OUT/startup-samples.tsv"; for i in $(seq 1 10); do adb shell am force-stop com.veltrix.calculator; R=$(adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity); T=$(printf '%s\n' "$R" | awk -F': ' '/TotalTime:/{print $2}' | tr -d '\r'); test -n "$T"; test "$T" -gt 0; printf '%s\t%s\n' "$i" "$T" >> "$OUT/startup-samples.tsv"; done
          awk 'NR>1{sum+=$2;if(min==0||$2<min)min=$2;if($2>max)max=$2} END{printf "samples=%d\nmin_ms=%d\navg_ms=%.1f\nmax_ms=%d\n",NR-1,min,sum/(NR-1),max}' "$OUT/startup-samples.tsv" | tee "$OUT/startup-summary.txt"
          I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r'); adb shell am instrument -w -e class 'com.veltrix.calculator.app.V4FinalRuntimeAcceptanceTest#eMeasuredBackendRuntimeOperations' "$I" | tee "$OUT/backend-performance.txt"; grep -q 'OK (1 test)' "$OUT/backend-performance.txt"
          for n in calculator_execute registry_lookup conversion navigation history_load currency_refresh widget_update widget_resize_classification repeated_interactions; do grep -q "VELTRIX_PERF name=$n" "$OUT/backend-performance.txt"; done
          adb logcat -d -v threadtime > "$OUT/performance-logcat.txt"; ! grep -E 'ANR in com\.veltrix\.calculator|FATAL EXCEPTION:.*com\.veltrix\.calculator' "$OUT/performance-logcat.txt"
          grep -q 'android:usesCleartextTraffic="false"' app/src/main/AndroidManifest.xml
          ! grep -R -n -E '(sk-[A-Za-z0-9_-]{20,}|AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)' app/src/main core/src/main
          grep -q 'applicationId = "com.veltrix.calculator"' app/build.gradle.kts; grep -q 'targetSdk = 36' app/build.gradle.kts; grep -q 'compileSdk = 36' app/build.gradle.kts
          adb shell dumpsys package com.veltrix.calculator > "$OUT/package.txt"; grep -q 'versionCode=2' "$OUT/package.txt"
          git -C .. diff --exit-code -- . ':(exclude)calculator-v4/.gradle/**' ':(exclude)calculator-v4/app/build/**' ':(exclude)calculator-v4/core/build/**'; git -C .. diff --cached --exit-code

      - name: Final uninstall reinstall relaunch critical smoke
        working-directory: calculator-v4
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/veltrix-v4-final"; APP_APK=app/build/outputs/apk/debug/app-debug.apk; TEST_APK=$(find app/build/outputs/apk/androidTest -name '*androidTest.apk' -type f | head -1)
          adb uninstall com.veltrix.calculator | tee "$OUT/uninstall.txt"; grep -q Success "$OUT/uninstall.txt"
          adb install -t "$APP_APK" | tee "$OUT/reinstall.txt"; grep -q Success "$OUT/reinstall.txt"
          adb shell am start -W -n com.veltrix.calculator/com.veltrix.calculator.app.MainActivity | tee "$OUT/relaunch.txt"; grep -q 'Status: ok' "$OUT/relaunch.txt"; sleep 1; adb shell uiautomator dump /sdcard/relaunch.xml >/dev/null; adb pull /sdcard/relaunch.xml "$OUT/relaunch.xml" >/dev/null; grep -q 'content-desc="route-home"' "$OUT/relaunch.xml"
          adb install -r -t "$TEST_APK" >/dev/null; I=$(adb shell pm list instrumentation | sed -n 's/^instrumentation:\([^ ]*\).*target=com.veltrix.calculator.*/\1/p' | head -1 | tr -d '\r'); adb shell am instrument -w -e class 'com.veltrix.calculator.app.BackendMasterRuntimeTest#aColdLaunchStandardAndScientificProgrammer' "$I" | tee "$OUT/post-reinstall-smoke.txt"; grep -q 'OK (1 test)' "$OUT/post-reinstall-smoke.txt"

      - name: Package exact tested source APK evidence docs and hashes
        run: |
          set -euxo pipefail
          OUT="$RUNNER_TEMP/veltrix-v4-final"; H="$OUT/handoff"; mkdir -p "$H/evidence" "$H/docs"
          git archive --format=zip --output="$H/VeltrixCalculator-V4-FINAL-TESTED-SOURCE.zip" "$SOURCE_SHA" calculator-v4 .github/workflows/veltrix-v4-final-clean-v3.yml
          cp calculator-v4/app/build/outputs/apk/debug/app-debug.apk "$H/VeltrixCalculator-V4-FINAL.apk"
          cp "$OUT"/*.txt "$OUT"/*.xml "$OUT"/*.tsv "$OUT"/*.sha256 "$H/evidence/" 2>/dev/null || true
          cp calculator-v4/docs/{NAVIGATION_ARCHITECTURE.md,LIBRARY_CATALOG_VNEXT.md,SUBJECT_RESEARCH_MAP.md,SUBJECT_COVERAGE_MATRIX.tsv,SOLVE_TARGET_MATRIX.tsv,CONVERTER_CATALOG_VNEXT.md,WIDGET_PRODUCT_SPEC.md,MIGRATION_REPORT.md,TEST_REPORT.md,VERIFIED_CLAIMED_NOT_VERIFIED.md,FRONTEND_HANDOFF_VNEXT.md,CURRICULUM_SOURCE_MAP.md,PHYSICS_GRADE_8_FULL_MAP.tsv,PHYSICS_GRADE_9_FULL_MAP.tsv,PHYSICS_GRADE_10_FULL_MAP.tsv,PHYSICS_GRADE_11_FULL_MAP.tsv,PHYSICS_ADVANCED_MAP.tsv,AC_NAV_FINAL_LEDGER.tsv} "$H/docs/"
          (cd "$H/evidence" && zip -qr "$H/VeltrixCalculator-V4-FINAL-GREEN-EVIDENCE.zip" .)
          cat > "$H/FINAL_HANDOFF_INDEX.md" <<EOF
          # Veltrix Calculator Backend V4 — Final Handoff Index
          repo=Rahmowin-1st/Veltrix-Hom-
          branch=veltrix-calculator-backend-v4-reset
          exact_tested_source_sha=$SOURCE_SHA
          ci_run_id=$GITHUB_RUN_ID
          job=$GITHUB_JOB
          workflow=Veltrix V4 Final Clean Proof V3
          artifact_name=veltrix-v4-final-handoff-$SOURCE_SHA
          registry_tools=260
          ac_nav_ledger_note=Exact original AC/NAV wording unavailable in indexed continuation source; ledger IDs remain fail-closed NOT VERIFIED until original mission is supplied.
          EOF
          (cd "$H" && sha256sum VeltrixCalculator-V4-FINAL.apk VeltrixCalculator-V4-FINAL-TESTED-SOURCE.zip VeltrixCalculator-V4-FINAL-GREEN-EVIDENCE.zip FINAL_HANDOFF_INDEX.md docs/* > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          test -s "$H/VeltrixCalculator-V4-FINAL.apk"; test -s "$H/VeltrixCalculator-V4-FINAL-TESTED-SOURCE.zip"; test -s "$H/VeltrixCalculator-V4-FINAL-GREEN-EVIDENCE.zip"
          git diff --exit-code -- . ':(exclude)calculator-v4/.gradle/**' ':(exclude)calculator-v4/app/build/**' ':(exclude)calculator-v4/core/build/**'; git diff --cached --exit-code

      - name: Upload exact final handoff artifact
        uses: actions/upload-artifact@v4
        with:
          name: veltrix-v4-final-handoff-${{ env.SOURCE_SHA }}
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/veltrix-v4-final/handoff/

      - name: Persist final run pointer on isolated evidence branch
        run: |
          set -euxo pipefail
          BR="evidence/v4-final-v3-${SOURCE_SHA}-${GITHUB_RUN_ID}"
          git config user.name veltrix-backend-bot; git config user.email veltrix-backend-bot@users.noreply.github.com
          git switch --detach "$SOURCE_SHA"; mkdir -p .ci/v4-final
          printf 'tested_source_sha=%s\nrun_id=%s\njob=%s\nworkflow=Veltrix V4 Final Clean Proof V3\nartifact_name=veltrix-v4-final-handoff-%s\n' "$SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_JOB" "$SOURCE_SHA" > ".ci/v4-final/${SOURCE_SHA}-v3.txt"
          git add ".ci/v4-final/${SOURCE_SHA}-v3.txt"; git commit -m "evidence(v4): final v3 run pointer $SOURCE_SHA"; git push origin "HEAD:refs/heads/$BR"
          echo "evidence_branch=$BR" | tee "$RUNNER_TEMP/veltrix-v4-final/evidence-branch.txt"

      - name: Stop emulator
        if: always()
