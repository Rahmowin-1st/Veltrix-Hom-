<!doctype html>
<html lang="uz" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#070B14" />
    <meta name="description" content="Veltrix Hom — uy vazifasi yordamchisi. Homework. Aniq. Source bilan." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Veltrix Hom</title>
    <script id="veltrix-theme-boot">
      // Applied before the first paint so the app never flashes white.
      (function () {
        try {
          var raw = localStorage.getItem('veltrix:ui');
          var pref = raw ? (JSON.parse(raw).state || {}).theme : null;
          var dark = pref === 'dark' ||
            ((!pref || pref === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.setAttribute('data-theme', dark ? 'dark' : 'light');
          el.style.background = dark ? '#050B16' : '#EFF4FB';
        } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
